apiVersion: v1
kind: Service
metadata:
  name: example-stable
  namespace: example
spec:
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    app: example
---
apiVersion: v1
kind: Service
metadata:
  name: example-canary
  namespace: example
spec:
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    app: example
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: example
  namespace: example
spec:
  parentRefs:
    - name: example
  hostnames:
    - example.internal
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: example-stable
          port: 80
          weight: 100
        - name: example-canary
          port: 80
          weight: 0
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: example-health
  namespace: example
spec:
  metrics:
    - name: application-health
      interval: 30s
      count: 5
      failureLimit: 2
      successCondition: result[0] == 1
      failureCondition: result[0] != 1
      provider:
        prometheus:
          address: http://vmsingle-vmks.monitoring.svc.cluster.local:8428
          query: vector(1)
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: example
  namespace: example
spec:
  replicas: 4
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: example
  template:
    metadata:
      labels:
        app: example
    spec:
      containers:
        - name: example
          image: ghcr.io/argoproj/rollouts-demo:blue
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
  strategy:
    canary:
      stableService: example-stable
      canaryService: example-canary
      trafficRouting:
        plugins:
          argoproj-labs/gatewayAPI:
            httpRoute: example
      steps:
        - setWeight: 10
        - pause:
            duration: 1m
        - setWeight: 25
        - analysis:
            templates:
              - templateName: example-health
        - setWeight: 50
        - pause: {}
