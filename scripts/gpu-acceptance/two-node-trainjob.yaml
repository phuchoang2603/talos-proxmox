apiVersion: v1
kind: Namespace
metadata:
  name: gpu-acceptance
---
apiVersion: trainer.kubeflow.org/v1alpha1
kind: TrainJob
metadata:
  name: accept-2node
  namespace: gpu-acceptance
spec:
  runtimeRef:
    name: aws-gpu-training
    kind: ClusterTrainingRuntime
    apiGroup: trainer.kubeflow.org
  activeDeadlineSeconds: 1500
  trainer:
    numNodes: 2
    env:
    - {name: NCCL_DEBUG, value: INFO}
    - {name: NCCL_DEBUG_SUBSYS, value: "INIT,NET"}
    - {name: NCCL_IB_DISABLE, value: "1"}
    - {name: NCCL_SOCKET_IFNAME, value: eth0}
    command:
    - bash
    - -c
    - |
      cat > /tmp/t.py <<'PY'
      import socket, time, torch, torch.distributed as dist
      dist.init_process_group("nccl")
      r, w = dist.get_rank(), dist.get_world_size()
      torch.cuda.set_device(0)
      p = torch.cuda.get_device_properties(0)
      print(f"RANK {r}/{w} host={socket.gethostname()} gpu={p.name} uuid={p.uuid} torch={torch.__version__} cuda={torch.version.cuda}", flush=True)
      t = torch.tensor([float(r + 1)], device="cuda")
      dist.all_reduce(t)
      expect = w * (w + 1) / 2
      print(f"RANK {r} allreduce={t.item()} expect={expect} ok={t.item() == expect}", flush=True)
      assert t.item() == expect
      x = torch.empty(64 * 1024 * 1024, dtype=torch.float32, device="cuda")
      for _ in range(3): dist.all_reduce(x)
      torch.cuda.synchronize(); t0 = time.time(); n = 10
      for _ in range(n): dist.all_reduce(x)
      torch.cuda.synchronize(); dt = (time.time() - t0) / n
      gbps = x.numel() * 4 / dt / 1e9
      print(f"RANK {r} allreduce_256MiB avg={dt:.3f}s algbw={gbps:.3f}GB/s ({gbps*8:.2f}Gbit/s)", flush=True)
      m = torch.nn.parallel.DistributedDataParallel(torch.nn.Linear(1024, 1024).cuda())
      opt = torch.optim.SGD(m.parameters(), lr=0.01)
      torch.manual_seed(r); losses = []
      for _ in range(5):
          opt.zero_grad(); loss = m(torch.randn(64, 1024, device="cuda")).pow(2).mean(); loss.backward(); opt.step(); losses.append(loss.item())
      print(f"RANK {r} ddp_losses={[round(l,4) for l in losses]} ok=True", flush=True)
      dist.barrier(); dist.destroy_process_group()
      PY
      torchrun /tmp/t.py
