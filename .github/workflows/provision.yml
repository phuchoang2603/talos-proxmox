name: Provision Environment

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      action:
        type: string
        default: apply
      revision:
        type: string
        default: ""
      purge_data:
        type: boolean
        default: false

jobs:
  provision:
    if: (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) || (inputs.environment == 'dev' && github.event_name == 'pull_request' && github.base_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: ${{ inputs.environment }}
    concurrency:
      group: provision-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: read
      id-token: write
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      TF_VAR_env: ${{ inputs.environment }}
      TF_IN_AUTOMATION: true
      TF_VAR_target_revision: ${{ inputs.revision || github.sha }}
      PURGE_DATA: ${{ inputs.purge_data && 'true' || 'false' }}
      PLAN_FLAGS: ${{ inputs.action == 'destroy' && '-destroy' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 0
      - name: Verify selected revision and production promotion
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ENVIRONMENT: ${{ inputs.environment }}
          ACTION: ${{ inputs.action }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          [[ "$TF_VAR_target_revision" =~ ^[0-9a-f]{40}$ ]]
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            git merge-base --is-ancestor "$PR_BASE_SHA" "$TF_VAR_target_revision"
          else
            git merge-base --is-ancestor "$TF_VAR_target_revision" origin/main
          fi
          if [ "$ENVIRONMENT" = dev ]; then
            [ "$TF_VAR_target_revision" = "$GITHUB_SHA" ] || { echo 'Dev must deploy the workflow SHA so promotion records identify the deployed revision.'; exit 1; }
          fi
          if [ "$ENVIRONMENT" = prod ] && [ "$ACTION" = apply ]; then
            deployments=$(gh api "repos/$GH_REPO/deployments?environment=dev&sha=$TF_VAR_target_revision&per_page=100" --jq '.[].id')
            validated=false
            for deployment in $deployments; do
              state=$(gh api "repos/$GH_REPO/deployments/$deployment/statuses?per_page=1" --jq 'any(.[]; .state == "success")')
              if [ "$state" = true ]; then validated=true; break; fi
            done
            [ "$validated" = true ] || { echo 'Production requires a successful dev deployment of this SHA.'; exit 1; }
          fi
      - uses: dopplerhq/cli-action@v3
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: v1.13.2
          tofu_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        if: inputs.environment == 'prod'
        with:
          role-to-assume: arn:aws:iam::142737101504:role/talos-proxmox-ci
          aws-region: us-east-1
          role-duration-seconds: 7200

      - name: Doppler credentials
        run: |
          pairs="HCP_TERRAFORM_TOKEN:TF_TOKEN_app_terraform_io"
          if [ "$TF_VAR_env" = dev ]; then
            pairs="$pairs TS_OAUTH_CLIENT_ID:TS_OAUTH_CLIENT_ID TS_OAUTH_SECRET:TS_OAUTH_SECRET"
          fi
          for pair in $pairs; do
            v="$(doppler secrets get "${pair%%:*}" --plain)"
            echo "::add-mask::${v}"
            echo "${pair#*:}=${v}" >> "$GITHUB_ENV"
          done
      - name: Require an existing dev cluster for automatic deployment
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: |
          doppler secrets get KUBECONFIG --plain >/dev/null 2>&1 || { echo 'Dev is absent. Recreate it with Manual Provision before automatic deployment.'; exit 1; }
      - uses: tailscale/github-action@v2
        if: inputs.environment == 'dev'
        with:
          oauth-client-id: ${{ env.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ env.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Allow current AWS management egress
        if: inputs.environment == 'prod'
        run: |
          address=$(curl --fail --silent --show-error https://checkip.amazonaws.com)
          python3 - "$address" <<'PYCODE'
          import ipaddress, json, os, sys
          cidr = str(ipaddress.IPv4Address(sys.argv[1])) + "/32"
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write("TF_VAR_aws_management_cidrs=" + json.dumps([cidr]) + "\n")
          PYCODE

      - name: Cluster
        working-directory: terraform/cluster/${{ inputs.environment }}
        env:
          TF_WORKSPACE: talos-cluster-${{ inputs.environment }}
        run: |
          tofu init -input=false
          # shellcheck disable=SC2086
          tofu plan -input=false -lock-timeout=5m -no-color ${PLAN_FLAGS} -var-file="../env/${TF_VAR_env}/main.tfvars" -out=.planfile
          tofu apply -input=false -lock-timeout=5m -auto-approve .planfile

      # Everything the platform root manages lives in the cluster just destroyed, so its state is
      # emptied instead of destroyed. This runs only after the cluster destroy succeeds.
      - name: Reset platform state
        if: inputs.action == 'destroy'
        working-directory: terraform/platform
        env:
          TF_WORKSPACE: talos-platform-${{ inputs.environment }}
        run: |
          tofu init -input=false
          tofu state list > .resources
          if [ -s .resources ]; then
            xargs tofu state rm < .resources
          fi

      - name: Platform
        if: inputs.action != 'destroy'
        working-directory: terraform/platform
        env:
          TF_WORKSPACE: talos-platform-${{ inputs.environment }}
        run: |
          tofu init -input=false
          tofu plan -input=false -lock-timeout=5m -no-color -out=.planfile
          tofu apply -input=false -lock-timeout=5m -auto-approve .planfile
