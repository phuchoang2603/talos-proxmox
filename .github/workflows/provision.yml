name: Provision

on:
  pull_request:
    branches: [main]
    paths:
      - terraform/cluster/**
      - terraform/platform/**
      - terraform/modules/**
      - '!terraform/modules/*/foundation/**'
      - apps/argocd/bootstrap/**
      - apps/components/argo-cd/**
      - apps/components/cilium/**
      - apps/components/cluster-autoscaler/**
      - apps/components/gateway-api/**
      - apps/components/talos-ccm/**
      - .github/workflows/provision.yml
  push:
    branches: [main]
    paths:
      - terraform/cluster/**
      - terraform/platform/**
      - terraform/modules/**
      - '!terraform/modules/*/foundation/**'
      - apps/argocd/bootstrap/**
      - apps/components/argo-cd/**
      - apps/components/cilium/**
      - apps/components/cluster-autoscaler/**
      - apps/components/gateway-api/**
      - apps/components/talos-ccm/**
      - .github/workflows/provision.yml
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [dev, prod]
        default: dev
      action:
        type: choice
        options: [apply, destroy]
        default: apply
      purge_data:
        description: Delete environment-owned persistent cloud data during destroy
        type: boolean
        default: false

jobs:
  provision:
    name: Provision (${{ inputs.environment || 'dev' }})
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && !startsWith(github.head_ref, 'renovate/'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: ${{ inputs.environment || 'dev' }}
    concurrency:
      group: provision-${{ inputs.environment || 'dev' }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      TF_VAR_env: ${{ inputs.environment || 'dev' }}
      TF_IN_AUTOMATION: true
      PURGE_DATA: ${{ inputs.purge_data && 'true' || 'false' }}
      PLAN_FLAGS: ${{ inputs.action == 'destroy' && '-destroy' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dopplerhq/cli-action@v3
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: v1.13.2
          tofu_wrapper: false

      - uses: google-github-actions/auth@v3
        if: env.TF_VAR_env == 'prod' && vars.CLOUD_PROVIDER == 'gcp'
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3
        if: env.TF_VAR_env == 'prod' && vars.CLOUD_PROVIDER == 'gcp'

      - uses: aws-actions/configure-aws-credentials@v4
        if: env.TF_VAR_env == 'prod' && vars.CLOUD_PROVIDER == 'aws'
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Doppler credentials
        run: |
          pairs="HCP_TERRAFORM_TOKEN:TF_TOKEN_app_terraform_io"
          if [ "$TF_VAR_env" = dev ]; then
            pairs="$pairs TS_OAUTH_CLIENT_ID:TS_OAUTH_CLIENT_ID TS_OAUTH_SECRET:TS_OAUTH_SECRET"
          fi
          for pair in $pairs; do
            v="$(doppler secrets get "${pair%%:*}" --plain)"
            echo "::add-mask::${v}"
            echo "${pair#*:}=${v}" >> "$GITHUB_ENV"
          done
      - uses: tailscale/github-action@v4
        if: env.TF_VAR_env == 'dev'
        with:
          oauth-client-id: ${{ env.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ env.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Allow current cloud management egress
        if: env.TF_VAR_env == 'prod'
        run: |
          address=$(curl --fail --silent --show-error https://api.ipify.org)
          python3 - "$address" <<'PYCODE'
          import ipaddress, json, os, sys
          cidr = str(ipaddress.IPv4Address(sys.argv[1])) + "/32"
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write("TF_VAR_management_cidrs=" + json.dumps([cidr]) + "\n")
          PYCODE

      - name: Cluster plan
        working-directory: terraform/cluster
        env:
          TF_WORKSPACE: talos-cluster-${{ env.TF_VAR_env }}
        run: |
          tofu init -input=false
          # shellcheck disable=SC2086
          tofu plan -input=false -lock-timeout=5m -no-color ${PLAN_FLAGS} -var-file="env/${TF_VAR_env}/main.tfvars" -out=.planfile

      - name: Cluster apply
        working-directory: terraform/cluster
        env:
          TF_WORKSPACE: talos-cluster-${{ env.TF_VAR_env }}
        run: tofu apply -input=false -lock-timeout=5m -auto-approve .planfile

      # Everything the platform root manages lives in the cluster just destroyed, so its state is
      # emptied instead of destroyed. This runs only after the cluster destroy succeeds.
      - name: Reset platform state
        if: inputs.action == 'destroy'
        working-directory: terraform/platform
        env:
          TF_WORKSPACE: talos-platform-${{ env.TF_VAR_env }}
        run: |
          tofu init -input=false
          tofu state list > .resources
          if [ -s .resources ]; then
            xargs -d '\n' tofu state rm < .resources
          fi

      - name: Platform
        if: inputs.action != 'destroy'
        working-directory: terraform/platform
        env:
          TF_WORKSPACE: talos-platform-${{ env.TF_VAR_env }}
        run: |
          tofu init -input=false
          tofu plan -input=false -lock-timeout=5m -no-color -out=.planfile
          tofu apply -input=false -lock-timeout=5m -auto-approve .planfile
