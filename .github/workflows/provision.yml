name: Provision Environment

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      action:
        type: string
        default: apply

jobs:
  provision:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: ${{ inputs.environment }}
    concurrency:
      group: provision-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      TF_VAR_env: ${{ inputs.environment }}
      TF_IN_AUTOMATION: true
      PLAN_FLAGS: ${{ inputs.action == 'destroy' && '-destroy' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dopplerhq/cli-action@v3
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.12.5
          tofu_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::142737101504:role/talos-proxmox-ci
          aws-region: us-east-1
          role-duration-seconds: 7200

      - name: Doppler credentials
        run: |
          for pair in TS_OAUTH_CLIENT_ID:TS_OAUTH_CLIENT_ID TS_OAUTH_SECRET:TS_OAUTH_SECRET \
            HCP_TERRAFORM_TOKEN:TF_TOKEN_app_terraform_io; do
            v="$(doppler secrets get "${pair%%:*}" --plain)"
            echo "::add-mask::${v}"
            echo "${pair#*:}=${v}" >> "$GITHUB_ENV"
          done
      - uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ env.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ env.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Cluster
        working-directory: terraform/cluster
        env:
          TF_WORKSPACE: talos-cluster-${{ inputs.environment }}
        run: |
          tofu init -input=false
          # shellcheck disable=SC2086
          tofu plan -input=false -no-color ${PLAN_FLAGS} -var-file="env/${TF_VAR_env}/main.tfvars" -out=.planfile
          tofu apply -input=false -auto-approve .planfile

      # Everything the platform root manages lives in the cluster just destroyed, so its state is
      # emptied instead of destroyed. This runs only after the cluster destroy succeeds.
      - name: Reset platform state
        if: inputs.action == 'destroy'
        working-directory: terraform/platform
        env:
          TF_WORKSPACE: talos-platform-${{ inputs.environment }}
        run: |
          tofu init -input=false
          tofu state list > .resources
          if [ -s .resources ]; then
            xargs tofu state rm < .resources
          fi

      - name: Platform
        if: inputs.action != 'destroy'
        working-directory: terraform/platform
        env:
          TF_WORKSPACE: talos-platform-${{ inputs.environment }}
        run: |
          tofu init -input=false
          tofu plan -input=false -no-color -out=.planfile
          tofu apply -input=false -auto-approve .planfile
