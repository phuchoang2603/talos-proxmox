name: Provision Environment

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      action:
        type: string
        default: apply

jobs:
  provision:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: ${{ inputs.environment }}
    concurrency:
      group: provision-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      DOPPLER_PROJECT: talos-proxmox
      DOPPLER_CONFIG: ${{ inputs.environment }}
      ENV_NAME: ${{ inputs.environment }}
      TF_VAR_env: ${{ inputs.environment }}
      TF_IN_AUTOMATION: true
      ACTION: ${{ inputs.action }}
    steps:
      - uses: actions/checkout@v4
      - uses: dopplerhq/cli-action@v3
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.12.5
          tofu_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        if: inputs.environment != 'argocd'
        with:
          role-to-assume: arn:aws:iam::142737101504:role/talos-proxmox-ci
          aws-region: us-east-1
          role-duration-seconds: 7200
      - uses: azure/setup-helm@v4
        if: inputs.action != 'destroy'
      - uses: azure/setup-kubectl@v4
        if: inputs.action != 'destroy'

      - name: Tailscale
        run: |
          for k in TS_OAUTH_CLIENT_ID TS_OAUTH_SECRET; do
            v=$(doppler secrets get "$k" --plain)
            echo "::add-mask::${v}"
            echo "${k}=${v}" >> "$GITHUB_ENV"
          done
      - uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ env.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ env.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: OpenTofu plan and provision
        run: .github/scripts/opentofu-ci.sh

      - name: Helm bootstrap
        if: inputs.action != 'destroy'
        env:
          KUBECONFIG: ${{ github.workspace }}/kubeconfig
        run: apps/bootstrap/run.sh
