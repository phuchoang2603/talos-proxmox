name: Lint

on:
  workflow_call:

jobs:
  terraform-lint:
    name: Terraform Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        stack: [terraform-provision]
    defaults:
      run:
        working-directory: ./${{ matrix.stack }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: v1.16.3

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

  platform-lint:
    name: Platform charts and bootstrap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Validate bootstrap and render platform charts
        run: apps/bootstrap/validate.sh
