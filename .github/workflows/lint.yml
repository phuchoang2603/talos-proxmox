name: Lint

on:
  workflow_call:

jobs:
  terraform-lint:
    name: Terraform Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        stack: [terraform/cluster, terraform/identity]
    defaults:
      run:
        working-directory: ./${{ matrix.stack }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.12.5

      - name: OpenTofu Init
        run: tofu init -backend=false

      - name: OpenTofu Format Check
        run: tofu fmt -check -recursive

      - name: OpenTofu Validate
        run: tofu validate

  platform-lint:
    name: Platform charts and bootstrap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint platform charts
        run: apps/bootstrap/validate.sh
