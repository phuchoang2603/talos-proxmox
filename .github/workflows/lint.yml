name: Lint

on:
  workflow_call:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: v1.13.2
          tofu_wrapper: false
      - uses: azure/setup-helm@v4
      - run: scripts/lint.sh
