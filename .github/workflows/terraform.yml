name: Provision and Bootstrap

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [argocd, dev, prod]
        default: argocd
      action:
        type: choice
        options: [apply, destroy]
        default: apply

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  provision:
    needs: lint
    strategy:
      matrix:
        environment: ${{ github.event_name == 'push' && fromJSON('["argocd","dev","prod"]') || fromJSON(format('["{0}"]', inputs.environment || 'argocd')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: ${{ matrix.environment }}
    concurrency:
      group: provision-${{ matrix.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: write
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      DOPPLER_PROJECT: talos-proxmox
      ENV_NAME: ${{ matrix.environment }}
      DOPPLER_CONFIG: ${{ matrix.environment }}
      TF_VAR_env: ${{ matrix.environment }}
      ACTION: ${{ inputs.action }}
    steps:
      - uses: actions/checkout@v4
      - uses: dopplerhq/cli-action@v3
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6
          terraform_wrapper: false
      - uses: azure/setup-helm@v4
        if: inputs.action != 'destroy'
      - uses: azure/setup-kubectl@v4
        if: inputs.action != 'destroy'

      - name: Tailscale
        run: |
          for k in TS_OAUTH_CLIENT_ID TS_OAUTH_SECRET; do
            v=$(doppler secrets get "$k" --plain)
            echo "::add-mask::${v}"
            echo "${k}=${v}" >> "$GITHUB_ENV"
          done
      - uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ env.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ env.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Terraform
        working-directory: terraform-provision
        run: |
          tf() {
            doppler run --only-secrets AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,PROXMOX_ENDPOINT,PROXMOX_USERNAME,PROXMOX_PASSWORD -- \
              bash -c 'export TF_VAR_proxmox_endpoint="$PROXMOX_ENDPOINT" TF_VAR_proxmox_username="$PROXMOX_USERNAME" TF_VAR_proxmox_password="$PROXMOX_PASSWORD"
                exec terraform "$@"' bash "$@"
          }
          tf init -backend-config="key=talos-${ENV_NAME}.tfstate"
          extra=()
          [ "$ACTION" = destroy ] && extra+=(-destroy)
          tf plan "${extra[@]}" -var-file="env/${ENV_NAME}/main.tfvars" -out .planfile
          tf apply -auto-approve .planfile
          [ "$ACTION" = destroy ] && exit 0
          tf output -raw kubeconfig | doppler secrets set --silent --type yaml KUBECONFIG
          tf output -raw talosconfig | doppler secrets set --silent --type yaml TALOSCONFIG
          tf output -raw kubeconfig > "$GITHUB_WORKSPACE/kubeconfig"
          chmod 600 "$GITHUB_WORKSPACE/kubeconfig"

      - name: Helm bootstrap
        if: inputs.action != 'destroy'
        env:
          KUBECONFIG: ${{ github.workspace }}/kubeconfig
        run: |
          if [ "${ENV_NAME}" = argocd ]; then
            apps/bootstrap/bootstrap.sh
          elif [ "$(jq '[.[] | select(.role == "longhorn")] | length' "terraform-provision/env/${ENV_NAME}/k8s_nodes.json")" -gt 0 ]; then
            doppler run --only-secrets CLOUDFLARE_TUNNEL_TOKEN,LONGHORN_AWS_ENDPOINTS,LONGHORN_AWS_ACCESS_KEY_ID,LONGHORN_AWS_SECRET_ACCESS_KEY -- apps/bootstrap/bootstrap.sh
          else
            doppler run --only-secrets CLOUDFLARE_TUNNEL_TOKEN -- apps/bootstrap/bootstrap.sh
          fi

      - name: Helm bootstrap Argo CD and apply platform roots
        if: inputs.action != 'destroy' && env.ENV_NAME == 'argocd'
        env:
          KUBECONFIG: ${{ github.workspace }}/kubeconfig
        run: |
          chmod +x apps/bootstrap/bootstrap-argocd.sh
          export DOPPLER_READ_TOKEN="$(doppler secrets get DOPPLER_READ_TOKEN --plain)"
          apps/bootstrap/bootstrap-argocd.sh
