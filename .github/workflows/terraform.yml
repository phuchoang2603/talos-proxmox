name: Provision

on:
  pull_request:
    branches: [main]
    paths:
      - terraform/**
      - apps/**
      - .github/workflows/**
  push:
    branches: [main]
    paths:
      - terraform/**
      - apps/**
      - .github/workflows/**

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  # Dev is built and destroyed only through manual.yml.
  provision:
    name: Provision (prod)
    if: github.event_name == 'push'
    needs: lint
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/provision.yml
    with:
      environment: prod
    secrets: inherit
