name: Provision and Bootstrap

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  terraform-plan-apply:
    runs-on: ubuntu-latest
    needs: lint

    permissions:
      contents: read
      id-token: write
      pull-requests: write

    defaults:
      run:
        shell: bash
        working-directory: ./terraform-provision

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Set Vault Role
        id: set-role
        run: |
          if [ "${{ github.event_name }}" == "push" ]; then
            echo "role=${{ vars.ENV_NAME }}-github-actions-push-role" >> $GITHUB_OUTPUT
          else
            echo "role=${{ vars.ENV_NAME }}-github-actions-pr-role" >> $GITHUB_OUTPUT
          fi

      - name: Import secrets from Vault
        uses: hashicorp/vault-action@v3
        id: vault_auth
        with:
          method: jwt
          url: ${{ vars.VAULT_ADDR }}
          role: ${{ steps.set-role.outputs.role }}
          outputToken: true
          secrets: |
            kv/shared/data/minio access_key | AWS_ACCESS_KEY_ID ;
            kv/shared/data/minio secret_key | AWS_SECRET_ACCESS_KEY ;
            kv/shared/data/proxmox ** | TF_VAR_proxmox_ ;

      - name: Terraform Init (Provision)
        run: terraform init --backend-config="key=talos-${{ vars.ENV_NAME }}.tfstate"

      - name: Terraform Plan (Provision)
        env:
          TF_VAR_env: ${{ vars.ENV_NAME }}
          VAULT_ADDR: ${{ vars.VAULT_ADDR }}
          VAULT_TOKEN: ${{ steps.vault_auth.outputs.vault_token }}
        run: |
          PLAN_ARGS=""
          if [ "${{ vars.DESTROY }}" == "true" ]; then
            PLAN_ARGS="-destroy"
          fi

          terraform plan $PLAN_ARGS -var-file="env/${{ vars.ENV_NAME }}/main.tfvars" -out .planfile

      - name: Post PR comment (Provision)
        uses: borchero/terraform-plan-comment@v2
        if: github.event_name == 'pull_request'
        with:
          token: ${{ github.token }}
          working-directory: "./terraform-provision"
          planfile: .planfile

      - name: Terraform Apply (Provision)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        working-directory: ./terraform-provision
        env:
          TF_VAR_env: ${{ vars.ENV_NAME }}
          VAULT_ADDR: ${{ vars.VAULT_ADDR }}
          VAULT_TOKEN: ${{ steps.vault_auth.outputs.vault_token }}
        run: terraform apply -auto-approve .planfile

  helm-bootstrap:
    runs-on: ubuntu-latest
    needs: terraform-plan-apply
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DESTROY != 'true'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Set Vault Role
        id: set-role
        run: echo "role=${{ vars.ENV_NAME }}-github-actions-push-role" >> $GITHUB_OUTPUT

      - name: Import Secrets from Vault
        uses: hashicorp/vault-action@v3
        id: vault_auth
        with:
          method: jwt
          url: ${{ vars.VAULT_ADDR }}
          role: ${{ steps.set-role.outputs.role }}
          outputToken: true
          secrets: |
            kv/shared/data/minio endpoint | LONGHORN_AWS_ENDPOINTS ;
            kv/shared/data/minio longhorn_a_key | LONGHORN_AWS_ACCESS_KEY_ID ;
            kv/shared/data/minio longhorn_s_key | LONGHORN_AWS_SECRET_ACCESS_KEY ;

      - uses: eLco/setup-vault@v1
        with:
          vault_version: 1.21.0

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Write kubeconfig
        env:
          VAULT_ADDR: ${{ vars.VAULT_ADDR }}
          VAULT_TOKEN: ${{ steps.vault_auth.outputs.vault_token }}
          ENV_NAME: ${{ vars.ENV_NAME }}
        run: |
          vault kv get -field=kubeconfig "kv/${ENV_NAME}/talos" > "${GITHUB_WORKSPACE}/kubeconfig"
          chmod 600 "${GITHUB_WORKSPACE}/kubeconfig"

      - name: Bootstrap Helm apps
        env:
          KUBECONFIG: ${{ github.workspace }}/kubeconfig
          ENV_NAME: ${{ vars.ENV_NAME }}
        run: |
          chmod +x apps/bootstrap.sh
          apps/bootstrap.sh
