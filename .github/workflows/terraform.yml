name: Provision and Bootstrap

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [dev, prod, gpu]
        default: dev
      action:
        type: choice
        options: [apply, destroy]
        default: apply

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  provision:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}
    concurrency:
      group: provision-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
      deployments: write
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      DOPPLER_PROJECT: talos-proxmox
      ENV_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}
      DOPPLER_CONFIG: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}
      TF_VAR_env: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}
      ACTION: ${{ inputs.action }}
    steps:
      - uses: actions/checkout@v4
      - uses: dopplerhq/cli-action@v3
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6
          terraform_wrapper: false
      - uses: azure/setup-helm@v4
        if: github.event_name != 'pull_request' && inputs.action != 'destroy'
      - uses: azure/setup-kubectl@v4
        if: github.event_name != 'pull_request' && inputs.action != 'destroy'

      - name: Tailscale
        run: |
          for k in TS_OAUTH_CLIENT_ID TS_OAUTH_SECRET; do
            v=$(doppler secrets get "$k" --plain)
            echo "::add-mask::${v}"
            echo "${k}=${v}" >> "$GITHUB_ENV"
          done
      - uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ env.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ env.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Terraform
        working-directory: terraform-provision
        env:
          APPLY: ${{ github.event_name != 'pull_request' }}
        run: |
          tf() {
            doppler run --only-secrets AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,PROXMOX_ENDPOINT,PROXMOX_USERNAME,PROXMOX_PASSWORD -- \
              bash -c 'export TF_VAR_proxmox_endpoint="$PROXMOX_ENDPOINT" TF_VAR_proxmox_username="$PROXMOX_USERNAME" TF_VAR_proxmox_password="$PROXMOX_PASSWORD"
                exec terraform "$@"' bash "$@"
          }
          tf init -backend-config="key=talos-${ENV_NAME}.tfstate"
          extra=()
          [ "$ACTION" = destroy ] && extra+=(-destroy)
          tf plan "${extra[@]}" -var-file="env/${ENV_NAME}/main.tfvars" -out .planfile
          [ "$APPLY" = true ] || exit 0
          tf apply -auto-approve .planfile
          [ "$ACTION" = destroy ] && exit 0
          tf output -raw kubeconfig | doppler secrets set --silent --type yaml KUBECONFIG
          tf output -raw talosconfig | doppler secrets set --silent --type yaml TALOSCONFIG
          tf output -raw kubeconfig > "$GITHUB_WORKSPACE/kubeconfig"
          chmod 600 "$GITHUB_WORKSPACE/kubeconfig"

      - uses: borchero/terraform-plan-comment@v2
        if: github.event_name == 'pull_request'
        with:
          token: ${{ github.token }}
          working-directory: terraform-provision
          planfile: .planfile

      - name: Helm bootstrap
        if: github.event_name != 'pull_request' && inputs.action != 'destroy'
        env:
          KUBECONFIG: ${{ github.workspace }}/kubeconfig
        run: doppler run --only-secrets LONGHORN_AWS_ENDPOINTS,LONGHORN_AWS_ACCESS_KEY_ID,LONGHORN_AWS_SECRET_ACCESS_KEY -- apps/bootstrap.sh
