name: Provision

on:
  pull_request:
    branches: [main]
    paths:
      - terraform/**
      - apps/**
      - .github/workflows/**
  push:
    branches: [main]
    paths:
      - terraform/**
      - apps/**
      - .github/workflows/**

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  dev:
    name: Provision (dev)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    needs: lint
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/provision.yml
    with:
      environment: dev
    secrets: inherit

  prod:
    name: ${{ github.event_name == 'pull_request' && 'Plan (prod)' || 'Provision (prod)' }}
    if: (github.event_name == 'push' && vars.PROD_SUSPENDED != 'true') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    needs: lint
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/provision.yml
    with:
      environment: prod
      action: ${{ github.event_name == 'pull_request' && 'plan' || 'apply' }}
    secrets: inherit
