name: Manual Provision

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [dev, prod]
        default: dev
      action:
        type: choice
        options: [apply, destroy]
        default: apply
      revision:
        description: Optional full main commit SHA (defaults to the workflow revision)
        type: string
      purge_data:
        description: Delete environment-owned persistent cloud data during destroy
        type: boolean
        default: false

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  provision:
    name: Provision (${{ inputs.environment }})
    if: github.ref == 'refs/heads/main'
    needs: lint
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/provision.yml
    with:
      environment: ${{ inputs.environment }}
      action: ${{ inputs.action }}
      revision: ${{ inputs.revision }}
      purge_data: ${{ inputs.purge_data }}
    secrets: inherit
