# Talos 1.13: https://www.talos.dev/v1.13/kubernetes-guides/network/deploying-cilium/
ipam:
  mode: kubernetes
kubeProxyReplacement: true
k8sServiceHost: localhost
k8sServicePort: "7445"
securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup
devices: eth0
l2announcements:
  enabled: true
k8sClientRateLimit:
  qps: 20
  burst: 40
loadBalancer:
  acceleration: best-effort
gatewayAPI:
  enabled: true
  enableAlpn: true
  enableAppProtocol: true
hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: true
