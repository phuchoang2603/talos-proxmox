# Talos 1.13: https://www.talos.dev/v1.13/kubernetes-guides/network/deploying-cilium/
ipam:
  mode: kubernetes
kubeProxyReplacement: true
k8sServiceHost: localhost
k8sServicePort: "7445"
securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup
devices: eth0
l2announcements:
  enabled: true
k8sClientRateLimit:
  qps: 20
  burst: 40
loadBalancer:
  acceleration: best-effort
encryption:
  enabled: true
  type: wireguard
authentication:
  mutual:
    spire:
      enabled: true
      install:
        enabled: true
        existingNamespace: true
        server:
          podSecurityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          initContainers:
            - name: fix-permissions
              image: docker.io/library/busybox:1.37.0
              command: ["sh", "-c"]
              args:
                - chown -R 1000:1000 /run/spire/data /tmp/spire-server
              securityContext:
                runAsUser: 0
                runAsGroup: 0
              volumeMounts:
                - name: spire-data
                  mountPath: /run/spire/data
                - name: spire-server-socket
                  mountPath: /tmp/spire-server
l7Proxy: true
envoy:
  enabled: true
cluster:
  name: talos
  id: 1
gatewayAPI:
  enabled: true
  enableAlpn: true
  enableAppProtocol: true
hubble:
  enabled: false
