{{- range $name, $keys := dict "datahub-auth-secrets" (dict "system_client_secret" "DATAHUB_SYSTEM_CLIENT_SECRET" "token_service_signing_key" "DATAHUB_TOKEN_SIGNING_KEY" "token_service_salt" "DATAHUB_TOKEN_SALT") "datahub-encryption-secrets" (dict "encryption_key_secret" "DATAHUB_ENCRYPTION_KEY") "datahub-postgres-credentials" (dict "password" "DATAHUB_POSTGRES_PASSWORD") "datahub-frontend-users" (dict "user.props" "DATAHUB_FRONTEND_USERS") }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: {{ $name }}
    template:
      type: Opaque
      {{- if eq $name "datahub-postgres-credentials" }}
      data:
        username: datahub
        password: {{ `"{{ .password }}"` }}
      {{- end }}
  data:
  {{- range $local, $remote := $keys }}
    - secretKey: {{ $local }}
      remoteRef:
        key: {{ $remote }}
  {{- end }}
---
{{- end }}
