aws-ebs-csi-driver:
  awsAccessSecret:
    name: ebs-csi-aws
    keyId: AWS_ACCESS_KEY_ID
    accessKey: AWS_SECRET_ACCESS_KEY
  controller:
    replicaCount: 1
    region: us-east-1
    extraVolumeTags:
      managed-by: talos-proxmox
      platform-cluster: prod-talos
    resources:
      requests: {cpu: 20m, memory: 64Mi}
      limits: {memory: 256Mi}
  node:
    enableWindows: false
    resources:
      requests: {cpu: 10m, memory: 40Mi}
      limits: {memory: 128Mi}
