# Chart defaults: in-cluster Cloudflare Tunnel to the Cilium Gateway origin.
replicaCount: 1

image:
  repository: cloudflare/cloudflared
  tag: "2026.5.0"
  pullPolicy: IfNotPresent

# cloudflared reads the token only at startup; restart it from Argo CD after a rotation.
tunnel:
  existingSecret: cloudflare-tunnel-token
  existingSecretKey: token
  dopplerKey: CLOUDFLARE_TUNNEL_TOKEN
  refreshInterval: 1h

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 128Mi
