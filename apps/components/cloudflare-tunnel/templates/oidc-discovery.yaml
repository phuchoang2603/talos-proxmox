apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: service-account-issuer-discovery-public
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:service-account-issuer-discovery
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: system:unauthenticated
---
apiVersion: networking.cfargotunnel.com/v1alpha1
kind: TunnelBinding
metadata:
  name: oidc-discovery
  namespace: default
subjects:
  - kind: Service
    name: kubernetes
    spec:
      fqdn: {{ required "oidcDiscovery.hostname is required" .Values.oidcDiscovery.hostname }}
      protocol: https
      target: https://kubernetes.default.svc:443
      path: ^/(\.well-known/openid-configuration|openid/v1/jwks)$
tunnelRef:
  kind: ClusterTunnel
  name: {{ .Values.clusterTunnel }}
