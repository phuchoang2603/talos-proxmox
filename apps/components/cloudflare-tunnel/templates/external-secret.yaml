apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.cloudflare.secret }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: {{ .Values.cloudflare.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: {{ .Values.cloudflare.secret }}
    template:
      engineVersion: v2
      data:
        CLOUDFLARE_API_TOKEN: {{ "{{ .apiToken }}" | quote }}
        # A tunnel token is base64 JSON whose `s` field is the tunnel secret.
        CLOUDFLARE_TUNNEL_CREDENTIAL_SECRET: {{ "{{ (.tunnelToken | b64dec | fromJson).s }}" | quote }}
  data:
    - secretKey: apiToken
      remoteRef:
        key: CLOUDFLARE_API_TOKEN
    - secretKey: tunnelToken
      remoteRef:
        key: CLOUDFLARE_TUNNEL_TOKEN
