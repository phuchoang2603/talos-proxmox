{{- $manifests := .Files.Get "files/cloudflare-operator.yaml"
  | replace "cloudflare-operator-system" .Release.Namespace
  | replace "webhook-server-cert" "cloudflare-operator-webhook-server-cert"
  | replace "metrics-server-cert" "cloudflare-operator-metrics-server-cert"
  | replace "- --leader-elect" (printf "- --leader-elect\n        - --cluster-resource-namespace=%s" .Release.Namespace)
}}
{{- range $manifest := splitList "\n---\n" $manifests }}
{{- if ne (fromYaml $manifest).kind "Namespace" }}
{{- $resource := fromYaml $manifest }}
{{- if has $resource.kind (list "Certificate" "Issuer") }}
{{- $_ := set $resource.metadata "annotations" (merge (dict "argocd.argoproj.io/sync-wave" "-1") ($resource.metadata.annotations | default dict)) }}
---
{{ toYaml $resource }}
{{- else }}
---
{{ $manifest }}
{{- end }}
{{- end }}
{{- end }}
