apiVersion: v1
kind: ServiceAccount
metadata:
  name: burst-node-gc
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: burst-node-gc
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [list, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: burst-node-gc
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: burst-node-gc
subjects:
  - kind: ServiceAccount
    name: burst-node-gc
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: burst-node-gc
  namespace: {{ .Release.Namespace }}
spec:
  schedule: {{ .Values.burstNodeGC.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          serviceAccountName: burst-node-gc
          restartPolicy: Never
          nodeSelector:
            node-role.kubernetes.io/control-plane: ""
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: gc
              image: {{ .Values.burstNodeGC.image }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              env:
                - name: HOME
                  value: /tmp
                - name: NODE_SELECTOR
                  value: {{ .Values.burstNodeGC.nodeSelector | quote }}
                - name: NOT_READY_SECONDS
                  value: {{ .Values.burstNodeGC.notReadySeconds | quote }}
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  kubectl get nodes -l "${NODE_SELECTOR}" -o json \
                    | jq -r --argjson age "${NOT_READY_SECONDS}" '
                        .items[]
                        | select(any(.status.conditions[]?;
                            .type == "Ready" and .status != "True"
                            and (.lastTransitionTime | fromdateiso8601) < (now - $age)))
                        | .metadata.name' \
                    | while read -r node; do
                        kubectl delete node "${node}" --wait=false
                      done
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
          volumes:
            - name: tmp
              emptyDir: {}
