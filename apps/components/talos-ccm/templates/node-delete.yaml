apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: talos-ccm-node-delete
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: talos-ccm-node-delete
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: talos-ccm-node-delete
subjects:
  - kind: ServiceAccount
    name: talos-cloud-controller-manager
    namespace: {{ .Release.Namespace }}
