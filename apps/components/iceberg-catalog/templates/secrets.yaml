{{- range $name, $data := dict "iceberg-database" (dict "password" "ICEBERG_POSTGRES_PASSWORD") "iceberg-bootstrap" (dict "clientSecret" "ICEBERG_CLIENT_SECRET") "iceberg-signing" (dict "private.pem" "ICEBERG_TOKEN_PRIVATE_KEY" "public.pem" "ICEBERG_TOKEN_PUBLIC_KEY") "iceberg-storage" (dict "AWS_ACCESS_KEY_ID" "OBJECT_LAKEHOUSE_ACCESS_KEY_ID" "AWS_SECRET_ACCESS_KEY" "OBJECT_LAKEHOUSE_SECRET_ACCESS_KEY") }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: {{ $name }}
    {{- if eq $name "iceberg-database" }}
    template:
      type: kubernetes.io/basic-auth
      data:
        username: iceberg
        password: {{ `"{{ .password }}"` }}
        jdbcUrl: jdbc:postgresql://iceberg-postgres-rw:5432/iceberg?sslmode=require&currentSchema=public
    {{- else if eq $name "iceberg-bootstrap" }}
    template:
      data:
        client-id: platform
        client-secret: {{ `"{{ .clientSecret }}"` }}
        credentials.yaml: |
          PLATFORM:
            client-id: platform
            client-secret: {{ `"{{ .clientSecret }}"` }}
    {{- end }}
  data:
    {{- range $key, $remote := $data }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ $remote }}
    {{- end }}
{{- end }}
