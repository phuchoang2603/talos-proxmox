apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: iceberg-postgres
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:16.13
  bootstrap:
    initdb:
      database: iceberg
      owner: iceberg
      secret:
        name: iceberg-database
  storage:
    storageClass: {{ .Values.storageClass | quote }}
    size: 5Gi
  resources:
    requests: {cpu: 50m, memory: 256Mi}
    limits: {memory: 1Gi}
