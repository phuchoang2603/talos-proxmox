{{- $name := .Values.store.mongodb.name }}
apiVersion: mongodbcommunity.mongodb.com/v1
kind: MongoDBCommunity
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
spec:
  members: 1
  type: ReplicaSet
  version: "8.0.16"
  security:
    authentication:
      modes: ["SCRAM"]
  users:
    - name: hyperdx
      db: hyperdx
      passwordSecretRef:
        name: {{ $name }}-password
      roles:
        - name: dbOwner
          db: hyperdx
        - name: clusterMonitor
          db: admin
      scramCredentialsSecretName: {{ $name }}-scram
  statefulSet:
    spec:
      template:
        spec:
          containers:
            - name: mongod
              resources:
                requests:
                  cpu: 50m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
            - name: mongodb-agent
              resources:
                requests:
                  cpu: 25m
                  memory: 128Mi
                limits:
                  memory: 256Mi
  additionalMongodConfig:
    storage.wiredTiger.engineConfig.cacheSizeGB: 0.25
    storage.wiredTiger.engineConfig.journalCompressor: zlib
---
# MCK runs database pods as this ServiceAccount but creates it only in its own namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mongodb-kubernetes-appdb
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mongodb-kubernetes-appdb
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods]
    verbs: [patch, delete, get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mongodb-kubernetes-appdb
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mongodb-kubernetes-appdb
subjects:
  - kind: ServiceAccount
    name: mongodb-kubernetes-appdb
    namespace: {{ .Release.Namespace }}
