apiVersion: networking.cfargotunnel.com/v1alpha1
kind: TunnelBinding
metadata:
  name: grafana
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: Service
    name: grafana
    spec:
      fqdn: {{ .Values.tunnel.hostname }}
      target: http://grafana.{{ .Release.Namespace }}.svc.cluster.local:80
tunnelRef:
  kind: ClusterTunnel
  name: {{ .Values.tunnel.clusterTunnel }}
