apiVersion: networking.cfargotunnel.com/v1alpha1
kind: TunnelBinding
metadata:
  name: hyperdx
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: Service
    name: hyperdx-auth
    spec:
      fqdn: {{ .Values.global.hyperdxHostname }}
      target: http://hyperdx-auth.{{ .Release.Namespace }}.svc.cluster.local:80
tunnelRef:
  kind: ClusterTunnel
  name: {{ .Values.tunnel.clusterTunnel }}
