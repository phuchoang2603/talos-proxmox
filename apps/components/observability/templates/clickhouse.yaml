{{- $store := .Values.store }}
{{- /*
The operator mounts the data volume through subPaths. On local-path hostPath volumes the
kubelet creates missing subPath directories as root and ignores fsGroup, so they are
created here first, owned by the server's uid 101.
*/}}
{{- define "observability.volumePermissions" -}}
- name: volume-permissions
  image: {{ printf "%s:%s" .repository .tag }}
  command:
    - sh
    - -c
    - mkdir -p /data/var-lib-clickhouse /data/var-log-clickhouse && chown 101:101 /data/var-lib-clickhouse /data/var-log-clickhouse
  securityContext:
    runAsUser: 0
    runAsNonRoot: false
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
      add: [CHOWN]
  volumeMounts:
    - name: clickhouse-storage-volume
      mountPath: /data
{{- end }}
apiVersion: clickhouse.com/v1alpha1
kind: KeeperCluster
metadata:
  name: {{ $store.clickhouse.name }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  containerTemplate:
    image:
      {{- toYaml $store.keeper.image | nindent 6 }}
    resources:
      {{- toYaml $store.keeper.resources | nindent 6 }}
  podTemplate:
    nodeSelector:
      kubernetes.io/hostname: {{ $store.nodeName }}
    initContainers:
      {{- include "observability.volumePermissions" $store.keeper.image | nindent 6 }}
  dataVolumeClaimSpec:
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: {{ $store.keeper.storage }}
---
apiVersion: clickhouse.com/v1alpha1
kind: ClickHouseCluster
metadata:
  name: {{ $store.clickhouse.name }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  shards: 1
  keeperClusterRef:
    name: {{ $store.clickhouse.name }}
  containerTemplate:
    image:
      {{- toYaml $store.clickhouse.image | nindent 6 }}
    resources:
      {{- toYaml $store.clickhouse.resources | nindent 6 }}
    env:
      - name: CLICKHOUSE_OTEL_PASSWORD
        valueFrom:
          secretKeyRef:
            name: clickhouse-credentials
            key: otel-password
      - name: CLICKHOUSE_APP_PASSWORD
        valueFrom:
          secretKeyRef:
            name: clickhouse-credentials
            key: app-password
  podTemplate:
    nodeSelector:
      kubernetes.io/hostname: {{ $store.nodeName }}
    initContainers:
      {{- include "observability.volumePermissions" $store.clickhouse.image | nindent 6 }}
  dataVolumeClaimSpec:
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: {{ $store.clickhouse.storage }}
  settings:
    defaultUserPassword:
      secret:
        name: clickhouse-credentials
        key: default-password
    systemLogsTTLDays: 7
    logger:
      level: information
      size: 100M
      count: 10
    # Passwords are substituted from the container environment when the server loads users.
    extraUsersConfig:
      users:
        otelcollector:
          password:
            "@from_env": CLICKHOUSE_OTEL_PASSWORD
          profile: default
          grants:
            - query: "GRANT SELECT,INSERT,CREATE,SHOW ON default.*"
        app:
          password:
            "@from_env": CLICKHOUSE_APP_PASSWORD
          profile: default
          grants:
            - query: "GRANT SHOW ON *.*, SELECT ON system.*, SELECT ON default.*"
    extraConfig:
      max_connections: 4096
      keep_alive_timeout: 64
      max_concurrent_queries: 100
      # Shares prod-server1's SSD with etcd.
      background_pool_size: 4
      storage_configuration:
        disks:
          default:
            keep_free_space_bytes: {{ int64 $store.clickhouse.keepFreeSpaceBytes }}
