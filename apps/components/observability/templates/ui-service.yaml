apiVersion: v1
kind: Service
metadata:
  name: hyperdx-ui
  namespace: {{ .Release.Namespace }}
  annotations:
    lbipam.cilium.io/ips: {{ .Values.global.hyperdxAddress | quote }}
spec:
  type: LoadBalancer
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    app.kubernetes.io/name: hyperdx-auth
    app.kubernetes.io/instance: {{ .Release.Name }}
