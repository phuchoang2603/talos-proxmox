apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: hyperdx
  namespace: {{ .Release.Namespace }}
spec:
  gatewayClassName: cilium
  addresses:
    - type: IPAddress
      value: {{ .Values.global.hyperdxAddress }}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hyperdx
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: hyperdx
      sectionName: http
  rules:
    - backendRefs:
        - name: {{ .Values.clickstack.fullnameOverride }}
          port: {{ .Values.clickstack.hyperdx.ports.app | default 3000 }}
