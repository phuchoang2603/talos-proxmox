{{- $store := .Values.store }}
{{- $archive := $store.archive }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-archive-export
  namespace: {{ .Release.Namespace }}
data:
  export.sql: |
    CREATE DATABASE IF NOT EXISTS archive;
    {{- range $archive.tables }}
    CREATE TABLE IF NOT EXISTS archive.{{ .name }}
    ENGINE = S3(rustfs, url = '{{ $archive.url }}/{{ trimPrefix "otel_" .name }}/{_partition_id}.parquet', format = 'Parquet')
    PARTITION BY formatDateTime({{ .time }}, '%Y/%m/%d/%H')
    EMPTY AS SELECT * FROM default.{{ .name }};
    CREATE MATERIALIZED VIEW IF NOT EXISTS archive.{{ .name }}_export
    REFRESH EVERY 1 HOUR OFFSET 5 MINUTE
    TO archive.{{ .name }}
    AS SELECT * FROM default.{{ .name }}
    WHERE {{ .time }} >= toStartOfHour(now()) - INTERVAL {{ $archive.lookbackHours }} HOUR
      AND {{ .time }} < toStartOfHour(now())
    SETTINGS s3_truncate_on_insert = 1;
    {{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: clickhouse-archive-export
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 20
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        kubernetes.io/hostname: {{ $store.nodeName }}
      containers:
        - name: apply
          image: {{ printf "%s:%s" $store.clickhouse.image.repository $store.clickhouse.image.tag }}
          command:
            - sh
            - -c
            - |
              set -eu
              {{- range $archive.tables }}
              until clickhouse-client --host {{ $store.clickhouse.name }}-clickhouse-headless --query "EXISTS TABLE default.{{ .name }}" | grep -qx 1; do sleep 10; done
              {{- end }}
              clickhouse-client --host {{ $store.clickhouse.name }}-clickhouse-headless --multiquery < /sql/export.sql
          env:
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clickhouse-credentials
                  key: default-password
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: sql
              mountPath: /sql
      volumes:
        - name: sql
          configMap:
            name: clickhouse-archive-export
