apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: clickhouse-credentials
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: {{ .Values.secrets.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: clickhouse-credentials
  data:
    - secretKey: default-password
      remoteRef:
        key: CLICKHOUSE_DEFAULT_PASSWORD
    - secretKey: otel-password
      remoteRef:
        key: CLICKHOUSE_OTEL_PASSWORD
    - secretKey: app-password
      remoteRef:
        key: CLICKHOUSE_APP_PASSWORD
---
# MCK reads the user's password from the key "password".
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.store.mongodb.name }}-password
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: {{ .Values.secrets.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: {{ .Values.store.mongodb.name }}-password
  data:
    - secretKey: password
      remoteRef:
        key: HYPERDX_MONGODB_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hyperdx
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: {{ .Values.secrets.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: hyperdx
    template:
      engineVersion: v2
      data:
        MONGO_URI: {{ printf "mongodb://hyperdx:{{ .mongoPassword }}@%s-svc.%s.svc:27017/hyperdx?authSource=hyperdx" .Values.store.mongodb.name .Release.Namespace | quote }}
        EXPRESS_SESSION_SECRET: {{ `"{{ .sessionSecret }}"` }}
        HYPERDX_API_KEY: {{ `"{{ .apiKey }}"` }}
        connections.json: |
          [
            {
              "name": "Local ClickHouse",
              "host": "http://{{ .Values.store.clickhouse.name }}-clickhouse-headless.{{ .Release.Namespace }}.svc:8123",
              "port": 8123,
              "username": "app",
              "password": "{{ `{{ .appPassword }}` }}"
            }
          ]
        sources.json: |
          {{- .Files.Get "files/sources.json" | nindent 10 }}
  data:
    - secretKey: mongoPassword
      remoteRef:
        key: HYPERDX_MONGODB_PASSWORD
    - secretKey: appPassword
      remoteRef:
        key: CLICKHOUSE_APP_PASSWORD
    - secretKey: apiKey
      remoteRef:
        key: HYPERDX_API_KEY
    - secretKey: sessionSecret
      remoteRef:
        key: AUTH_OAUTH2_COOKIE_SECRET
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hyperdx-auth
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: {{ .Values.secrets.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: hyperdx-auth
    template:
      engineVersion: v2
      data:
        client-id: hyperdx
        client-secret: {{ `"{{ .clientSecret }}"` }}
        cookie-secret: {{ `"{{ .cookieSecret }}"` }}
  data:
    - secretKey: clientSecret
      remoteRef:
        key: AUTH_OIDC_CLIENT_SECRET
    - secretKey: cookieSecret
      remoteRef:
        key: AUTH_OAUTH2_COOKIE_SECRET
