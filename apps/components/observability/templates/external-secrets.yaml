apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  name: grafana-admin
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: {{ .Values.secrets.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: grafana-admin
    template:
      engineVersion: v2
      data:
        admin-user: admin
        admin-password: {{ `"{{ .password }}"` }}
  data:
    - secretKey: password
      remoteRef:
        key: GRAFANA_ADMIN_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  name: grafana-oidc
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: {{ .Values.secrets.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: grafana-oidc
    template:
      engineVersion: v2
      data:
        GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: {{ `"{{ .clientSecret }}"` }}
  data:
    - secretKey: clientSecret
      remoteRef:
        key: AUTH_OIDC_CLIENT_SECRET
