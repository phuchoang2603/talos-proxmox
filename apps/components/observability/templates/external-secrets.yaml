apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: clickhouse-credentials
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: {{ .Values.secrets.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: clickhouse-credentials
  data:
    - secretKey: default-password
      remoteRef:
        key: CLICKHOUSE_DEFAULT_PASSWORD
    - secretKey: otel-password
      remoteRef:
        key: CLICKHOUSE_OTEL_PASSWORD
    - secretKey: app-password
      remoteRef:
        key: CLICKHOUSE_APP_PASSWORD
---
# Key names match the Grafana chart's admin.userKey and admin.passwordKey defaults.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.grafana.admin.existingSecret }}
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: {{ .Values.secrets.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: {{ .Values.grafana.admin.existingSecret }}
    template:
      engineVersion: v2
      data:
        admin-user: admin
        admin-password: {{ `"{{ .password }}"` }}
  data:
    - secretKey: password
      remoteRef:
        key: GRAFANA_ADMIN_PASSWORD
