# Wrapper-owned resources. Names feed the operator-generated Services
# (<name>-clickhouse-headless, <name>-svc) that HyperDX and the gateway use.
store:
  # The only SSD-backed prod node; keeps ClickHouse merges off the HDD etcd nodes.
  nodeName: prod-server1
  clickhouse:
    name: clickstack
    image:
      repository: clickhouse/clickhouse-server
      tag: "25.12-alpine"
    # ClickHouse caps itself at 90% of the memory limit and sizes its caches from it.
    resources:
      requests:
        cpu: 500m
        memory: 4Gi
      limits:
        cpu: "2"
        memory: 4Gi
    # local-path does not enforce claim sizes; keep_free_space_bytes is the real bound.
    storage: 50Gi
    keepFreeSpaceBytes: 21474836480
  keeper:
    image:
      repository: clickhouse/clickhouse-keeper
      tag: "25.12-alpine"
    resources:
      requests:
        cpu: 50m
        memory: 384Mi
      limits:
        memory: 512Mi
    storage: 5Gi
  mongodb:
    name: hyperdx-mongodb
  # Applied to the app user that HyperDX queries as; exceeding either fails only that query.
  uiQueryLimits:
    maxMemoryUsage: 536870912
    maxExecutionTime: 60

secrets:
  refreshInterval: 1h

tunnel:
  clusterTunnel: talos-proxmox

global:
  hyperdxAddress: 10.69.12.128
  hyperdxHostname: hyperdx.phuchoang.sbs
  # The only identity granted a HyperDX role; lint checks it against auth's identity.email.
  operatorEmail: xuanphuc.a1gv@gmail.com
  # Read by the agent and cluster collectors' configs.
  clusterName: prod-talos
  environment: prod
  criticalNamespaces: "^(ecommerce|payment-gateway|fraud-data-prod|fraud-ml-prod|kafka|openmetadata|auth|argo-cd|argo-workflows|kube-system|istio-system|operators|observability)$"
  gatewayEndpoint: otel-gateway.observability.svc:4317

clickstack:
  fullnameOverride: hyperdx
  # Credentials come from ExternalSecrets, so the chart's secret-bearing pieces stay off.
  clickhouse:
    enabled: false
  mongodb:
    enabled: false
  otel-collector:
    enabled: false
  hyperdx:
    # Blanked rather than null: Helm 4 keeps a subchart's map defaults when the parent sets null.
    # The real values reach HyperDX through deployment.env, which overrides the chart's envFrom.
    secrets:
      HYPERDX_API_KEY: ""
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_APP_PASSWORD: ""
      MONGODB_PASSWORD: ""
    config:
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-agent.observability.svc:4318"
      OTEL_SDK_DISABLED: "true"
      HDX_EXPORTER_ENABLED: "false"
      EXPRESS_SESSION_SECRET: ""
      FRONTEND_URL: 'https://{{ .Values.global.hyperdxHostname }}'
      USAGE_STATS_ENABLED: "false"
      # Set from the hyperdx Secret below; the chart default embeds the password.
      MONGO_URI: ""
    deployment:
      useExistingConfigSecret: true
      existingConfigSecret: hyperdx
      env:
        - name: MONGO_URI
          valueFrom:
            secretKeyRef:
              name: hyperdx
              key: MONGO_URI
        - name: EXPRESS_SESSION_SECRET
          valueFrom:
            secretKeyRef:
              name: hyperdx
              key: EXPRESS_SESSION_SECRET
        - name: HYPERDX_API_KEY
          valueFrom:
            secretKeyRef:
              name: hyperdx
              key: HYPERDX_API_KEY
      resources:
        requests:
          cpu: 100m
          memory: 384Mi
        limits:
          memory: 1Gi

hyperdx-auth:
  fullnameOverride: hyperdx-auth
  replicaCount: 1
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
  config:
    existingSecret: hyperdx-auth
    configFile: |
      email_domains = []
      authenticated_emails_file = "/etc/oauth2-proxy/emails/allowed"
      upstreams = ["http://hyperdx:3000/"]
  extraVolumes:
    - name: allowed-emails
      configMap:
        name: hyperdx-allowed-emails
  extraVolumeMounts:
    - name: allowed-emails
      mountPath: /etc/oauth2-proxy/emails
      readOnly: true
  extraArgs:
    provider: oidc
    oidc-issuer-url: https://auth.phuchoang.sbs/dex
    skip-oidc-discovery: "true"
    login-url: https://auth.phuchoang.sbs/dex/auth
    redeem-url: http://dex.auth.svc.cluster.local:5556/dex/token
    oidc-jwks-url: http://dex.auth.svc.cluster.local:5556/dex/keys
    redirect-url: https://hyperdx.phuchoang.sbs/oauth2/callback
    skip-provider-button: "true"
    approval-prompt: auto
    reverse-proxy: "true"
    cookie-secure: "true"
    cookie-name: _hyperdx_oauth2
    cookie-samesite: lax

otel-gateway:
  fullnameOverride: otel-gateway
  mode: deployment
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: "0.163.2"
  resources:
    requests:
      cpu: 150m
      memory: 256Mi
    limits:
      memory: 1Gi
  extraEnvs:
    - name: CLICKHOUSE_OTEL_PASSWORD
      valueFrom:
        secretKeyRef:
          name: clickhouse-credentials
          key: otel-password
  ports:
    jaeger-compact:
      enabled: false
    jaeger-thrift:
      enabled: false
    jaeger-grpc:
      enabled: false
    zipkin:
      enabled: false
  # Only prod's own collectors send here, through the in-cluster Service.
  alternateConfig:
    extensions:
      health_check:
        endpoint: ${env:MY_POD_IP}:13133
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: ${env:MY_POD_IP}:4317
          http:
            endpoint: ${env:MY_POD_IP}:4318
    processors:
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25
      batch:
        send_batch_size: 10000
        timeout: 5s
    exporters:
      clickhouse:
        endpoint: tcp://clickstack-clickhouse-headless:9000?dial_timeout=10s
        database: default
        username: otelcollector
        password: ${env:CLICKHOUSE_OTEL_PASSWORD}
        create_schema: true
        ttl: 168h
        timeout: 10s
        retry_on_failure:
          enabled: true
          max_elapsed_time: 5m
    service:
      extensions:
        - health_check
      pipelines:
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [clickhouse]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [clickhouse]
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [clickhouse]

otel-agent:
  fullnameOverride: otel-agent
  mode: daemonset
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: "0.163.2"
  presets:
    logsCollection:
      enabled: true
      storeCheckpoints: true
    kubeletMetrics:
      enabled: true
    hostMetrics:
      enabled: true
    kubernetesAttributes:
      enabled: true
  # Applications send OTLP to otel-agent.observability.svc and reach their own node's agent.
  service:
    enabled: true
  # Runs on every node, including tainted AWS burst workers.
  tolerations:
    - operator: Exists
  resources:
    requests:
      cpu: 150m
      memory: 192Mi
    limits:
      memory: 512Mi
  ports:
    jaeger-compact:
      enabled: false
    jaeger-thrift:
      enabled: false
    jaeger-grpc:
      enabled: false
    zipkin:
      enabled: false
  alternateConfig:
    extensions:
      health_check:
        endpoint: ${env:MY_POD_IP}:13133
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: ${env:MY_POD_IP}:4317
          http:
            endpoint: ${env:MY_POD_IP}:4318
      # Talos kubelets serve self-signed certificates.
      kubeletstats:
        collection_interval: 60s
        metric_groups: [node, pod, container]
        insecure_skip_verify: true
      hostmetrics:
        collection_interval: 60s
      # Replaces the preset's operator list, so container-parser is restated.
      # Structured and known text formats promote severity; unknown lines pass through.
      file_log:
        include:
          - /var/log/pods/ecommerce_*/*/*.log
          - /var/log/pods/payment-gateway_*/*/*.log
          - /var/log/pods/fraud-data-prod_*/*/*.log
          - /var/log/pods/fraud-ml-prod_*/*/*.log
          - /var/log/pods/kafka_*/*/*.log
          - /var/log/pods/openmetadata_*/*/*.log
          - /var/log/pods/auth_*/*/*.log
          - /var/log/pods/argo-cd_*/*/*.log
          - /var/log/pods/argo-workflows_*/*/*.log
          - /var/log/pods/kube-system_*/*/*.log
          - /var/log/pods/istio-system_*/*/*.log
          - /var/log/pods/operators_*/*/*.log
          - /var/log/pods/observability_*/*/*.log
        exclude:
          - /var/log/pods/observability_otel-agent*_*/otel-agent/*.log
          - /var/log/pods/observability_clickstack-clickhouse*_*/clickhouse-server/*.log
        operators:
          - type: container
            id: container-parser
            max_log_size: 102400
          - type: json_parser
            id: json-body
            if: 'body matches "^\\{"'
            on_error: send_quiet
          - type: copy
            id: json-level
            if: "attributes.level != nil"
            from: attributes.level
            to: attributes.parsed_level
          - type: copy
            id: json-severity
            if: "attributes.parsed_level == nil and attributes.severity != nil"
            from: attributes.severity
            to: attributes.parsed_level
          - type: copy
            id: json-severity-text
            if: "attributes.parsed_level == nil and attributes.severity_text != nil"
            from: attributes.severity_text
            to: attributes.parsed_level
          - type: copy
            id: mongodb-level
            if: "attributes.parsed_level == nil and attributes.s != nil and attributes.c != nil"
            from: attributes.s
            to: attributes.parsed_level
          - type: regex_parser
            id: timestamp-level
            if: 'attributes.parsed_level == nil and body matches "^(\\x1b\\[[0-9;]*m)*\\[?[0-9]{4}[-.]"'
            regex: '(?i)^(?:\x1b\[[0-9;]*m)*\[?\d{4}[-.]\d{2}[-.]\d{2}[T ][0-9:.,]+Z?(?:\x1b\[[0-9;]*m|\s)*(?P<parsed_level>trace|debug|info|warn(?:ing)?|error|fatal|panic)\b'
            on_error: send_quiet
          - type: regex_parser
            id: logfmt-level
            if: 'attributes.parsed_level == nil and body matches "^time="'
            regex: '^time=\S+ level=(?P<parsed_level>\w+)\b'
            on_error: send_quiet
          - type: regex_parser
            id: klog-level
            if: 'attributes.parsed_level == nil and body matches "^[IWEF][0-9]{4}\\s"'
            regex: '^(?P<parsed_level>[IWEF])\d{4}\s'
            on_error: send_quiet
          - type: regex_parser
            id: clickhouse-level
            if: 'attributes.parsed_level == nil and body matches "^[0-9]{4}\\."'
            regex: '^\d{4}\.\d{2}\.\d{2} [0-9:.]+ \[\s*\d+\s*\] \{[^}]*\} <(?P<parsed_level>\w+)>'
            on_error: send_quiet
          - type: regex_parser
            id: redis-level
            if: 'attributes.parsed_level == nil and body matches "^[0-9]+:[A-Z] "'
            regex: '^\d+:[A-Z] \d{2} \w{3} \d{4} [0-9:.]+ (?P<parsed_level>[.*#-]) '
            on_error: send_quiet
          - type: severity_parser
            id: normalized-level
            if: "attributes.parsed_level != nil"
            parse_from: attributes.parsed_level
            overwrite_text: true
            mapping:
              debug: [D, D1, D2, D3, D4, D5, '.', '-']
              info: [I, '*']
              warn: [W, '#']
              error: [E]
              fatal: [F]
            on_error: send_quiet
          - type: remove
            id: remove-parsed-level
            if: "attributes.parsed_level != nil"
            field: attributes.parsed_level
          - type: trace_parser
            id: json-trace
            if: "attributes.trace_id != nil"
            trace_id:
              parse_from: attributes.trace_id
            span_id:
              parse_from: attributes.span_id
            on_error: send_quiet
          - type: move
            id: json-msg
            if: "attributes.msg != nil"
            from: attributes.msg
            to: body
    processors:
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25
      resource/environment:
        attributes:
          - key: k8s.cluster.name
            value: "{{ .Values.global.clusterName }}"
            action: upsert
          - key: deployment.environment
            value: "{{ .Values.global.environment }}"
            action: upsert
      # hostmetrics carries no node identity of its own.
      resource/node:
        attributes:
          - key: k8s.node.name
            value: ${env:K8S_NODE_NAME}
            action: insert
          - key: host.name
            value: ${env:K8S_NODE_NAME}
            action: insert
      filter/critical:
        error_mode: ignore
        logs:
          log_record:
            - 'not IsMatch(String(resource.attributes["k8s.namespace.name"]), "{{ .Values.global.criticalNamespaces }}")'
            - 'not IsMatch(String(resource.attributes["k8s.namespace.name"]), "^(ecommerce|payment-gateway|fraud-data-prod|fraud-ml-prod)$") and severity_number < SEVERITY_NUMBER_WARN and (severity_number != SEVERITY_NUMBER_UNSPECIFIED or not IsMatch(String(body), "(?i)(warn|error|fatal|panic|(^|\\s)[WEF][0-9]{4})"))'
        metrics:
          datapoint:
            - 'resource.attributes["k8s.namespace.name"] != nil and not IsMatch(resource.attributes["k8s.namespace.name"], "{{ .Values.global.criticalNamespaces }}")'
        traces:
          span:
            - 'not IsMatch(String(resource.attributes["k8s.namespace.name"]), "{{ .Values.global.criticalNamespaces }}")'
      batch: {}
    exporters:
      otlp/gateway:
        endpoint: "{{ .Values.global.gatewayEndpoint }}"
        tls:
          insecure: true
        retry_on_failure:
          enabled: true
          max_elapsed_time: 15m
        sending_queue:
          enabled: true
          queue_size: 1000
          storage: file_storage
    service:
      extensions:
        - health_check
      pipelines:
        logs:
          receivers: [otlp]
          processors: [memory_limiter, k8s_attributes, filter/critical, resource/environment, batch]
          exporters: [otlp/gateway]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, k8s_attributes, filter/critical, resource/environment, resource/node, batch]
          exporters: [otlp/gateway]
        traces:
          receivers: [otlp]
          processors: [memory_limiter, k8s_attributes, filter/critical, resource/environment, batch]
          exporters: [otlp/gateway]

otel-cluster:
  fullnameOverride: otel-cluster
  mode: deployment
  replicaCount: 1
  # Ambient lets it scrape enrolled pods in namespaces with STRICT mTLS; Istio gateways, waypoints,
  # and ztunnel are not captured and stay reachable either way.
  podLabels:
    istio.io/dataplane-mode: ambient
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: "0.163.2"
  presets:
    clusterMetrics:
      enabled: true
    kubernetesEvents:
      enabled: true
  clusterRole:
    rules:
      - apiGroups: [""]
        resources: [pods]
        verbs: [get, list, watch]
  resources:
    requests:
      cpu: 25m
      memory: 160Mi
    limits:
      memory: 512Mi
  service:
    enabled: false
  ports:
    otlp:
      enabled: false
    otlp-http:
      enabled: false
    jaeger-compact:
      enabled: false
    jaeger-thrift:
      enabled: false
    jaeger-grpc:
      enabled: false
    zipkin:
      enabled: false
  alternateConfig:
    extensions:
      health_check:
        endpoint: ${env:MY_POD_IP}:13133
    receivers:
      k8s_cluster:
        collection_interval: 60s
      k8sobjects:
        objects:
          - name: events
            group: events.k8s.io
            mode: watch
            namespaces: [ecommerce, payment-gateway, fraud-data-prod, fraud-ml-prod, kafka, openmetadata, auth, argo-cd, argo-workflows, kube-system, istio-system, operators, observability]
            field_selector: type=Warning
            exclude_watch_type: [DELETED]
      prometheus:
        config:
          scrape_configs:
            - job_name: annotated-pods
              scrape_interval: 60s
              kubernetes_sd_configs:
                - role: pod
              relabel_configs:
                - source_labels: [__meta_kubernetes_namespace]
                  action: keep
                  regex: "{{ .Values.global.criticalNamespaces }}"
                - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
                  action: keep
                  regex: "true"
                - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
                  action: replace
                  target_label: __metrics_path__
                  regex: (.+)
                - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
                  action: replace
                  regex: ([^:]+)(?::\d+)?;(\d+)
                  replacement: $$1:$$2
                  target_label: __address__
                - source_labels: [__meta_kubernetes_namespace]
                  target_label: namespace
                - source_labels: [__meta_kubernetes_pod_name]
                  target_label: pod
    processors:
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25
      resource/environment:
        attributes:
          - key: k8s.cluster.name
            value: "{{ .Values.global.clusterName }}"
            action: upsert
          - key: deployment.environment
            value: "{{ .Values.global.environment }}"
            action: upsert
      filter/critical:
        error_mode: ignore
        metrics:
          datapoint:
            - 'resource.attributes["k8s.namespace.name"] != nil and not IsMatch(resource.attributes["k8s.namespace.name"], "{{ .Values.global.criticalNamespaces }}")'
      transform/event-severity:
        log_statements:
          - context: log
            statements:
              - set(severity_number, SEVERITY_NUMBER_WARN)
              - set(severity_text, "WARN")
      batch: {}
    exporters:
      otlp/gateway:
        endpoint: "{{ .Values.global.gatewayEndpoint }}"
        tls:
          insecure: true
        retry_on_failure:
          enabled: true
          max_elapsed_time: 15m
        sending_queue:
          enabled: true
          queue_size: 1000
    service:
      extensions:
        - health_check
      pipelines:
        logs:
          receivers: []
          processors: [memory_limiter, transform/event-severity, filter/critical, resource/environment, batch]
          exporters: [otlp/gateway]
        metrics:
          receivers: [prometheus]
          processors: [memory_limiter, filter/critical, resource/environment, batch]
          exporters: [otlp/gateway]
