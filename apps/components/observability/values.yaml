secrets:
  refreshInterval: 1h

tunnel:
  clusterTunnel: talos-proxmox
  hostname: grafana.phuchoang.sbs

global:
  operatorEmail: xuanphuc.a1gv@gmail.com

victoria-metrics-k8s-stack:
  fullnameOverride: vmks
  victoria-metrics-operator:
    admissionWebhooks:
      certManager:
        enabled: true
    crds:
      cleanup:
        enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
  syncJob:
    enabled: true
  defaultDashboards:
    enabled: true
  defaultDatasources:
    victorialogs:
      datasources:
        - name: VictoriaLogs
          access: proxy
          uid: VictoriaLogs
          type: victoriametrics-logs-datasource
          plugin: true
          jsonData:
            derivedFields:
              - name: trace_id
                matcherType: label
                matcherRegex: trace_id
                url: '${__value.raw}'
                urlDisplayLabel: View trace
                datasourceUid: VictoriaTraces
    victoriatraces:
      datasources: []
    extra:
      - name: VictoriaTraces
        type: tempo
        access: proxy
        uid: VictoriaTraces
        url: http://vtsingle-vmks.observability.svc.cluster.local:10428/select/tempo
        jsonData:
          tracesToLogsV2:
            datasourceUid: VictoriaLogs
            spanStartTimeShift: '-5m'
            spanEndTimeShift: '5m'
            filterByTraceID: false
            filterBySpanID: false
            customQuery: true
            query: 'trace_id:="${__trace.traceId}"'
          tracesToMetrics:
            datasourceUid: VictoriaMetrics
  grafana:
    fullnameOverride: grafana
    admin:
      existingSecret: grafana-admin
      userKey: admin-user
      passwordKey: admin-password
    envFromSecret: grafana-oidc
    service:
      type: LoadBalancer
      annotations:
        lbipam.cilium.io/ips: '10.69.12.128'
    persistence:
      enabled: true
      storageClassName: local-path
      size: 5Gi
    nodeSelector:
      kubernetes.io/hostname: prod-server1
    deploymentStrategy:
      type: Recreate
    resources:
      requests:
        cpu: 50m
        memory: 512Mi
      limits:
        memory: 1Gi
    plugins:
      - victoriametrics-metrics-datasource
      - victoriametrics-logs-datasource
    grafana.ini:
      server:
        domain: grafana.phuchoang.sbs
        root_url: https://grafana.phuchoang.sbs
      users:
        allow_sign_up: false
      auth.anonymous:
        enabled: false
      auth.generic_oauth:
        enabled: true
        name: Dex
        allow_sign_up: true
        client_id: grafana
        client_secret: '$__env{GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}'
        scopes: openid profile email
        auth_url: https://auth.phuchoang.sbs/dex/auth
        token_url: https://auth.phuchoang.sbs/dex/token
        api_url: https://auth.phuchoang.sbs/dex/userinfo
        use_pkce: true
        role_attribute_path: '{{ printf "email == ''%s'' && ''Admin''" .Values.global.operatorEmail }}'
        role_attribute_strict: true
        allowed_domains: gmail.com
  vmsingle:
    enabled: true
    spec:
      retentionPeriod: 3d
      nodeSelector:
        kubernetes.io/hostname: prod-server1
      extraArgs:
        storage.minFreeDiskSpaceBytes: '21474836480'
      storage:
        storageClassName: local-path
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 20Gi
      resources:
        requests:
          cpu: 100m
          memory: 768Mi
        limits:
          memory: 1536Mi
  vmcluster:
    enabled: false
  vlsingle:
    enabled: true
    spec:
      retentionPeriod: 3d
      nodeSelector:
        kubernetes.io/hostname: prod-server1
      extraArgs:
        storage.minFreeDiskSpaceBytes: '21474836480'
      storage:
        storageClassName: local-path
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 20Gi
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 2Gi
  vlcluster:
    enabled: false
  vtsingle:
    enabled: true
    spec:
      retentionPeriod: 3d
      nodeSelector:
        kubernetes.io/hostname: prod-server1
      extraArgs:
        storage.minFreeDiskSpaceBytes: '21474836480'
      storage:
        storageClassName: local-path
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 1Gi
  vtcluster:
    enabled: false
  vmagent:
    enabled: true
    spec:
      selectAllByDefault: true
      statefulMode: true
      nodeSelector:
        kubernetes.io/hostname: prod-server2
      statefulStorage:
        volumeClaimTemplate:
          spec:
            storageClassName: local-path
            accessModes: [ReadWriteOnce]
            resources:
              requests:
                storage: 1Gi
      remoteWriteSettings:
        maxDiskUsagePerURL: 256MiB
      extraArgs:
        promscrape.maxScrapeSize: 64MiB
      scrapeInterval: 60s
      externalLabels:
        cluster: prod-talos
        environment: prod
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 1Gi
  vlagent:
    enabled: true
    spec:
      k8sCollector:
        enabled: true
        extraFields: '{"cluster":"prod-talos","environment":"prod"}'
      tolerations:
        - operator: Exists
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 256Mi
  alertmanager:
    enabled: true
  vmalert:
    enabled: true
  kubeControllerManager:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeEtcd:
    enabled: false
  kubeProxy:
    enabled: false

vtagent:
  spec:
    port: '10429'
    replicaCount: 1
    nodeSelector:
      kubernetes.io/hostname: prod-server2
    remoteWrite:
      - url: http://vtsingle-vmks.observability.svc:10428/insert/native
    remoteWriteSettings:
      maxDiskUsagePerURL: 256MiB
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 1Gi
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
