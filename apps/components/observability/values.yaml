secrets:
  refreshInterval: 1h

tunnel:
  clusterTunnel: talos-proxmox
  hostname: grafana.phuchoang.sbs

global:
  operatorEmail: xuanphuc.a1gv@gmail.com

prometheus-operator-crds:
  crds:
    alertmanagerconfigs:
      enabled: false
    alertmanagers:
      enabled: false
    prometheusagents:
      enabled: false
    prometheuses:
      enabled: false
    thanosrulers:
      enabled: false

victoria-metrics-k8s-stack:
  fullnameOverride: vmks
  victoria-metrics-operator:
    operator:
      disable_prometheus_converter: false
    admissionWebhooks:
      certManager:
        enabled: true
    crds:
      cleanup:
        enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
  syncJob:
    enabled: true
  defaultDashboards:
    enabled: true
  defaultDatasources:
    victorialogs:
      datasources:
        - name: VictoriaLogs
          access: proxy
          uid: VictoriaLogs
          type: victoriametrics-logs-datasource
          plugin: true
          jsonData:
            derivedFields:
              - name: trace_id
                matcherType: label
                matcherRegex: trace_id
                url: '${__value.raw}'
                urlDisplayLabel: View trace
                datasourceUid: VictoriaTraces
    victoriatraces:
      datasources: []
    extra:
      - name: VictoriaTraces
        type: tempo
        access: proxy
        uid: VictoriaTraces
        url: http://vtsingle-vmks.observability.svc.cluster.local:10428/select/tempo
        jsonData:
          tracesToLogsV2:
            datasourceUid: VictoriaLogs
            spanStartTimeShift: '-5m'
            spanEndTimeShift: '5m'
            filterByTraceID: false
            filterBySpanID: false
            customQuery: true
            query: 'trace_id:="${__trace.traceId}"'
          tracesToMetrics:
            datasourceUid: VictoriaMetrics
  grafana:
    fullnameOverride: grafana
    admin:
      existingSecret: grafana-admin
      userKey: admin-user
      passwordKey: admin-password
    envFromSecret: grafana-oidc
    service:
      type: ClusterIP
    persistence:
      enabled: true
      storageClassName: local-path
      size: 5Gi
    deploymentStrategy:
      type: Recreate
    resources:
      requests:
        cpu: 50m
        memory: 512Mi
      limits:
        memory: 1Gi
    plugins:
      - victoriametrics-metrics-datasource
      - victoriametrics-logs-datasource
    grafana.ini:
      server:
        domain: grafana.phuchoang.sbs
        root_url: https://grafana.phuchoang.sbs
      users:
        allow_sign_up: false
      auth.anonymous:
        enabled: false
      auth.generic_oauth:
        enabled: true
        name: Dex
        allow_sign_up: true
        client_id: grafana
        client_secret: '$__env{GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}'
        scopes: openid profile email
        auth_url: https://auth.phuchoang.sbs/dex/auth
        token_url: http://dex.auth.svc.cluster.local:5556/dex/token
        api_url: http://dex.auth.svc.cluster.local:5556/dex/userinfo
        use_pkce: true
        role_attribute_path: '{{ printf "email == ''%s'' && ''Admin''" .Values.global.operatorEmail }}'
        role_attribute_strict: true
        allowed_domains: gmail.com
  vmsingle:
    enabled: true
    spec:
      retentionPeriod: 3d
      extraArgs:
        memory.allowedBytes: 512MiB
        storage.minFreeDiskSpaceBytes: '1073741824'
      storage:
        storageClassName: local-path
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 20Gi
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 1536Mi
  vmcluster:
    enabled: false
  vlsingle:
    enabled: true
    spec:
      retentionPeriod: 3d
      extraArgs:
        storage.minFreeDiskSpaceBytes: '1073741824'
      storage:
        storageClassName: local-path
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 20Gi
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 2Gi
  vlcluster:
    enabled: false
  vtsingle:
    enabled: true
    spec:
      retentionPeriod: 3d
      extraArgs:
        storage.minFreeDiskSpaceBytes: '1073741824'
      storage:
        storageClassName: local-path
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 1Gi
  vtcluster:
    enabled: false
  vmagent:
    enabled: true
    spec:
      selectAllByDefault: true
      statefulMode: true
      statefulStorage:
        volumeClaimTemplate:
          spec:
            storageClassName: local-path
            accessModes: [ReadWriteOnce]
            resources:
              requests:
                storage: 1Gi
      remoteWriteSettings:
        maxDiskUsagePerURL: 513MiB
      extraArgs:
        memory.allowedBytes: 128MiB
        promscrape.maxScrapeSize: 64MiB
      scrapeInterval: 60s
      externalLabels:
        cluster: prod-talos
        environment: prod
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi
  vlagent:
    enabled: true
    spec:
      k8sCollector:
        enabled: true
        extraFields: '{"cluster":"prod-talos","environment":"prod"}'
      tolerations:
        - operator: Exists
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 256Mi
  alertmanager:
    enabled: true
  vmalert:
    enabled: true
  kubelet:
    vmScrapes:
      probes:
        enabled: false
      cadvisor:
        spec:
          metricRelabelConfigs:
            - action: keep
              source_labels: [__name__]
              regex: 'container_cpu_(usage_seconds_total|cfs_periods_total|cfs_throttled_periods_total|cfs_throttled_seconds_total)|container_memory_(working_set_bytes|rss|cache|swap|usage_bytes|failures_total)|container_network_(receive|transmit)_(bytes_total|packets_total|packets_dropped_total|errors_total)|container_fs_(reads_bytes_total|writes_bytes_total|reads_total|writes_total|io_time_seconds_total|usage_bytes|limit_bytes)|container_spec_(cpu_quota|cpu_period|memory_limit_bytes)|machine_(cpu_cores|memory_bytes)'
            - action: labeldrop
              regex: 'uid|id|name'
    vmScrape:
      spec:
        interval: 60s
        relabelConfigs:
          - sourceLabels: [__meta_kubernetes_node_name]
            targetLabel: node
          - sourceLabels: [__metrics_path__]
            targetLabel: metrics_path
          - targetLabel: job
            replacement: kubelet
  kubeApiServer:
    vmScrape:
      spec:
        endpoints:
          - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
            port: https
            scheme: https
            interval: 120s
            tlsConfig:
              caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              serverName: kubernetes
            metricRelabelConfigs:
              - action: keep
                source_labels: [__name__]
                regex: 'apiserver_(request_total|request(_sli)?_duration_seconds_(bucket|sum|count)|current_inflight_requests|current_inqueue_requests|longrunning_requests|storage_objects)|process_(cpu_seconds_total|resident_memory_bytes|start_time_seconds)|go_goroutines'
              - action: drop
                source_labels: [__name__, le]
                regex: 'apiserver_request(_sli)?_duration_seconds_bucket;(0\.005|0\.025|0\.05|0\.2|0\.4|0\.6|0\.8|1\.25|1\.5|3|4|6|8|15|20|45)'
  kubeControllerManager:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeEtcd:
    enabled: false
  kubeProxy:
    enabled: false

vtagent:
  spec:
    port: '10429'
    replicaCount: 1
    remoteWrite:
      - url: http://vtsingle-vmks.observability.svc:10428/insert/native
    remoteWriteSettings:
      maxDiskUsagePerURL: 513MiB
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 1Gi
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
