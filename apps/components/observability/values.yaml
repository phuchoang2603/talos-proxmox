# Wrapper-owned resources. Names feed the operator-generated Services
# (<name>-clickhouse-headless, <name>-svc) that Grafana and the gateway use.
store:
  # The only SSD-backed prod node; keeps ClickHouse merges off the HDD etcd nodes.
  nodeName: prod-server1
  clickhouse:
    name: clickstack
    image:
      repository: clickhouse/clickhouse-server
      tag: "25.12-alpine"
    # ClickHouse caps itself at 90% of the memory limit and sizes its caches from it.
    resources:
      requests:
        cpu: 500m
        memory: 4Gi
      limits:
        cpu: "2"
        memory: 4Gi
    # local-path does not enforce claim sizes; keep_free_space_bytes is the real bound.
    storage: 50Gi
    keepFreeSpaceBytes: 21474836480
  keeper:
    image:
      repository: clickhouse/clickhouse-keeper
      tag: "25.12-alpine"
    resources:
      requests:
        cpu: 50m
        memory: 384Mi
      limits:
        memory: 512Mi
    storage: 5Gi
  # Applied to the app user that Grafana queries as; exceeding either fails only that query.
  uiQueryLimits:
    maxMemoryUsage: 536870912
    maxExecutionTime: 60

secrets:
  refreshInterval: 1h

tunnel:
  clusterTunnel: talos-proxmox

global:
  grafanaAddress: 10.69.12.128
  grafanaHostname: grafana.phuchoang.sbs
  # The only identity granted a Grafana role; lint checks it against auth's identity.email.
  operatorEmail: xuanphuc.a1gv@gmail.com
  # Read by the agent and cluster collectors' configs.
  clusterName: prod-talos
  environment: prod
  criticalNamespaces: "^(payment-gateway|fraud-data-prod|fraud-ml-prod|kafka|openmetadata|auth|argo-cd|argo-workflows|kube-system|istio-system|operators|observability)$"
  gatewayEndpoint: otel-gateway.observability.svc:4317

# Stateless: the data source, dashboards, and admin account are provisioned on every start.
grafana:
  fullnameOverride: grafana
  replicas: 1
  testFramework:
    enabled: false
  # Sidecars are off, so Grafana needs no Kubernetes API access.
  rbac:
    create: false
  # The database and downloaded plugin (~100Mi) live in memory: on prod-server1's SSD, shared
  # with etcd and ClickHouse, SQLite stalls long enough to fail health checks.
  persistence:
    enabled: false
    inMemory:
      enabled: true
      sizeLimit: 256Mi
  # The memory limit also covers the in-memory data directory. No CPU limit: page loads burst
  # to about one core.
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi
  # Liveness checks start only once the first database migration succeeds.
  startupProbe:
    httpGet:
      path: /api/health
      port: grafana
    periodSeconds: 10
    failureThreshold: 60
  admin:
    existingSecret: grafana-admin
  envValueFrom:
    CLICKHOUSE_APP_PASSWORD:
      secretKeyRef:
        name: clickhouse-credentials
        key: app-password
    GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
      secretKeyRef:
        name: grafana-oidc
        key: client-secret
  # Downloaded from grafana.com on every start. The files in dashboards/ were copied from
  # grafana/clickhouse-datasource tag v4.22.1; update both together.
  plugins:
    - grafana-clickhouse-datasource@4.22.1
  grafana.ini:
    server:
      root_url: 'https://{{ .Values.global.grafanaHostname }}'
    # Browsers reach Dex publicly; token and userinfo calls stay in-cluster. The login form
    # remains as the LAN fallback, so session cookies cannot be secure-only.
    auth.generic_oauth:
      enabled: true
      name: Dex
      client_id: grafana
      scopes: openid email profile
      use_pkce: true
      auth_url: https://auth.phuchoang.sbs/dex/auth
      token_url: http://dex.auth.svc.cluster.local:5556/dex/token
      api_url: http://dex.auth.svc.cluster.local:5556/dex/userinfo
      # Stateless Grafana recreates the OAuth user on every fresh login.
      allow_sign_up: true
      role_attribute_path: "email == '{{ .Values.global.operatorEmail }}' && 'Admin' || ''"
      role_attribute_strict: true
    security:
      cookie_secure: false
    users:
      allow_sign_up: false
    auth.anonymous:
      enabled: false
    # Nothing scrapes Grafana, and /metrics would be unauthenticated on the public hostname.
    metrics:
      enabled: false
    analytics:
      reporting_enabled: false
      check_for_updates: false
      check_for_plugin_updates: false
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: ClickHouse
          uid: clickhouse
          type: grafana-clickhouse-datasource
          isDefault: true
          editable: false
          jsonData:
            host: clickstack-clickhouse-headless
            port: 9000
            protocol: native
            username: app
            defaultDatabase: default
            logs:
              defaultDatabase: default
              defaultTable: otel_logs
              otelEnabled: true
              otelVersion: latest
              showLogLinks: true
            traces:
              defaultDatabase: default
              defaultTable: otel_traces
              otelEnabled: true
              otelVersion: latest
              showTraceLinks: true
          secureJsonData:
            password: $__env{CLICKHOUSE_APP_PASSWORD}
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: clickhouse
          folder: ClickHouse
          type: file
          disableDeletion: true
          allowUiUpdates: false
          options:
            path: /var/lib/grafana/dashboards/clickhouse
  dashboardsConfigMaps:
    clickhouse: grafana-dashboards

otel-gateway:
  fullnameOverride: otel-gateway
  mode: deployment
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: "0.163.2"
  resources:
    requests:
      cpu: 150m
      memory: 256Mi
    limits:
      memory: 1Gi
  extraEnvs:
    - name: CLICKHOUSE_OTEL_PASSWORD
      valueFrom:
        secretKeyRef:
          name: clickhouse-credentials
          key: otel-password
  ports:
    jaeger-compact:
      enabled: false
    jaeger-thrift:
      enabled: false
    jaeger-grpc:
      enabled: false
    zipkin:
      enabled: false
  # Only prod's own collectors send here, through the in-cluster Service.
  alternateConfig:
    extensions:
      health_check:
        endpoint: ${env:MY_POD_IP}:13133
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: ${env:MY_POD_IP}:4317
          http:
            endpoint: ${env:MY_POD_IP}:4318
    processors:
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25
      batch:
        send_batch_size: 10000
        timeout: 5s
    exporters:
      clickhouse:
        endpoint: tcp://clickstack-clickhouse-headless:9000?dial_timeout=10s
        database: default
        username: otelcollector
        password: ${env:CLICKHOUSE_OTEL_PASSWORD}
        create_schema: true
        ttl: 168h
        timeout: 10s
        retry_on_failure:
          enabled: true
          max_elapsed_time: 5m
    service:
      extensions:
        - health_check
      pipelines:
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [clickhouse]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [clickhouse]
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [clickhouse]

otel-agent:
  fullnameOverride: otel-agent
  mode: daemonset
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: "0.163.2"
  presets:
    logsCollection:
      enabled: true
      storeCheckpoints: true
    kubeletMetrics:
      enabled: true
    hostMetrics:
      enabled: true
    kubernetesAttributes:
      enabled: true
  # Applications send OTLP to otel-agent.observability.svc and reach their own node's agent.
  service:
    enabled: true
  # Runs on every node, including tainted AWS burst workers.
  tolerations:
    - operator: Exists
  resources:
    requests:
      cpu: 150m
      memory: 192Mi
    limits:
      memory: 512Mi
  ports:
    jaeger-compact:
      enabled: false
    jaeger-thrift:
      enabled: false
    jaeger-grpc:
      enabled: false
    zipkin:
      enabled: false
  alternateConfig:
    extensions:
      health_check:
        endpoint: ${env:MY_POD_IP}:13133
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: ${env:MY_POD_IP}:4317
          http:
            endpoint: ${env:MY_POD_IP}:4318
      # Talos kubelets serve self-signed certificates.
      kubeletstats:
        collection_interval: 60s
        metric_groups: [node, pod, container]
        insecure_skip_verify: true
      hostmetrics:
        collection_interval: 60s
      # Replaces the preset's operator list, so container-parser is restated.
      # JSON bodies promote level, trace_id/span_id, and msg; other lines pass through.
      file_log:
        include:
          - /var/log/pods/payment-gateway_*/*/*.log
          - /var/log/pods/fraud-data-prod_*/*/*.log
          - /var/log/pods/fraud-ml-prod_*/*/*.log
          - /var/log/pods/kafka_*/*/*.log
          - /var/log/pods/openmetadata_*/*/*.log
          - /var/log/pods/auth_*/*/*.log
          - /var/log/pods/argo-cd_*/*/*.log
          - /var/log/pods/argo-workflows_*/*/*.log
          - /var/log/pods/kube-system_*/*/*.log
          - /var/log/pods/istio-system_*/*/*.log
          - /var/log/pods/operators_*/*/*.log
          - /var/log/pods/observability_*/*/*.log
        exclude:
          - /var/log/pods/observability_otel-agent*_*/otel-agent/*.log
          - /var/log/pods/observability_clickstack-clickhouse*_*/clickhouse-server/*.log
        operators:
          - type: container
            id: container-parser
            max_log_size: 102400
          - type: json_parser
            id: json-body
            if: 'body matches "^\\{"'
            on_error: send_quiet
          - type: severity_parser
            id: json-level
            if: "attributes.level != nil"
            parse_from: attributes.level
            on_error: send_quiet
          - type: trace_parser
            id: json-trace
            if: "attributes.trace_id != nil"
            trace_id:
              parse_from: attributes.trace_id
            span_id:
              parse_from: attributes.span_id
            on_error: send_quiet
          - type: move
            id: json-msg
            if: "attributes.msg != nil"
            from: attributes.msg
            to: body
    processors:
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25
      resource/environment:
        attributes:
          - key: k8s.cluster.name
            value: "{{ .Values.global.clusterName }}"
            action: upsert
          - key: deployment.environment
            value: "{{ .Values.global.environment }}"
            action: upsert
      # hostmetrics carries no node identity of its own.
      resource/node:
        attributes:
          - key: k8s.node.name
            value: ${env:K8S_NODE_NAME}
            action: insert
          - key: host.name
            value: ${env:K8S_NODE_NAME}
            action: insert
      filter/critical:
        error_mode: ignore
        logs:
          log_record:
            - 'not IsMatch(String(resource.attributes["k8s.namespace.name"]), "{{ .Values.global.criticalNamespaces }}")'
            - 'not IsMatch(String(resource.attributes["k8s.namespace.name"]), "^(payment-gateway|fraud-data-prod|fraud-ml-prod)$") and severity_number < SEVERITY_NUMBER_WARN and not IsMatch(String(body), "(?i)(warn|error|fatal|panic|(^|\\s)[WEF][0-9]{4})")'
        metrics:
          datapoint:
            - 'resource.attributes["k8s.namespace.name"] != nil and not IsMatch(resource.attributes["k8s.namespace.name"], "{{ .Values.global.criticalNamespaces }}")'
        traces:
          span:
            - 'not IsMatch(String(resource.attributes["k8s.namespace.name"]), "{{ .Values.global.criticalNamespaces }}")'
      batch: {}
    exporters:
      otlp/gateway:
        endpoint: "{{ .Values.global.gatewayEndpoint }}"
        tls:
          insecure: true
        retry_on_failure:
          enabled: true
          max_elapsed_time: 15m
        sending_queue:
          enabled: true
          queue_size: 1000
          storage: file_storage
    service:
      extensions:
        - health_check
      pipelines:
        logs:
          receivers: [otlp]
          processors: [memory_limiter, k8s_attributes, filter/critical, resource/environment, batch]
          exporters: [otlp/gateway]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, k8s_attributes, filter/critical, resource/environment, resource/node, batch]
          exporters: [otlp/gateway]
        traces:
          receivers: [otlp]
          processors: [memory_limiter, k8s_attributes, filter/critical, resource/environment, batch]
          exporters: [otlp/gateway]

otel-cluster:
  fullnameOverride: otel-cluster
  mode: deployment
  replicaCount: 1
  # Ambient lets it scrape enrolled pods in namespaces with STRICT mTLS; Istio gateways, waypoints,
  # and ztunnel are not captured and stay reachable either way.
  podLabels:
    istio.io/dataplane-mode: ambient
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: "0.163.2"
  presets:
    clusterMetrics:
      enabled: true
    kubernetesEvents:
      enabled: true
  clusterRole:
    rules:
      - apiGroups: [""]
        resources: [pods]
        verbs: [get, list, watch]
  resources:
    requests:
      cpu: 25m
      memory: 160Mi
    limits:
      memory: 512Mi
  service:
    enabled: false
  ports:
    otlp:
      enabled: false
    otlp-http:
      enabled: false
    jaeger-compact:
      enabled: false
    jaeger-thrift:
      enabled: false
    jaeger-grpc:
      enabled: false
    zipkin:
      enabled: false
  alternateConfig:
    extensions:
      health_check:
        endpoint: ${env:MY_POD_IP}:13133
    receivers:
      k8s_cluster:
        collection_interval: 60s
      k8sobjects:
        objects:
          - name: events
            group: events.k8s.io
            mode: watch
            namespaces: [payment-gateway, fraud-data-prod, fraud-ml-prod, kafka, openmetadata, auth, argo-cd, argo-workflows, kube-system, istio-system, operators, observability]
            field_selector: type=Warning
            exclude_watch_type: [DELETED]
      prometheus:
        config:
          scrape_configs:
            - job_name: annotated-pods
              scrape_interval: 60s
              kubernetes_sd_configs:
                - role: pod
              relabel_configs:
                - source_labels: [__meta_kubernetes_namespace]
                  action: keep
                  regex: "{{ .Values.global.criticalNamespaces }}"
                - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
                  action: keep
                  regex: "true"
                - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
                  action: replace
                  target_label: __metrics_path__
                  regex: (.+)
                - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
                  action: replace
                  regex: ([^:]+)(?::\d+)?;(\d+)
                  replacement: $$1:$$2
                  target_label: __address__
                - source_labels: [__meta_kubernetes_namespace]
                  target_label: namespace
                - source_labels: [__meta_kubernetes_pod_name]
                  target_label: pod
    processors:
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25
      resource/environment:
        attributes:
          - key: k8s.cluster.name
            value: "{{ .Values.global.clusterName }}"
            action: upsert
          - key: deployment.environment
            value: "{{ .Values.global.environment }}"
            action: upsert
      filter/critical:
        error_mode: ignore
        metrics:
          datapoint:
            - 'resource.attributes["k8s.namespace.name"] != nil and not IsMatch(resource.attributes["k8s.namespace.name"], "{{ .Values.global.criticalNamespaces }}")'
      batch: {}
    exporters:
      otlp/gateway:
        endpoint: "{{ .Values.global.gatewayEndpoint }}"
        tls:
          insecure: true
        retry_on_failure:
          enabled: true
          max_elapsed_time: 15m
        sending_queue:
          enabled: true
          queue_size: 1000
    service:
      extensions:
        - health_check
      pipelines:
        logs:
          receivers: []
          processors: [memory_limiter, filter/critical, resource/environment, batch]
          exporters: [otlp/gateway]
        metrics:
          receivers: [prometheus]
          processors: [memory_limiter, filter/critical, resource/environment, batch]
          exporters: [otlp/gateway]
