# Wrapper-owned resources. Names feed the operator-generated Services
# (<name>-clickhouse-headless, <name>-svc) that Grafana and the gateway use.
store:
  # The only SSD-backed prod node; keeps ClickHouse merges off the HDD etcd nodes.
  nodeName: prod-server1
  clickhouse:
    name: clickstack
    image:
      repository: clickhouse/clickhouse-server
      tag: "25.7-alpine"
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        memory: 2Gi
    # local-path does not enforce claim sizes; keep_free_space_bytes is the real bound.
    storage: 50Gi
    keepFreeSpaceBytes: 21474836480
  keeper:
    image:
      repository: clickhouse/clickhouse-keeper
      tag: "25.7-alpine"
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        memory: 512Mi
    storage: 5Gi
  # Applied to the app user that Grafana queries as; exceeding either fails only that query.
  uiQueryLimits:
    maxMemoryUsage: 536870912
    maxExecutionTime: 60

secrets:
  refreshInterval: 1h

global:
  grafanaAddress: 10.69.12.128

# Stateless: the data source, dashboards, and admin account are provisioned on every start.
grafana:
  fullnameOverride: grafana
  replicas: 1
  testFramework:
    enabled: false
  # Sidecars are off, so Grafana needs no Kubernetes API access.
  rbac:
    create: false
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  # Every new pod migrates an empty database first, which takes minutes on prod-server1's
  # shared SSD; liveness checks start only once this succeeds.
  startupProbe:
    httpGet:
      path: /api/health
      port: grafana
    periodSeconds: 10
    failureThreshold: 60
  admin:
    existingSecret: grafana-admin
  envValueFrom:
    CLICKHOUSE_APP_PASSWORD:
      secretKeyRef:
        name: clickhouse-credentials
        key: app-password
  # Downloaded from grafana.com on every start. The files in dashboards/ were copied from
  # grafana/clickhouse-datasource tag v4.22.1; update both together.
  plugins:
    - grafana-clickhouse-datasource@4.22.1
  grafana.ini:
    server:
      root_url: 'http://{{ .Values.global.grafanaAddress }}'
    users:
      allow_sign_up: false
    auth.anonymous:
      enabled: false
    analytics:
      reporting_enabled: false
      check_for_updates: false
      check_for_plugin_updates: false
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: ClickHouse
          uid: clickhouse
          type: grafana-clickhouse-datasource
          isDefault: true
          editable: false
          jsonData:
            host: clickstack-clickhouse-headless
            port: 9000
            protocol: native
            username: app
            defaultDatabase: default
            logs:
              defaultDatabase: default
              defaultTable: otel_logs
              otelEnabled: true
              otelVersion: latest
              showLogLinks: true
            traces:
              defaultDatabase: default
              defaultTable: otel_traces
              otelEnabled: true
              otelVersion: latest
              showTraceLinks: true
          secureJsonData:
            password: $__env{CLICKHOUSE_APP_PASSWORD}
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: clickhouse
          folder: ClickHouse
          type: file
          disableDeletion: true
          allowUiUpdates: false
          options:
            path: /var/lib/grafana/dashboards/clickhouse
  dashboardsConfigMaps:
    clickhouse: grafana-dashboards

otel-gateway:
  fullnameOverride: otel-gateway
  mode: deployment
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: "0.161.0"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  extraEnvs:
    - name: OTEL_INGEST_TOKEN
      valueFrom:
        secretKeyRef:
          name: otel-gateway-token
          key: token
    - name: CLICKHOUSE_OTEL_PASSWORD
      valueFrom:
        secretKeyRef:
          name: clickhouse-credentials
          key: otel-password
  ports:
    jaeger-compact:
      enabled: false
    jaeger-thrift:
      enabled: false
    jaeger-grpc:
      enabled: false
    zipkin:
      enabled: false
  # Prod's agents reach this Service in-cluster; dev reaches its LAN address.
  service:
    type: LoadBalancer
    annotations:
      lbipam.cilium.io/ips: 10.69.12.129
  alternateConfig:
    extensions:
      health_check:
        endpoint: ${env:MY_POD_IP}:13133
      bearertokenauth:
        token: ${env:OTEL_INGEST_TOKEN}
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: ${env:MY_POD_IP}:4317
            auth:
              authenticator: bearertokenauth
          http:
            endpoint: ${env:MY_POD_IP}:4318
            auth:
              authenticator: bearertokenauth
    processors:
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25
      batch:
        send_batch_size: 10000
        timeout: 5s
    exporters:
      clickhouse:
        endpoint: tcp://clickstack-clickhouse-headless:9000?dial_timeout=10s
        database: default
        username: otelcollector
        password: ${env:CLICKHOUSE_OTEL_PASSWORD}
        create_schema: true
        ttl: 168h
        timeout: 10s
        retry_on_failure:
          enabled: true
          max_elapsed_time: 5m
    service:
      extensions:
        - health_check
        - bearertokenauth
      pipelines:
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [clickhouse]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [clickhouse]
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [clickhouse]
