apiVersion: v2
name: observability
description: ClickHouse telemetry store, Grafana, and the OpenTelemetry gateway, node agents, and cluster collector
type: application
version: 0.1.0
dependencies:
  - name: grafana
    version: 13.2.7
    repository: https://grafana-community.github.io/helm-charts
  - name: opentelemetry-collector
    alias: otel-gateway
    version: 0.174.0
    repository: https://open-telemetry.github.io/opentelemetry-helm-charts
  - name: opentelemetry-collector
    alias: otel-agent
    version: 0.174.0
    repository: https://open-telemetry.github.io/opentelemetry-helm-charts
  - name: opentelemetry-collector
    alias: otel-cluster
    version: 0.174.0
    repository: https://open-telemetry.github.io/opentelemetry-helm-charts
