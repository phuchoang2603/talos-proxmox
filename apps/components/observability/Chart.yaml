apiVersion: v2
name: observability
description: ClickHouse telemetry store, HyperDX, and the OpenTelemetry gateway, node agents, and cluster collector
type: application
version: 0.1.0
dependencies:
  - name: clickstack
    version: 3.4.0
    repository: https://clickhouse.github.io/ClickStack-helm-charts
  - name: oauth2-proxy
    alias: hyperdx-auth
    version: 10.7.1
    repository: https://oauth2-proxy.github.io/manifests
  - name: opentelemetry-collector
    alias: otel-gateway
    version: 0.177.0
    repository: https://open-telemetry.github.io/opentelemetry-helm-charts
  - name: opentelemetry-collector
    alias: otel-agent
    version: 0.177.0
    repository: https://open-telemetry.github.io/opentelemetry-helm-charts
  - name: opentelemetry-collector
    alias: otel-cluster
    version: 0.177.0
    repository: https://open-telemetry.github.io/opentelemetry-helm-charts
