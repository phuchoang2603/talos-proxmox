tunnel:
  hostname: grafana-dev.phuchoang.sbs
victoria-metrics-k8s-stack:
  grafana:
    grafana.ini:
      server:
        domain: grafana-dev.phuchoang.sbs
        root_url: https://grafana-dev.phuchoang.sbs
      auth.generic_oauth:
        auth_url: https://auth-dev.phuchoang.sbs/dex/auth
  vmagent:
    spec:
      externalLabels:
        cluster: dev-talos
        environment: dev
  vlagent:
    spec:
      k8sCollector:
        extraFields: '{"cluster":"dev-talos","environment":"dev"}'
