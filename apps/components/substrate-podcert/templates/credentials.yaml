{{- range $name, $key := dict
  "service-dns-ca-pool" "SUBSTRATE_SERVICE_DNS_CA_POOL"
  "pod-identity-ca-pool" "SUBSTRATE_POD_IDENTITY_CA_POOL"
  "postgres-ca-pool" "SUBSTRATE_POSTGRES_CA_POOL" }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: doppler}
  dataFrom:
    - extract: {key: {{ $key }}}
{{- end }}
