local-path-provisioner:
  fullnameOverride: local-path-provisioner
  storageClass:
    name: local-path
    provisionerName: rancher.io/local-path
    defaultClass: true
    defaultVolumeType: hostPath
    reclaimPolicy: Delete
    volumeBindingMode: WaitForFirstConsumer
  nodePathMap:
    - node: DEFAULT_PATH_FOR_NON_LISTED_NODES
      paths:
        # Talos's kubelet does not see the host's /opt, which breaks subPath mounts; this path is bind-mounted
        # into the kubelet by terraform/proxmox (machine.kubelet.extraMounts).
        - /var/mnt/local-path-provisioner
  helperImage:
    tag: "1.37.0"
  configmap:
    helperPod:
      tolerations:
        - key: node.kubernetes.io/disk-pressure
          operator: Exists
          effect: NoSchedule
