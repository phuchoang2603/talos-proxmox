argo-cd:
  # Kubeflow, Knative, and Argo Workflows push the controller's resource cache past 768Mi.
  controller:
    resources:
      requests:
        memory: 1Gi
      limits:
        memory: 2Gi
  # Rendering the 12M Kubeflow chart starves a 25m repo-server and its 1s health checks time out.
  repoServer:
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        memory: 1Gi
    livenessProbe:
      timeoutSeconds: 5
      failureThreshold: 5
    readinessProbe:
      timeoutSeconds: 5
  configs:
    cm:
      url: https://argocd.phuchoang.sbs
      oidc.config: |
        name: Dex
        issuer: https://auth.phuchoang.sbs/dex
        clientID: argocd
        clientSecret: $argocd-oidc:client-secret
        requestedScopes: [openid, profile, email]
        enablePKCEAuthentication: true
    rbac:
      policy.default: ""
      scopes: '[email]'
      policy.csv: |
        g, xuanphuc.a1gv@gmail.com, role:admin

tunnel:
  enabled: true
  clusterTunnel: talos-proxmox
  hostname: argocd.phuchoang.sbs
