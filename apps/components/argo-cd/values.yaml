argo-cd:
  dex:
    enabled: false
  notifications:
    enabled: false
  applicationSet:
    replicas: 0
  controller:
    env:
      - name: GOMEMLIMIT
        value: 3GiB
    resources:
      requests:
        memory: 2Gi
      limits:
        memory: 4Gi
  repoServer:
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        memory: 1Gi
    livenessProbe:
      timeoutSeconds: 5
      failureThreshold: 5
    readinessProbe:
      timeoutSeconds: 5
  configs:
    cm:
      resource.compareoptions: 'ignoreAggregatedRoles: true

        '
      url: https://argocd.phuchoang.sbs
      oidc.config: 'name: Dex

        issuer: https://auth.phuchoang.sbs/dex

        clientID: argocd

        clientSecret: $argocd-oidc:client-secret

        requestedScopes: [openid, profile, email]

        enablePKCEAuthentication: true

        '
    rbac:
      policy.default: ''
      scopes: '[email]'
      policy.csv: 'g, xuanphuc.a1gv@gmail.com, role:admin

        '
    params:
      server.insecure: true
      controller.diff.server.side: true
