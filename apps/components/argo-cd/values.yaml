argo-cd:
  # This installation uses local admin authentication and ordinary Argo
  # Applications; no SSO, notifications, or ApplicationSets are configured.
  dex:
    enabled: false
  notifications:
    enabled: false
  applicationSet:
    replicas: 0
  controller:
    resources:
      requests:
        cpu: 50m
        memory: 384Mi
      limits:
        memory: 768Mi
  repoServer:
    resources:
      requests:
        cpu: 25m
        memory: 96Mi
      limits:
        memory: 384Mi

  configs:
    cm:
      # The aggregation controller fills in rules on aggregated ClusterRoles (Kubeflow RBAC).
      resource.compareoptions: |
        ignoreAggregatedRoles: true
    params:
      server.insecure: true
      # Compare against a server-side dry run so API defaults (ExternalSecret, HTTPRoute) are not drift.
      controller.diff.server.side: true
