argo-cd:
  dex:
    enabled: false
  notifications:
    enabled: false
  applicationSet:
    replicas: 0
  controller:
    env:
      - name: GOMEMLIMIT
        value: 3GiB
    resources:
      requests:
        memory: 2Gi
      limits:
        memory: 4Gi
  repoServer:
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        memory: 1Gi
    livenessProbe:
      timeoutSeconds: 5
      failureThreshold: 5
    readinessProbe:
      timeoutSeconds: 5
  configs:
    cm:
      resource.compareoptions: 'ignoreAggregatedRoles: true

        '
    params:
      server.insecure: true
      controller.diff.server.side: true
