argo-cd:
  # This installation uses local admin authentication and ordinary Argo
  # Applications; no SSO, notifications, or ApplicationSets are configured.
  dex:
    enabled: false
  notifications:
    enabled: false
  applicationSet:
    replicas: 0

  configs:
    params:
      server.insecure: true
      # Compare against a server-side dry run so API defaults (ExternalSecret, HTTPRoute) are not drift.
      controller.diff.server.side: true
