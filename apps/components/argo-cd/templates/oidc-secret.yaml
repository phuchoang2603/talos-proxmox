{{- if .Values.tunnel.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-oidc
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: argocd-oidc
    template:
      engineVersion: v2
      metadata:
        labels:
          app.kubernetes.io/part-of: argocd
      data:
        client-id: argocd
        client-secret: {{ `"{{ .clientSecret }}"` }}
  data:
    - secretKey: clientSecret
      remoteRef:
        key: AUTH_OIDC_CLIENT_SECRET
{{- end }}
