{{- if .Values.address }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: argo
  namespace: {{ .Release.Namespace }}
spec:
  gatewayClassName: cilium
  addresses:
    - type: IPAddress
      value: {{ .Values.address }}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argo-cd
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: argo
      sectionName: http
  rules:
    - backendRefs:
        - name: {{ .Values.backendService }}
          port: {{ .Values.backendPort }}
{{- end }}
