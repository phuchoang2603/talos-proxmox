apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: aws-cpu
spec:
  amiFamily: Custom
  amiSelectorTerms:
    - id: {{ .Values.amiId }}
  instanceProfile: {{ .Values.instanceProfile }}
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ .Values.clusterName }}
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ .Values.clusterName }}
  associatePublicIPAddress: true
  metadataOptions:
    httpEndpoint: enabled
    httpTokens: required
    httpPutResponseHopLimit: 1
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: {{ .Values.rootVolumeSize }}
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true
  kubelet:
    {{- toYaml .Values.kubelet | nindent 4 }}
  tags:
    managed-by: talos-proxmox
  userData: |
    {{- .Values.userData | nindent 4 }}
{{- if .Values.nodePool.enabled }}
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: aws-workers
spec:
  replicas: {{ .Values.nodePool.replicas }}
  {{- with .Values.nodePool.limits }}
  limits:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  disruption:
    budgets:
      - nodes: "1"
  template:
    metadata:
      labels:
        {{ .Values.burst.labelKey }}: {{ .Values.burst.labelValue }}
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: aws-cpu
      expireAfter: {{ .Values.nodePool.expireAfter }}
      terminationGracePeriod: {{ .Values.nodePool.terminationGracePeriod }}
      startupTaints:
        - key: node.cloudprovider.kubernetes.io/uninitialized
          value: "true"
          effect: NoSchedule
        - key: node.cilium.io/agent-not-ready
          value: "true"
          effect: NoSchedule
      requirements:
        - key: topology.kubernetes.io/zone
          operator: In
          values: {{ toJson .Values.nodePool.zones }}
        - key: kubernetes.io/arch
          operator: In
          values: [amd64]
        - key: karpenter.sh/capacity-type
          operator: In
          values: {{ toJson .Values.nodePool.capacityTypes }}
        - key: node.kubernetes.io/instance-type
          operator: In
          values: {{ toJson .Values.nodePool.instanceTypes }}
{{- end }}
