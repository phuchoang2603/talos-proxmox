# Set by the platform root from the environment's Doppler config.
clusterName: prod-talos
amiId: ami-00000000000000000
instanceProfile: prod-talos-worker
userData: "# set by the platform root"

burst:
  labelKey: burst.talos.dev/compute
  labelValue: aws

rootVolumeSize: 40Gi

# Karpenter uses these only to predict allocatable capacity; they are not applied to Talos.
kubelet:
  kubeReserved:
    cpu: 500m
    memory: 1536Mi
  evictionHard:
    memory.available: 100Mi
    nodefs.available: 20%

nodePool:
  enabled: true
  replicas: 1
  zones: [us-east-1a]
  limits: {nodes: "2"}
  # A small allowlist of cost-effective general-purpose types. Widen this list, or switch to
  # category/generation requirements, to let Karpenter choose from more instances.
  instanceTypes: [m6a.xlarge]
  capacityTypes: [on-demand]
  consolidateAfter: 5m
  expireAfter: 720h
  terminationGracePeriod: 30m

cpuBurst:
  enabled: true
  limits: {cpu: "4", memory: 16Gi}
  consolidateAfter: 5m

# Optional on-demand GPU pool for bounded single-GPU training jobs (up to the limits below, one node each). Disabled until a GPU AMI,
# machine config, zone, single-GPU types and finite limits are chosen from verified quota/offerings.
gpu:
  enabled: false
  # Set cpu "0" in the NodePool limits without changing the rest of the configuration.
  paused: false
  amiId: ami-00000000000000000
  userData: "# set by the platform root"
  # Zones the pool may use; Karpenter tries the next zone when one has no capacity.
  zones: []
  instanceTypes: []
  rootVolumeSize: 100Gi
  workloadLabelKey: burst.talos.dev/workload
  workloadLabelValue: gpu-training
  taintKey: burst.talos.dev/gpu-training
  taintValue: "true"
  # Must cover the largest set of concurrent jobs, one GPU node each, e.g. {cpu: "16", memory: 64Gi, nvidia.com/gpu: "2"}.
  limits: {}
  consolidateAfter: 5m
  expireAfter: 24h
  terminationGracePeriod: 30m
