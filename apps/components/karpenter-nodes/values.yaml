# Set by the platform root from the environment's Doppler config.
clusterName: dev-talos
amiId: ami-00000000000000000
instanceProfile: dev-talos-burst-worker
userData: "# set by the platform root"

burst:
  labelKey: burst.talos.dev/compute
  labelValue: aws
  taintKey: burst.talos.dev/stateless
  taintValue: "true"

rootVolumeSize: 40Gi

# Karpenter uses these only to predict allocatable capacity; they are not applied to Talos.
# Measured on c7i-flex.large workers: Talos allocates 1950m CPU, ~477Mi less memory than capacity,
# and ~8Gi less ephemeral storage than a 40Gi disk. Keep the prediction at or below the real value.
kubelet:
  kubeReserved:
    cpu: 50m
    memory: 400Mi
  evictionHard:
    memory.available: 100Mi
    nodefs.available: 20%

nodePool:
  # Optional cap on total provisioned resources. Empty means no NodePool cap, so the AWS account's
  # vCPU quota is the only ceiling. Example: {cpu: "16", memory: 64Gi}. Set cpu "0" to pause bursting.
  limits: {}
  # A small allowlist of cost-effective general-purpose types. Widen this list, or switch to
  # category/generation requirements, to let Karpenter choose from more instances.
  instanceTypes: [m7i-flex.large, c7i-flex.large]
  capacityTypes: [spot, on-demand]
  consolidateAfter: 5m
  expireAfter: 720h
  terminationGracePeriod: 30m

# Optional on-demand GPU pool for one bounded two-worker training group. Disabled until a GPU AMI,
# machine config, zone, single-GPU types and finite limits are chosen from verified quota/offerings.
gpu:
  enabled: false
  # Set cpu "0" in the NodePool limits without changing the rest of the configuration.
  paused: false
  amiId: ami-00000000000000000
  userData: "# set by the platform root"
  zone: ""
  instanceTypes: []
  rootVolumeSize: 100Gi
  workloadLabelKey: burst.talos.dev/workload
  workloadLabelValue: gpu-training
  taintKey: burst.talos.dev/gpu-training
  taintValue: "true"
  # Must cover exactly one two-worker group, e.g. {cpu: "16", memory: 64Gi, nvidia.com/gpu: "2"}.
  limits: {}
  consolidateAfter: 5m
  expireAfter: 24h
  terminationGracePeriod: 30m
