spark-kubernetes-operator:
  operatorDeployment:
    operatorPod:
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      operatorContainer:
        jvmArgs: -Dfile.encoding=UTF8 -XX:+ExitOnOutOfMemoryError -Xms64m -Xmx256m
        resources:
          requests: {cpu: 100m, memory: 384Mi}
          limits: {cpu: "1", memory: 512Mi}
  image:
    repository: apache/spark-kubernetes-operator
    tag: 1.0.0
  operatorRbac:
    clusterRole:
      create: false
    clusterRoleBinding:
      create: false
    role:
      create: true
    roleBinding:
      create: true
    configManagement:
      create: false
  workloadResources:
    namespaces:
      create: false
      overrideWatchedNamespaces: true
      data: [fraud-data-prod]
    serviceAccount:
      create: false
    role:
      create: false
    clusterRole:
      create: false
    roleBinding:
      create: false
