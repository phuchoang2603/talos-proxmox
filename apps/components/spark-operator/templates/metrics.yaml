apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: spark-kubernetes-operator
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: spark-kubernetes-operator
      spark-role: operator
  podMetricsEndpoints:
    - port: metrics-port
      path: /prometheus
      interval: 30s
