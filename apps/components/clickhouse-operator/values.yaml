altinity-clickhouse-operator:
  fullnameOverride: clickhouse-operator
  watchNamespaces: [data]
  secret:
    create: false
  operator:
    resources:
      requests: {cpu: 10m, memory: 64Mi}
      limits: {memory: 64Mi}
  metrics:
    resources:
      requests: {cpu: 10m, memory: 64Mi}
      limits: {memory: 64Mi}
