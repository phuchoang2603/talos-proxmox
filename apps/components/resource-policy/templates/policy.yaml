apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: pod-resources
spec:
  failurePolicy: Ignore
  reinvocationPolicy: IfNeeded
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
  variables:
    - name: containers
      expression: object.spec.containers
    - name: initContainers
      expression: object.spec.?initContainers.orValue([])
    - name: containerMemory
      expression: >-
        {{- include "resource-policy.memory" "containers" | nindent 8 }}
    - name: initMemory
      expression: >-
        {{- include "resource-policy.memory" "initContainers" | nindent 8 }}
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          {{- include "resource-policy.patches" (dict "field" "containers" "list" "containers" "memory" "containerMemory") | nindent 10 }}
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          {{- include "resource-policy.patches" (dict "field" "initContainers" "list" "initContainers" "memory" "initMemory") | nindent 10 }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: pod-resources
spec:
  policyName: pod-resources
