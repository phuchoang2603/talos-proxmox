storageClass: local-path
substrate:
  image:
    tag: v1.0.0-rc1
  rustfs:
    enabled: false
  ateApi:
    snapshotLocation: gs://platform-dev/substrate/
    resources:
      requests: {cpu: 100m, memory: 128Mi}
    authorization:
      bootstrapOwners:
      - spiffe://cluster.local/ns/kagent/sa/kagent-controller
  objectStorePlugin:
    extraEnv:
    - name: AWS_REGION
      value: us-east-1
    - name: AWS_ENDPOINT_URL
      value: https://minio.home.phuchoang.sbs
    - name: AWS_S3_USE_PATH_STYLE
      value: 'true'
    - name: AWS_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: substrate-snapshots
          key: access-key
    - name: AWS_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: substrate-snapshots
          key: secret-key
  atenetRouter:
    agentgateway:
      resources:
        requests: {cpu: 50m, memory: 64Mi}
    ingressAllowedSPIFFEIDs:
    - spiffe://cluster.local/ns/kagent/sa/kagent-controller
  credentialProvider:
    namespacePolicies:
    - atespace: llm-agents
      allowedNamespaces:
      - llm-agents
