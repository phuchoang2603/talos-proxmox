storageClass: local-path
substrate:
  image:
    tag: v1.0.0-rc1
  preview:
  - PerTemplateSnapshotLocation
  rustfs:
    enabled: false
  ateApi:
    snapshotLocation: gs://platform-dev/substrate/
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {memory: 128Mi}
    authorization:
      bootstrapOwners:
      - spiffe://cluster.local/ns/kagent/sa/kagent-controller
  atelet:
    resources:
      requests: {cpu: 25m, memory: 192Mi}
      limits: {memory: 192Mi}
  objectStorePlugin:
    control:
      resources:
        requests: {cpu: 10m}
        limits: {memory: 64Mi}
    node:
      resources:
        requests: {cpu: 10m, memory: 128Mi}
        limits: {memory: 128Mi}
    extraEnv:
    - name: AWS_REGION
      value: us-east-1
    - name: AWS_ENDPOINT_URL
      value: https://minio.home.phuchoang.sbs
    - name: AWS_S3_USE_PATH_STYLE
      value: 'true'
    - name: AWS_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: substrate-snapshots
          key: access-key
    - name: AWS_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: substrate-snapshots
          key: secret-key
  ateController:
    resources:
      requests: {cpu: 10m, memory: 64Mi}
      limits: {memory: 64Mi}
  ateIdpServer:
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {memory: 32Mi}
  atenetEgress:
    agentgateway:
      resources:
        requests: {cpu: 10m, memory: 96Mi}
        limits: {memory: 96Mi}
  atenetRouter:
    agentgateway:
      resources:
        requests: {cpu: 10m, memory: 96Mi}
        limits: {memory: 96Mi}
    ingressAllowedSPIFFEIDs:
    - spiffe://cluster.local/ns/kagent/sa/kagent-controller
  credentialProvider:
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {memory: 32Mi}
    namespacePolicies:
    - atespace: llm-agents
      allowedNamespaces:
      - llm-agents
