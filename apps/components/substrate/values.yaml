storageClass: local-path
substrate:
  image:
    tag: v1.0.0-rc1
  rustfs:
    enabled: false
  ateApi:
    resources:
      requests: {cpu: 100m, memory: 128Mi}
    authorization:
      bootstrapOwners:
      - spiffe://cluster.local/ns/kagent/sa/kagent-controller
  atenetRouter:
    agentgateway:
      resources:
        requests: {cpu: 50m, memory: 64Mi}
    ingressAllowedSPIFFEIDs:
    - spiffe://cluster.local/ns/kagent/sa/kagent-controller
  credentialProvider:
    namespacePolicies:
    - atespace: llm-agents
      allowedNamespaces:
      - llm-agents
