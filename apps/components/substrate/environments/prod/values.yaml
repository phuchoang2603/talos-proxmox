caFile: environments/prod/ateapi-ca.crt
substrate:
  auth:
    jwt:
      issuer: https://98.85.236.5:6443
  atelet:
    extraEnv:
      - {name: AWS_REGION, value: us-east-1}
      - {name: AWS_ENDPOINT_URL, value: "https://s3.us-east-1.amazonaws.com"}
      - {name: AWS_S3_USE_PATH_STYLE, value: "false"}
      - name: AWS_ACCESS_KEY_ID
        valueFrom:
          secretKeyRef: {name: substrate-snapshots, key: access-key}
      - name: AWS_SECRET_ACCESS_KEY
        valueFrom:
          secretKeyRef: {name: substrate-snapshots, key: secret-key}
