cloudObjectStorage: true
storageClass: cloud-block
routerRequestParking:
  budget: 30s
  max: 1024
  retryInterval: 100ms
  retryFactor: 1.1
databaseNodeSelector:
  talos.dev/capacity-type: on-demand
substrate:
  objectStorePlugin:
    extraEnv:
      - name: AWS_REGION
        valueFrom:
          secretKeyRef: {name: substrate-snapshots, key: region}
      - name: AWS_ENDPOINT_URL
        valueFrom:
          secretKeyRef: {name: substrate-snapshots, key: endpoint}
      - {name: AWS_S3_USE_PATH_STYLE, value: "true"}
      - name: AWS_ACCESS_KEY_ID
        valueFrom:
          secretKeyRef: {name: substrate-snapshots, key: access-key}
      - name: AWS_SECRET_ACCESS_KEY
        valueFrom:
          secretKeyRef: {name: substrate-snapshots, key: secret-key}
