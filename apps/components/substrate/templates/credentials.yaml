{{- range $name, $key := dict
  "actor-id-jwt-pool" "SUBSTRATE_ACTOR_ID_JWT_POOL"
  "actor-id-ca-pool" "SUBSTRATE_ACTOR_ID_CA_POOL"
  "egress-mitm-ca-pool" "SUBSTRATE_EGRESS_MITM_CA_POOL" }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: doppler}
  dataFrom:
    - extract: {key: {{ $key }}}
{{- end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: actor-id-ca-certs
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: doppler}
  target:
    template:
      data:
        ca.crt: '{{ `{{ index . "tls.crt" }}` }}'
  dataFrom:
    - extract: {key: SUBSTRATE_ACTOR_ID_CA_POOL}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: substrate-snapshots
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: doppler}
  data:
    - secretKey: access-key
      remoteRef: {key: OBJECT_SUBSTRATE_ACCESS_KEY_ID}
    - secretKey: secret-key
      remoteRef: {key: OBJECT_SUBSTRATE_SECRET_ACCESS_KEY}
