{{- range $name, $entry := dict
  "ateapi-tls" (dict "type" "kubernetes.io/tls" "data" (dict "tls.crt" "SUBSTRATE_SERVER_CERT" "tls.key" "SUBSTRATE_SERVER_KEY"))
  "session-id-jwt-pool" (dict "type" "Opaque" "data" (dict "pool" "SUBSTRATE_SESSION_JWT_POOL"))
  "session-id-ca-pool" (dict "type" "Opaque" "data" (dict "pool" "SUBSTRATE_SESSION_CA_POOL"))
  "substrate-snapshots" (dict "type" "Opaque" "data" (dict "access-key" "OBJECT_SUBSTRATE_ACCESS_KEY_ID" "secret-key" "OBJECT_SUBSTRATE_SECRET_ACCESS_KEY")) }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: doppler}
  target:
    template:
      type: {{ $entry.type }}
  data:
{{- range $key, $remote := $entry.data }}
    - secretKey: {{ $key }}
      remoteRef: {key: {{ $remote }}}
{{- end }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ateapi-ca
data:
  ca.crt: |
{{ .Files.Get .Values.caFile | indent 4 }}
