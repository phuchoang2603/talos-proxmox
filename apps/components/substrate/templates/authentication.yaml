apiVersion: v1
kind: ConfigMap
metadata:
  name: ate-api-authentication
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  authentication.yaml: |
    jwtProviders:
      - name: kubernetes
        issuer: {{ required "serviceAccountIssuer is required" .Values.serviceAccountIssuer }}
        audiences: [api.ate-system.svc]
