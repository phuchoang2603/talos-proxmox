cert-manager:
  crds:
    enabled: true
    keep: true
  startupapicheck:
    enabled: false
  resources:
    requests:
      cpu: 10m
    limits:
      memory: 128Mi
  webhook:
    resources:
      requests:
        cpu: 10m
      limits:
        memory: 64Mi
  cainjector:
    resources:
      requests:
        cpu: 10m
      limits:
        memory: 512Mi

trust-manager:
  app:
    trust:
      namespace: operators
  secretTargets:
    enabled: true
    authorizedSecrets:
      - kubernetes-origin-ca
  resources:
    requests:
      cpu: 10m
    limits:
      memory: 64Mi
