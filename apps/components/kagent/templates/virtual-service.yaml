apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: kagent-ui
spec:
  gateways: [ml/kubeflow-gateway]
  hosts:
    - {{ .Values.tunnel.hostname }}
  http:
    - match:
        - uri: {prefix: /oauth2/}
      route:
        - destination:
            host: oauth2-proxy.auth.svc.cluster.local
            port: {number: 80}
    - route:
        - destination:
            host: kagent-ui.{{ .Release.Namespace }}.svc.cluster.local
            port: {number: 8080}
