apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ateapi-trust
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: doppler}
  data:
    - secretKey: ca.crt
      remoteRef: {key: SUBSTRATE_CA_CERT}
