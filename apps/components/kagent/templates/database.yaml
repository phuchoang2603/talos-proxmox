apiVersion: v1
kind: ServiceAccount
metadata:
  name: kagent-postgres-reader
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: substrate-platform
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  provider:
    kubernetes:
      remoteNamespace: ate-system
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: kagent-postgres-reader
{{- range $name := list "kagent-postgres-owner" "kagent-postgres-readwrite" }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: substrate-platform}
  dataFrom:
    - extract: {key: {{ $name }}}
{{- end }}
