storageClass: local-path
kagent:
  fullnameOverride: kagent
  providers: false
  database:
    postgres:
      bundled: {enabled: false}
      urlFile: /etc/kagent-database/url
  controller:
    watchNamespaces: [ml, kagent]
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {memory: 1Gi}
    substrate:
      enabled: true
      ateApiEndpoint: dns:///api.ate-system.svc:443
      atenetRouterURL: http://atenet-router.ate-system.svc:80
      defaultWorkerPool: {namespace: kagent, name: kagent-default}
    env:
      - name: SSL_CERT_FILE
        value: /etc/ateapi-ca/ca.crt
    volumes:
      - name: database
        secret: {secretName: kagent-database}
      - name: ateapi-ca
        secret: {secretName: ateapi-trust}
    volumeMounts:
      - {name: database, mountPath: /etc/kagent-database, readOnly: true}
      - {name: ateapi-ca, mountPath: /etc/ateapi-ca, readOnly: true}
  substrateWorkerPool:
    create: true
    name: kagent-default
    replicas: 1
    ateomImage: ghcr.io/kagent-dev/substrate/ateom-gvisor:v0.0.9
    sandboxClass: gvisor
    template:
      resources:
        requests: {cpu: 100m, memory: 256Mi}
        limits: {memory: 2Gi}
  ui:
    service: {type: ClusterIP}
    resources:
      requests: {cpu: 50m, memory: 256Mi}
      limits: {memory: 1Gi}
  kmcp: {enabled: false}
  substrate: {enabled: false}
  kagent-tools: {enabled: false}
  grafana-mcp: {enabled: false}
  k8s-agent: {enabled: false}
  kgateway-agent: {enabled: false}
  istio-agent: {enabled: false}
  promql-agent: {enabled: false}
  observability-agent: {enabled: false}
  argo-rollouts-agent: {enabled: false}
  helm-agent: {enabled: false}
  cilium-policy-agent: {enabled: false}
  cilium-manager-agent: {enabled: false}
  cilium-debug-agent: {enabled: false}

identity:
  clientID: kagent-ui

tunnel:
  clusterTunnel: talos-proxmox
  hostname: kagent.phuchoang.sbs

oauth2-proxy:
  enabled: true
  fullnameOverride: kagent-ui-auth
  image: {tag: v7.15.5}
  config:
    existingSecret: kagent-ui-oidc
    cookieName: __Host-kagent
    emailDomains: []
    upstreams: [http://kagent-ui.kagent.svc.cluster.local:8080]
  authenticatedEmailsFile:
    enabled: true
    restricted_access: |-
      xuanphuc.a1gv@gmail.com
  extraArgs:
    provider: oidc
    oidc-issuer-url: https://auth.phuchoang.sbs/dex
    skip-oidc-discovery: "true"
    login-url: https://auth.phuchoang.sbs/dex/auth
    redeem-url: http://dex.auth.svc.cluster.local:5556/dex/token
    oidc-jwks-url: http://dex.auth.svc.cluster.local:5556/dex/keys
    redirect-url: https://kagent.phuchoang.sbs/oauth2/callback
    skip-provider-button: "true"
    approval-prompt: auto
    reverse-proxy: "true"
    cookie-secure: "true"
    cookie-samesite: lax
    pass-basic-auth: "false"
  service: {type: ClusterIP}
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 128Mi}
