kagent:
  fullnameOverride: kagent
  providers: false
  global:
    watchNamespaces:
    - llm
    - llm-agents
    - kagent
  config:
    database:
      schema: kagent
    runtimeDefaults:
      cpu: 250m
      memory: 256Mi
    server:
      auth:
        mode: trusted-proxy
    telemetry:
      traces:
        endpoint: http://vtagent-vmks.observability.svc.cluster.local:10429/insert/opentelemetry/v1/traces
        protocol: http/protobuf
  controller:
    substrateClientCertificate:
      enabled: true
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: '2'
        memory: 1Gi
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        prometheusServiceAccount:
          name: vmagent-vmks
          namespace: observability
  substrateWorkerPool:
    create: false
  ui:
    service:
      type: ClusterIP
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: '1'
        memory: 1Gi
  kagent-tools:
    enabled: false
  oauth2-proxy:
    enabled: false
tunnel:
  clusterTunnel: talos-proxmox
  hostname: kagent.phuchoang.sbs
auth:
  dexIssuer: https://auth.phuchoang.sbs/dex
  gatewayJWKS: '{"keys": [{"kty": "EC", "crv": "P-256", "x": "NavrGdA_xoEL7-lPXnCShh8nbZ5PxnFeT-q7gsEEZy4",
    "y": "91MePK63xtPJixjHab9snqFcTJdqrliiIXBUFV9ImS0", "use": "sig", "alg": "ES256"}]}'
  actorJWKS: '{"keys": [{"kty": "EC", "crv": "P-256", "x": "vMQ_PxEJK-7OgY0oMBTyCEd22y7JTaRKPIpPxuxgWZE",
    "y": "whkT5iUFINNRaJuJXnGwYczgUuAX9iTScjK3uxWEv-o", "kid": "830YXHGpIClPKyzcHUJqlAsk5FGRuUghjYZtIyz1wRY",
    "alg": "ES256", "use": "sig"}]}'
