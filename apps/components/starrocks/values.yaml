kube-starrocks:
  operator:
    timeZone: UTC
    starrocksOperator:
      watchNamespace: starrocks
      resources:
        requests: {cpu: 50m, memory: 128Mi}
        limits: {cpu: 500m, memory: 800Mi}
      imagePullPolicy: IfNotPresent
  starrocks:
    timeZone: UTC
    starrocksCluster:
      componentValues:
        image:
          tag: 4.1.6
    starrocksFESpec:
      replicas: 1
      feEnvVars:
        - name: MYSQL_PWD
          valueFrom:
            secretKeyRef: {name: starrocks-setup, key: ROOT_PASSWORD}
      resources:
        requests: {cpu: 100m, memory: 1536Mi}
        limits: {cpu: "2", memory: 3Gi}
      storageSpec:
        name: fe
        storageClassName: local-path
        storageSize: 10Gi
        logStorageClassName: local-path
        logStorageSize: 2Gi
      config: |
        LOG_DIR = ${STARROCKS_HOME}/log
        DATE = "$(date +%Y%m%d-%H%M%S)"
        JAVA_OPTS="-Dlog4j2.formatMsgNoLookups=true -Xmx1536m -XX:+UseG1GC -Xlog:gc*:${LOG_DIR}/fe.gc.log.$DATE:time"
        http_port = 8030
        rpc_port = 9020
        query_port = 9030
        edit_log_port = 9010
        mysql_service_nio_enabled = true
        sys_log_level = INFO
        min_graceful_exit_time_second = 25
        default_replication_num = 1
    starrocksBeSpec:
      replicas: 1
      beEnvVars:
        - name: MYSQL_PWD
          valueFrom:
            secretKeyRef: {name: starrocks-setup, key: ROOT_PASSWORD}
      resources:
        requests: {cpu: 250m, memory: 2Gi}
        limits: {cpu: "3", memory: 5Gi}
      storageSpec:
        name: be
        storageClassName: local-path
        storageSize: 20Gi
        logStorageClassName: local-path
        logStorageSize: 2Gi
        spillStorageClassName: local-path
        spillStorageSize: 20Gi

setup:
  image: starrocks/fe-ubuntu:4.1.6
  rootPasswordKey: STARROCKS_ROOT_PASSWORD
  catalogs:
    - name: lakehouse
      uri: https://minio.home.phuchoang.sbs/iceberg
      warehouse: fraud-lakehouse-prod
      region: us-east-1
      signingName: s3
      s3Endpoint: https://minio.home.phuchoang.sbs
      accessKey: STARROCKS_RUSTFS_ACCESS_KEY
      secretKey: STARROCKS_RUSTFS_SECRET_KEY
  users:
    - name: openmetadata
      passwordKey: STARROCKS_OPENMETADATA_PASSWORD
      queryTimeoutSeconds: 3600
