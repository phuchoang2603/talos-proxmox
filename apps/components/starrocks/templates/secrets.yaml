apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: starrocks-setup
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: starrocks-setup
  data:
    - secretKey: ROOT_PASSWORD
      remoteRef:
        key: {{ .Values.catalog.secrets.rootPassword }}
    - secretKey: S3_ACCESS_KEY
      remoteRef:
        key: {{ .Values.catalog.secrets.accessKey }}
    - secretKey: S3_SECRET_KEY
      remoteRef:
        key: {{ .Values.catalog.secrets.secretKey }}
  {{- range $user, $key := .Values.catalog.users }}
    - secretKey: PASSWORD_{{ $user | upper }}
      remoteRef:
        key: {{ $key }}
  {{- end }}
