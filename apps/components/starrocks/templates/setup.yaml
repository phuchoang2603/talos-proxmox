{{- $s := .Values.setup }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: starrocks-setup
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: starrocks-setup
  data:
    - secretKey: ROOT_PASSWORD
      remoteRef:
        key: {{ $s.rootPasswordKey }}
  {{- range $i, $c := $s.catalogs }}
    - secretKey: CATALOG_{{ $i }}_ACCESS_KEY
      remoteRef:
        key: {{ $c.accessKey }}
    - secretKey: CATALOG_{{ $i }}_SECRET_KEY
      remoteRef:
        key: {{ $c.secretKey }}
  {{- end }}
  {{- range $i, $u := $s.users }}
    - secretKey: USER_{{ $i }}_PASSWORD
      remoteRef:
        key: {{ $u.passwordKey }}
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: starrocks-setup
data:
  setup.sql: |
  {{- range $i, $c := $s.catalogs }}
    CREATE EXTERNAL CATALOG IF NOT EXISTS {{ $c.name }} PROPERTIES (
      "type" = "iceberg",
      "iceberg.catalog.type" = "rest",
      "iceberg.catalog.uri" = "{{ $c.uri }}",
      "iceberg.catalog.warehouse" = "{{ $c.warehouse }}",
      "iceberg.catalog.vended-credentials-enabled" = "false",
      "iceberg.catalog.rest.sigv4-enabled" = "true",
      "iceberg.catalog.rest.signing-name" = "{{ $c.signingName }}",
      "iceberg.catalog.rest.signing-region" = "{{ $c.region }}",
      "iceberg.catalog.rest.access-key-id" = "@CATALOG_{{ $i }}_ACCESS_KEY@",
      "iceberg.catalog.rest.secret-access-key" = "@CATALOG_{{ $i }}_SECRET_KEY@",
      "aws.s3.use_instance_profile" = "false",
      "aws.s3.access_key" = "@CATALOG_{{ $i }}_ACCESS_KEY@",
      "aws.s3.secret_key" = "@CATALOG_{{ $i }}_SECRET_KEY@",
      "aws.s3.region" = "{{ $c.region }}",
      "aws.s3.endpoint" = "{{ $c.s3Endpoint }}",
      "aws.s3.enable_path_style_access" = "true"
    );
  {{- end }}
  {{- range $i, $u := $s.users }}
    CREATE USER IF NOT EXISTS '{{ $u.name }}'@'%' IDENTIFIED BY '@USER_{{ $i }}_PASSWORD@';
    ALTER USER '{{ $u.name }}'@'%' IDENTIFIED BY '@USER_{{ $i }}_PASSWORD@';
    SET PROPERTY FOR '{{ $u.name }}' 'session.query_timeout' = '{{ $u.queryTimeoutSeconds }}';
    {{- range $s.catalogs }}
    GRANT USAGE ON CATALOG {{ .name }} TO USER '{{ $u.name }}'@'%';
    SET CATALOG {{ .name }};
    GRANT SELECT ON ALL TABLES IN ALL DATABASES TO USER '{{ $u.name }}'@'%';
    {{- end }}
  {{- end }}
  setup.sh: |
    set -eu
    sr() { MYSQL_PWD="$1" mysql -h kube-starrocks-fe-service -P 9030 -uroot --connect-timeout=5 "${@:2}"; }
    until sr "$ROOT_PASSWORD" -e 'SELECT 1' >/dev/null 2>&1 || sr "" -e 'SELECT 1' >/dev/null 2>&1; do sleep 10; done
    sr "" -e "ALTER USER root IDENTIFIED BY '$ROOT_PASSWORD'" >/dev/null 2>&1 || true
    sed {{ range $i, $c := $s.catalogs }}-e "s|@CATALOG_{{ $i }}_ACCESS_KEY@|$CATALOG_{{ $i }}_ACCESS_KEY|g" -e "s|@CATALOG_{{ $i }}_SECRET_KEY@|$CATALOG_{{ $i }}_SECRET_KEY|g" {{ end }}{{ range $i, $u := $s.users }}-e "s|@USER_{{ $i }}_PASSWORD@|$USER_{{ $i }}_PASSWORD|g" {{ end }}/setup/setup.sql | sr "$ROOT_PASSWORD"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: starrocks-setup
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 20
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: apply
          image: {{ $s.image }}
          command: [bash, /setup/setup.sh]
          envFrom:
            - secretRef:
                name: starrocks-setup
          volumeMounts:
            - {name: setup, mountPath: /setup}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
      volumes:
        - name: setup
          configMap:
            name: starrocks-setup
