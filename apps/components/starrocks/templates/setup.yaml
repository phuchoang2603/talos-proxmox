apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: starrocks-setup
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: starrocks-setup
  data:
    - secretKey: ROOT_PASSWORD
      remoteRef:
        key: {{ .Values.setup.rootPasswordKey }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: starrocks-setup
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 20
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: apply
          image: {{ .Values.setup.image }}
          command: [bash, -ec]
          args:
            - |
              until MYSQL_PWD="$ROOT_PASSWORD" mysql -h kube-starrocks-fe-service -P 9030 -uroot --connect-timeout=5 -e 'SELECT 1' >/dev/null 2>&1 || mysql -h kube-starrocks-fe-service -P 9030 -uroot --connect-timeout=5 -e 'SELECT 1' >/dev/null 2>&1; do sleep 10; done
              if mysql -h kube-starrocks-fe-service -P 9030 -uroot --connect-timeout=5 -e 'SELECT 1' >/dev/null 2>&1; then
                mysql -h kube-starrocks-fe-service -P 9030 -uroot --connect-timeout=5 -e "ALTER USER root IDENTIFIED BY '$ROOT_PASSWORD'"
              fi
          envFrom:
            - secretRef:
                name: starrocks-setup
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
