apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-catalog-server
  namespace: kubeflow
spec:
  template:
    spec:
      containers:
      - name: catalog
        resources:
          limits:
            memory: 64Mi
          requests:
            cpu: 10m
      - name: perf-data-init
        resources:
          limits:
            memory: 64Mi
          requests:
            cpu: 10m
