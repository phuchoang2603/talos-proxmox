apiVersion: apps/v1
kind: Deployment
metadata:
  name: kserve-controller-manager
  namespace: kserve
spec:
  template:
    spec:
      containers:
      - name: manager
        resources:
          limits:
            cpu: null
            memory: 128Mi
          requests:
            cpu: 10m
            memory: null
      - name: kube-rbac-proxy
        resources:
          limits:
            cpu: null
            memory: 48Mi
          requests:
            cpu: 10m
            memory: null
---
