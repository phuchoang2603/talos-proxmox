apiVersion: v1
kind: ConfigMap
metadata:
  name: inferenceservice-config
  namespace: kserve
data:
  deploy: |-
    {
      "defaultDeploymentMode": "Standard"
    }
  ingress: |-
    {
      "disableHTTPRouteTimeout": false,
      "enableGatewayApi": false,
      "kserveIngressGateway": "kubeflow/kubeflow-gateway",
      "ingressGateway": "kubeflow/kubeflow-gateway",
      "localGateway": "istio-system/cluster-local-gateway",
      "localGatewayService": "cluster-local-gateway.istio-system.svc.cluster.local",
      "ingressDomain": "example.com",
      "ingressClassName": "istio",
      "domainTemplate": "{{ .Name }}-{{ .Namespace }}.{{ .IngressDomain }}",
      "urlScheme": "http",
      "disableIstioVirtualHost": false,
      "disableIngressCreation": true,
      "pathTemplate": "/serving/{{ .Namespace }}/{{ .Name }}"
    }
