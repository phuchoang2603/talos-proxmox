apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ml
resources:
- https://github.com/kubeflow/hub//manifests/kustomize/base?ref=v0.3.17
- https://github.com/kubeflow/hub//manifests/kustomize/options/ui/overlays/istio?ref=v0.3.17
images:
- name: ghcr.io/kubeflow/hub/server
  newTag: v0.3.17
patches:
- target:
    kind: Deployment
    name: model-registry-deployment
  patch: "- op: replace\n  path: /spec/template/metadata/labels/sidecar.istio.io~1inject\n\
    \  value: 'false'\n- op: replace\n  path: /spec/template/spec/containers/0/env\n\
    \  value:\n  - name: DATABASE_DSN\n    valueFrom:\n      secretKeyRef:\n     \
    \   name: kubeflow-registry-db-credentials\n        key: dsn\n- op: replace\n\
    \  path: /spec/template/spec/containers/0/args\n  value:\n  - --hostname=0.0.0.0\n\
    \  - --port=8080\n  - --datastore-type=embedmd\n  - --embedmd-database-type=postgres\n\
    \  - --embedmd-database-dsn=$(DATABASE_DSN)\n- op: add\n  path: /spec/template/spec/containers/0/volumeMounts\n\
    \  value:\n  - name: db-ca\n    mountPath: /etc/db-ca\n    readOnly: true\n- op:\
    \ add\n  path: /spec/template/spec/volumes\n  value:\n  - name: db-ca\n    secret:\n\
    \      secretName: kubeflow-registry-db-ca\n- op: add\n  path: /spec/template/spec/containers/0/resources\n\
    \  value:\n    requests:\n      cpu: 100m\n      memory: 128Mi\n    limits:\n\
    \      memory: 512Mi\n- op: replace\n  path: /spec/template/spec/containers/0/startupProbe/failureThreshold\n\
    \  value: 60\n"
- target:
    kind: Deployment
    name: model-registry-ui
  patch: "- op: replace\n  path: /spec/template/spec/containers/0/resources\n  value:\n\
    \    requests:\n      cpu: 100m\n      memory: 256Mi\n    limits:\n      memory:\
    \ 1Gi\n"
- target:
    kind: VirtualService
    name: model-registry-ui
  patch: "- op: replace\n  path: /spec/http/0/route/0/destination/host\n  value: model-registry-ui-service.ml.svc.cluster.local\n"
- target:
    kind: DestinationRule
    name: model-registry-ui
  patch: "- op: replace\n  path: /spec/host\n  value: model-registry-ui-service.ml.svc.cluster.local\n"
