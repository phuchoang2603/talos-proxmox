            cpu: null
            memory: 64Mi
          requests:
            cpu: 10m
            memory: null
      - name: kube-rbac-proxy
        resources:
          limits:
            cpu: null
            memory: 32Mi
          requests:
            cpu: 10m
            memory: null
---
