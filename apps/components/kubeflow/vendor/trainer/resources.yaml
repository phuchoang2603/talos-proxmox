apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobset-controller-manager
  namespace: kubeflow
spec:
  template:
    spec:
      containers:
      - name: manager
        resources:
          limits:
            cpu: null
            memory: 96Mi
          requests:
            cpu: 10m
            memory: null
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeflow-trainer-controller-manager
  namespace: kubeflow
spec:
  template:
    spec:
      containers:
      - name: manager
        resources:
          limits:
            memory: 64Mi
          requests:
            cpu: 10m
