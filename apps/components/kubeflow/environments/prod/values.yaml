storageClass: gp3
objectStorage:
  bucket: platform-prod-142737101504-us-east-1
  endpoint: https://s3.us-east-1.amazonaws.com
  host: s3.us-east-1.amazonaws.com
  forcePathStyle: false
databaseNodeSelector:
  karpenter.sh/capacity-type: on-demand
localModel:
  nodeSelector:
    kubernetes.io/hostname: null
    karpenter.sh/nodepool: aws-gpu-training
gpuTraining:
  numNodes: 2
  nodeSelector:
    nvidia.com/gpu.present: null
    karpenter.sh/nodepool: aws-gpu-training
    burst.talos.dev/compute: aws
    burst.talos.dev/workload: gpu-training
  tolerations:
  - key: burst.talos.dev/gpu-training
    operator: Equal
    value: 'true'
    effect: NoSchedule
