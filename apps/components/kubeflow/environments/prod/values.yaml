storageClass: cloud-block
databaseNodeSelector:
  talos.dev/capacity-type: on-demand
localModel:
  enabled: false
  nodeSelector:
    kubernetes.io/hostname: null
    talos.dev/nodepool: gpu
gpuTraining:
  numNodes: 2
  nodeSelector:
    nvidia.com/gpu.present: null
    talos.dev/nodepool: gpu
    talos.dev/cloud: gcp
    burst.talos.dev/workload: gpu-training
  tolerations:
  - key: burst.talos.dev/gpu-training
    operator: Equal
    value: 'true'
    effect: NoSchedule
