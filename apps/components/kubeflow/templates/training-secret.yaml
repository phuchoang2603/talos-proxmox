apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ml-s3
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: ml-s3
    template:
      engineVersion: v2
      data:
        AWS_ACCESS_KEY_ID: {{ `"{{ .accessKeyId }}"` }}
        AWS_SECRET_ACCESS_KEY: {{ `"{{ .secretAccessKey }}"` }}
        AWS_ENDPOINT_URL: {{ .Values.objectStorage.endpoint | quote }}
        OBJECT_STORAGE_ENDPOINT: {{ .Values.objectStorage.endpoint | quote }}
        AWS_DEFAULT_REGION: {{ .Values.objectStorage.region | quote }}
        OBJECT_STORAGE_BUCKET: {{ `"{{ .bucket }}"` }}
  data:
    - secretKey: accessKeyId
      remoteRef:
        key: OBJECT_ARTIFACTS_ACCESS_KEY_ID
    - secretKey: secretAccessKey
      remoteRef:
        key: OBJECT_ARTIFACTS_SECRET_ACCESS_KEY
    - secretKey: bucket
      remoteRef:
        key: OBJECT_STORAGE_BUCKET
