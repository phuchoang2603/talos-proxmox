{{- if .Values.components.pipeline }}
apiVersion: v1
data:
  defaultPipelineRoot: s3://{{ .Values.objectStorage.bucket }}/{{ .Values.objectStorage.artifactPrefix }}
  providers: |
    s3:
      default:
        endpoint: {{ .Values.objectStorage.endpoint }}
        disableSSL: false
        region: us-east-1
        forcePathStyle: {{ .Values.objectStorage.forcePathStyle }}
        credentials:
          fromEnv: false
          secretRef:
            secretName: mlpipeline-minio-artifact
            accessKeyKey: accesskey
            secretKeyKey: secretkey
kind: ConfigMap
metadata:
  labels:
    application-crd-id: kubeflow-pipelines
  name: kfp-launcher
  namespace: ml
---
apiVersion: v1
data:
  ALLOWED_ARTIFACT_ENDPOINTS: {{ .Values.objectStorage.endpoint }}
  ALLOWED_GCS_UNIVERSE_DOMAINS: googleapis.com
  ARCHIVED_RUNS_RETENTION_TIME: ""
  ARTIFACT_RETENTION_DAYS: "-1"
  ARTIFACTS_PROXY_ENABLED: "false"
  ConMaxLifeTime: 120s
  DBDriverName: pgx
  DRIVER_POD_ANNOTATIONS: ""
  DRIVER_POD_LABELS: ""
  HTTP_BASE_URL: ""
  LOG_LEVEL: info
  RUNS_GC_BATCH_SIZE: "100"
  RUNS_GC_INTERVAL: 6h
  RUNS_RETENTION_TIME: ""
  USERID_HEADER: kubeflow-userid
  USERID_PREFIX: ""
  appName: pipeline
  appVersion: 2.17.1
  bucketName: {{ .Values.objectStorage.bucket | quote }}
  cronScheduleTimezone: UTC
  dbCredentialProvider: ""
  dbCredentialProviderEnabled: "false"
  dbCredentialProviderSettings: ""
  dbTLSCAPath: ""
  dbType: postgres
  defaultPipelineRoot: s3://{{ .Values.objectStorage.bucket }}/{{ .Values.objectStorage.artifactPrefix }}
  defaultSecurityContextHostUsers: "false"
  defaultSecurityContextRunAsGroup: ""
  defaultSecurityContextRunAsNonRoot: ""
  defaultSecurityContextRunAsUser: ""
  pipelineDb: mlpipeline
  postgresExtraParams: '{"sslmode":"verify-full","sslrootcert":"/etc/kfp-db-ca/ca.crt"}'
  postgresHost: kubeflow-pipelines-db-rw
  postgresPort: "5432"
  warning: |
    1. Do not use kubectl to edit this configmap, because some values are used
    during kustomize build. Instead, change the configmap and apply the entire
    kustomize manifests again.
    2. After updating the configmap, some deployments may need to be restarted
    until the changes take effect. A quick way to restart all deployments in a
    namespace: `kubectl rollout restart deployment -n <your-namespace>`.
kind: ConfigMap
metadata:
  labels:
    application-crd-id: kubeflow-pipelines
  name: pipeline-install-config
  namespace: ml
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: ml-pipeline
    application-crd-id: kubeflow-pipelines
  name: ml-pipeline
  namespace: ml
spec:
  selector:
    matchLabels:
      app: ml-pipeline
      application-crd-id: kubeflow-pipelines
  template:
    metadata:
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
      labels:
        app: ml-pipeline
        application-crd-id: kubeflow-pipelines
    spec:
      containers:
      - args:
        - --config=/config
        - --sampleconfig=/config/sample_config.json
        - -logtostderr=true
        - --webhookTLSCertPath=/etc/webhook/certs/tls.crt
        - --webhookTLSKeyPath=/etc/webhook/certs/tls.key
        - --pipelinesStoreKubernetes=true
        command:
        - /bin/apiserver
        env:
        - name: OBJECTSTORECONFIG_SECURE
          value: "true"
        - name: OBJECTSTORECONFIG_HOST
          value: {{ .Values.objectStorage.host | quote }}
        - name: OBJECTSTORECONFIG_PORT
          value: "443"
        - name: DBDRIVERNAME
          valueFrom:
            configMapKeyRef:
              key: DBDriverName
              name: pipeline-install-config
        - name: DBCONFIG_POSTGRESQLCONFIG_USER
          valueFrom:
            secretKeyRef:
              key: username
              name: postgres-secret-extended
        - name: DBCONFIG_POSTGRESQLCONFIG_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: postgres-secret-extended
        - name: DBCONFIG_POSTGRESQLCONFIG_DBNAME
          valueFrom:
            configMapKeyRef:
              key: pipelineDb
              name: pipeline-install-config
        - name: DBCONFIG_POSTGRESQLCONFIG_HOST
          valueFrom:
            configMapKeyRef:
              key: postgresHost
              name: pipeline-install-config
        - name: DBCONFIG_POSTGRESQLCONFIG_PORT
          valueFrom:
            configMapKeyRef:
              key: postgresPort
              name: pipeline-install-config
        - name: DBCONFIG_POSTGRESQLCONFIG_EXTRAPARAMS
          valueFrom:
            configMapKeyRef:
              key: postgresExtraParams
              name: pipeline-install-config
        - name: V2_DRIVER_IMAGE
          value: ghcr.io/kubeflow/kfp-driver:run-37518086931-1
        - name: V2_LAUNCHER_IMAGE
          value: ghcr.io/kubeflow/kfp-launcher:run-37518086931-1
        - name: PUBLISH_LOGS
          value: "true"
        - name: LOG_LEVEL
          value: info
        - name: PIPELINE_LOG_LEVEL
          value: "1"
        - name: CRON_SCHEDULE_TIMEZONE
          valueFrom:
            configMapKeyRef:
              key: cronScheduleTimezone
              name: pipeline-install-config
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: CLUSTER_DOMAIN
          value: cluster.local
        - name: OBJECTSTORECONFIG_BUCKETNAME
          valueFrom:
            configMapKeyRef:
              key: bucketName
              name: pipeline-install-config
        - name: DBCONFIG_CONMAXLIFETIME
          valueFrom:
            configMapKeyRef:
              key: ConMaxLifeTime
              name: pipeline-install-config
        - name: DB_CREDENTIAL_PROVIDER_ENABLED
          valueFrom:
            configMapKeyRef:
              key: dbCredentialProviderEnabled
              name: pipeline-install-config
              optional: true
        - name: DB_CREDENTIAL_PROVIDER
          valueFrom:
            configMapKeyRef:
              key: dbCredentialProvider
              name: pipeline-install-config
              optional: true
        - name: DB_TLS_CA_PATH
          valueFrom:
            configMapKeyRef:
              key: dbTLSCAPath
              name: pipeline-install-config
              optional: true
        - name: DB_CREDENTIAL_PROVIDER_SETTINGS
          valueFrom:
            configMapKeyRef:
              key: dbCredentialProviderSettings
              name: pipeline-install-config
              optional: true
        - name: OBJECTSTORECONFIG_ACCESSKEY
          valueFrom:
            secretKeyRef:
              key: accesskey
              name: mlpipeline-minio-artifact
        - name: OBJECTSTORECONFIG_SECRETACCESSKEY
          valueFrom:
            secretKeyRef:
              key: secretkey
              name: mlpipeline-minio-artifact
        - name: COMPILED_PIPELINE_SPEC_PATCH
          value: '{}'
        - name: DEFAULT_SECURITY_CONTEXT_RUN_AS_USER
          valueFrom:
            configMapKeyRef:
              key: defaultSecurityContextRunAsUser
              name: pipeline-install-config
              optional: true
        - name: DEFAULT_SECURITY_CONTEXT_RUN_AS_GROUP
          valueFrom:
            configMapKeyRef:
              key: defaultSecurityContextRunAsGroup
              name: pipeline-install-config
              optional: true
        - name: DEFAULT_SECURITY_CONTEXT_RUN_AS_NON_ROOT
          valueFrom:
            configMapKeyRef:
              key: defaultSecurityContextRunAsNonRoot
              name: pipeline-install-config
              optional: true
        - name: DEFAULT_SECURITY_CONTEXT_HOST_USERS
          valueFrom:
            configMapKeyRef:
              key: defaultSecurityContextHostUsers
              name: pipeline-install-config
              optional: true
        - name: DRIVER_POD_LABELS
          valueFrom:
            configMapKeyRef:
              key: DRIVER_POD_LABELS
              name: pipeline-install-config
              optional: true
        - name: DRIVER_POD_ANNOTATIONS
          valueFrom:
            configMapKeyRef:
              key: DRIVER_POD_ANNOTATIONS
              name: pipeline-install-config
              optional: true
        - name: RUNS_RETENTION_TIME
          valueFrom:
            configMapKeyRef:
              key: RUNS_RETENTION_TIME
              name: pipeline-install-config
              optional: true
        - name: ARCHIVED_RUNS_RETENTION_TIME
          valueFrom:
            configMapKeyRef:
              key: ARCHIVED_RUNS_RETENTION_TIME
              name: pipeline-install-config
              optional: true
        - name: RUNS_GC_INTERVAL
          valueFrom:
            configMapKeyRef:
              key: RUNS_GC_INTERVAL
              name: pipeline-install-config
              optional: true
        - name: RUNS_GC_BATCH_SIZE
          valueFrom:
            configMapKeyRef:
              key: RUNS_GC_BATCH_SIZE
              name: pipeline-install-config
              optional: true
        image: ghcr.io/kubeflow/kfp-api-server:run-37518086931-1
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /apis/v2beta1/healthz
            port: 8888
          initialDelaySeconds: 3
          periodSeconds: 5
          timeoutSeconds: 2
        name: ml-pipeline-api-server
        ports:
        - containerPort: 8443
          name: webhook
        - containerPort: 8888
          name: http
        - containerPort: 8887
          name: grpc
        readinessProbe:
          httpGet:
            path: /apis/v2beta1/healthz
            port: 8888
          initialDelaySeconds: 3
          periodSeconds: 5
          timeoutSeconds: 2
        resources:
          requests:
            cpu: 250m
            memory: 500Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsGroup: 0
          runAsNonRoot: true
          runAsUser: 1000
          seccompProfile:
            type: RuntimeDefault
        startupProbe:
          failureThreshold: 12
          httpGet:
            path: /apis/v2beta1/healthz
            port: 8888
          periodSeconds: 5
          timeoutSeconds: 2
        volumeMounts:
        - mountPath: /etc/kfp-db-ca
          name: db-ca
          readOnly: true
        - mountPath: /etc/webhook/certs
          name: webhook-certs
          readOnly: true
        - mountPath: /etc/mlflow-tracking-ca
          name: mlflow-tracking-ca
          readOnly: true
      initContainers:
      - args:
        - |
          if [ -z "${WAIT_HOST}" ] || [ -z "${WAIT_PORT}" ]; then
            echo "ERROR: WAIT_HOST or WAIT_PORT is not set."
            exit 1
          fi
          MAX_RETRIES=60; i=0
          while ! nc -z -w 2 "${WAIT_HOST}" "${WAIT_PORT}"; do
            i=$((i+1))
            if [ "$i" -ge "$MAX_RETRIES" ]; then
              echo "ERROR: Timed out waiting for ${WAIT_HOST}:${WAIT_PORT} after ${MAX_RETRIES} attempts."
              exit 1
            fi
            echo "Waiting for ${WAIT_HOST}:${WAIT_PORT} (attempt ${i}/${MAX_RETRIES})..."
            sleep 5
          done
        command:
        - /bin/sh
        - -ec
        env:
        - name: WAIT_HOST
          valueFrom:
            configMapKeyRef:
              key: postgresHost
              name: pipeline-install-config
        - name: WAIT_PORT
          valueFrom:
            configMapKeyRef:
              key: postgresPort
              name: pipeline-install-config
        image: docker.io/alpine:3.23
        name: wait-for-database
        resources:
          limits:
            cpu: 100m
            memory: 64Mi
          requests:
            cpu: 10m
            memory: 16Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 1000
          seccompProfile:
            type: RuntimeDefault
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: ml-pipeline
      volumes:
      - name: db-ca
        secret:
          items:
          - key: ca.crt
            path: ca.crt
          secretName: kubeflow-pipelines-db-ca
      - name: webhook-certs
        secret:
          secretName: kfp-api-webhook-cert
      - configMap:
          name: mlflow-tracking-ca
          optional: true
        name: mlflow-tracking-ca

{{- end }}
