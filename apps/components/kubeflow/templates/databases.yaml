apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  name: kubeflow-pipelines-db
  namespace: ml
spec:
  instances: 1
  {{- with .Values.databaseNodeSelector }}
  affinity:
    nodeSelector:
      {{- toYaml . | nindent 6 }}
  {{- end }}
  resources:
    requests: {cpu: 50m, memory: 256Mi}
    limits: {memory: 1Gi}
  bootstrap:
    initdb:
      database: mlpipeline
      owner: kfp
      secret:
        name: kubeflow-pipelines-db-credentials
      postInitSQL:
        - CREATE DATABASE cachedb OWNER kfp
        - CREATE DATABASE metadb OWNER kfp
  managed:
    roles:
      # The KFP API server runs CREATE DATABASE on every start, and PostgreSQL
      # checks CREATEDB before noticing that mlpipeline already exists.
      - name: kfp
        login: true
        createdb: true
  storage:
    storageClass: {{ .Values.storageClass | quote }}
    size: {{ .Values.databaseStorage.pipelines }}
---
