apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mlpipeline-minio-artifact
  namespace: kubeflow
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: mlpipeline-minio-artifact
  data:
    - secretKey: accesskey
      remoteRef:
        key: KUBEFLOW_RUSTFS_ACCESS_KEY
    - secretKey: secretkey
      remoteRef:
        key: KUBEFLOW_RUSTFS_SECRET_KEY
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kubeflow-pipelines-db-credentials
  namespace: kubeflow
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: kubeflow-pipelines-db-credentials
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      data:
        username: kfp
        password: {{ `"{{ .password }}"` }}
  data:
    - secretKey: password
      remoteRef:
        key: KUBEFLOW_KFP_POSTGRES_PASSWORD
---
