apiVersion: v1
kind: ServiceAccount
metadata:
  name: model-registry-server
  namespace: ml
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: model-registry-ui
  namespace: ml
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: model-registry-create-sars
rules:
- apiGroups:
  - authorization.k8s.io
  resources:
  - subjectaccessreviews
  verbs:
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: model-registry-retrieve-clusterrolebindings
rules:
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - clusterrolebindings
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: model-registry-ui-services-reader
rules:
- apiGroups:
  - ""
  resources:
  - services
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: model-registry-create-sars-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: model-registry-create-sars
subjects:
- kind: ServiceAccount
  name: model-registry-ui
  namespace: ml
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: model-registry-retrieve-clusterrolebindings-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: model-registry-retrieve-clusterrolebindings
subjects:
- kind: ServiceAccount
  name: model-registry-ui
  namespace: ml
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: model-registry-ui-services-reader-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: model-registry-ui-services-reader
subjects:
- kind: ServiceAccount
  name: model-registry-ui
  namespace: ml
---
apiVersion: v1
data:
  MODEL_REGISTRY_DATA_STORE_TYPE: embedmd
  MODEL_REGISTRY_REST_SERVICE_HOST: model-registry-service
  MODEL_REGISTRY_REST_SERVICE_PORT: "8080"
kind: ConfigMap
metadata:
  labels:
    component: model-registry-server
  name: model-registry-configmap
  namespace: ml
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    description: An example model registry
    displayName: Kubeflow Model Registry
  labels:
    app: model-registry-service
    app.kubernetes.io/component: model-registry
    app.kubernetes.io/instance: model-registry-service
    app.kubernetes.io/name: model-registry-service
    app.kubernetes.io/part-of: model-registry
    component: model-registry
  name: model-registry-service
  namespace: ml
spec:
  ports:
  - appProtocol: http
    name: http-api
    port: 8080
    protocol: TCP
  selector:
    component: model-registry-server
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: model-registry-ui
    run: model-registry-ui
  name: model-registry-ui-service
  namespace: ml
spec:
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: 8080
  selector:
    app: model-registry-ui
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    component: model-registry-server
  name: model-registry-deployment
  namespace: ml
spec:
  replicas: 1
  selector:
    matchLabels:
      component: model-registry-server
  template:
    metadata:
      labels:
        component: model-registry-server
        sidecar.istio.io/inject: "false"
    spec:
      containers:
      - args:
        - --hostname=0.0.0.0
        - --port=8080
        - --datastore-type=embedmd
        - --embedmd-database-type=postgres
        - --embedmd-database-dsn=$(DATABASE_DSN)
        command:
        - /model-registry
        - proxy
        env:
        - name: DATABASE_DSN
          valueFrom:
            secretKeyRef:
              key: dsn
              name: kubeflow-registry-db-credentials
        image: ghcr.io/kubeflow/hub/server:v0.3.17
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /readyz/isDirty
            port: http-api
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        name: rest-container
        ports:
        - containerPort: 8080
          name: http-api
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /readyz/health
            port: http-api
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          limits:
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        startupProbe:
          failureThreshold: 60
          httpGet:
            path: /readyz/isDirty
            port: http-api
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 5
        volumeMounts:
        - mountPath: /etc/db-ca
          name: db-ca
          readOnly: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: model-registry-server
      volumes:
      - name: db-ca
        secret:
          secretName: kubeflow-registry-db-ca
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: model-registry-ui
  name: model-registry-ui
  namespace: ml
spec:
  replicas: 1
  selector:
    matchLabels:
      app: model-registry-ui
  template:
    metadata:
      labels:
        app: model-registry-ui
    spec:
      containers:
      - args:
        - --deployment-mode=kubeflow
        - --port=8080
        image: ghcr.io/kubeflow/hub/ui:v0.3.17
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthcheck
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 30
          successThreshold: 1
          timeoutSeconds: 15
        name: model-registry-ui
        ports:
        - containerPort: 8080
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthcheck
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 15
          periodSeconds: 30
          successThreshold: 1
          timeoutSeconds: 15
        resources:
          limits:
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: model-registry-ui
---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  labels:
    app: model-registry-ui
  name: model-registry-ui
  namespace: ml
spec:
  gateways:
  - kubeflow-gateway
  hosts:
  - '*'
  http:
  - headers:
      request:
        add:
          x-forwarded-prefix: /model-registry
    match:
    - uri:
        prefix: /model-registry/
    rewrite:
      uri: /
    route:
    - destination:
        host: model-registry-ui-service.ml.svc.cluster.local
        port:
          number: 80
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  labels:
    app: model-registry-ui
  name: model-registry-ui
  namespace: ml
spec:
  action: ALLOW
  rules:
  - from:
    - source:
        principals:
        - cluster.local/ns/istio-system/sa/istio-ingressgateway-service-account
  selector:
    matchLabels:
      app: model-registry-ui
