            configMapKeyRef:
              key: pipelineDb
              name: pipeline-install-config
        - name: DBCONFIG_POSTGRESQLCONFIG_HOST
          valueFrom:
            configMapKeyRef:
              key: postgresHost
              name: pipeline-install-config
        - name: DBCONFIG_POSTGRESQLCONFIG_PORT
          valueFrom:
            configMapKeyRef:
              key: postgresPort
              name: pipeline-install-config
        - name: DBCONFIG_POSTGRESQLCONFIG_EXTRAPARAMS
