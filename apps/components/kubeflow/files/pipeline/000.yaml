              optional: true
        - name: OBJECTSTORECONFIG_ACCESSKEY
          valueFrom:
            secretKeyRef:
              key: accesskey
              name: mlpipeline-minio-artifact
        - name: OBJECTSTORECONFIG_SECRETACCESSKEY
          valueFrom:
            secretKeyRef:
              key: secretkey
              name: mlpipeline-minio-artifact
        - name: COMPILED_PIPELINE_SPEC_PATCH
          value: '{}'
        - name: DEFAULT_SECURITY_CONTEXT_RUN_AS_USER
          valueFrom:
            configMapKeyRef:
              key: defaultSecurityContextRunAsUser
              name: pipeline-install-config
              optional: true
        - name: DEFAULT_SECURITY_CONTEXT_RUN_AS_GROUP
          valueFrom:
            configMapKeyRef:
              key: defaultSecurityContextRunAsGroup
              name: pipeline-install-config
              optional: true
        - name: DEFAULT_SECURITY_CONTEXT_RUN_AS_NON_ROOT
          valueFrom:
            configMapKeyRef:
              key: defaultSecurityContextRunAsNonRoot
              name: pipeline-install-config
              optional: true
        - name: DEFAULT_SECURITY_CONTEXT_HOST_USERS
          valueFrom:
            configMapKeyRef:
              key: defaultSecurityContextHostUsers
              name: pipeline-install-config
              optional: true
        - name: DRIVER_POD_LABELS
          valueFrom:
            configMapKeyRef:
              key: DRIVER_POD_LABELS
              name: pipeline-install-config
              optional: true
        - name: DRIVER_POD_ANNOTATIONS
          valueFrom:
            configMapKeyRef:
              key: DRIVER_POD_ANNOTATIONS
              name: pipeline-install-config
              optional: true
        - name: RUNS_RETENTION_TIME
          valueFrom:
            configMapKeyRef:
              key: RUNS_RETENTION_TIME
              name: pipeline-install-config
              optional: true
        - name: ARCHIVED_RUNS_RETENTION_TIME
          valueFrom:
            configMapKeyRef:
              key: ARCHIVED_RUNS_RETENTION_TIME
              name: pipeline-install-config
              optional: true
        - name: RUNS_GC_INTERVAL
          valueFrom:
            configMapKeyRef:
              key: RUNS_GC_INTERVAL
              name: pipeline-install-config
              optional: true
        - name: RUNS_GC_BATCH_SIZE
          valueFrom:
            configMapKeyRef:
              key: RUNS_GC_BATCH_SIZE
              name: pipeline-install-config
              optional: true
        image: ghcr.io/kubeflow/kfp-api-server:run-37518086931-1
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /apis/v2beta1/healthz
            port: 8888
          initialDelaySeconds: 3
          periodSeconds: 5
          timeoutSeconds: 2
        name: ml-pipeline-api-server
        ports:
        - containerPort: 8443
          name: webhook
        - containerPort: 8888
          name: http
        - containerPort: 8887
          name: grpc
        readinessProbe:
          httpGet:
            path: /apis/v2beta1/healthz
            port: 8888
          initialDelaySeconds: 3
          periodSeconds: 5
          timeoutSeconds: 2
        resources:
          requests:
            cpu: 250m
            memory: 500Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsGroup: 0
          runAsNonRoot: true
          runAsUser: 1000
          seccompProfile:
            type: RuntimeDefault
        startupProbe:
          failureThreshold: 12
          httpGet:
            path: /apis/v2beta1/healthz
            port: 8888
          periodSeconds: 5
          timeoutSeconds: 2
        volumeMounts:
        - mountPath: /etc/kfp-db-ca
          name: db-ca
          readOnly: true
        - mountPath: /etc/webhook/certs
          name: webhook-certs
          readOnly: true
        - mountPath: /etc/mlflow-tracking-ca
          name: mlflow-tracking-ca
          readOnly: true
      initContainers:
      - args:
        - |
          if [ -z "${WAIT_HOST}" ] || [ -z "${WAIT_PORT}" ]; then
            echo "ERROR: WAIT_HOST or WAIT_PORT is not set."
            exit 1
          fi
          MAX_RETRIES=60; i=0
          while ! nc -z -w 2 "${WAIT_HOST}" "${WAIT_PORT}"; do
            i=$((i+1))
            if [ "$i" -ge "$MAX_RETRIES" ]; then
              echo "ERROR: Timed out waiting for ${WAIT_HOST}:${WAIT_PORT} after ${MAX_RETRIES} attempts."
              exit 1
            fi
            echo "Waiting for ${WAIT_HOST}:${WAIT_PORT} (attempt ${i}/${MAX_RETRIES})..."
            sleep 5
          done
        command:
        - /bin/sh
        - -ec
        env:
        - name: WAIT_HOST
          valueFrom:
            configMapKeyRef:
              key: postgresHost
              name: pipeline-install-config
        - name: WAIT_PORT
          valueFrom:
            configMapKeyRef:
              key: postgresPort
              name: pipeline-install-config
        image: docker.io/alpine:3.23
        name: wait-for-database
        resources:
          limits:
            cpu: 100m
            memory: 64Mi
          requests:
            cpu: 10m
            memory: 16Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 1000
          seccompProfile:
            type: RuntimeDefault
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: ml-pipeline
      volumes:
      - name: db-ca
        secret:
          items:
          - key: ca.crt
            path: ca.crt
          secretName: kubeflow-pipelines-db-ca
      - name: webhook-certs
        secret:
          secretName: kfp-api-webhook-cert
      - configMap:
          name: mlflow-tracking-ca
          optional: true
        name: mlflow-tracking-ca
