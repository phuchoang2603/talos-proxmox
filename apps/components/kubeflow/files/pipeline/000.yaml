apiVersion: v1
data:
  image: ghcr.io/kubeflow/kfp-frontend:run-37518086931-1
  job-template: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      # The generated ConfigMap hash also names the Job, allowing image/template upgrades.
      name: ml-pipeline-ui-signing-key-init
    spec:
      backoffLimit: 3
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            sidecar.istio.io/inject: "false"
        spec:
          serviceAccountName: ml-pipeline-ui-signing-key-init
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: initialize
              image: ghcr.io/kubeflow/kfp-frontend:dummy
              imagePullPolicy: IfNotPresent
              workingDir: /server
              command: [node, dist/initialize-tensorboard-signing-key.js]
              env:
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: SIGNING_SECRET_NAME
                  valueFrom:
                    configMapKeyRef:
                      name: ml-pipeline-ui-signing-key-init
                      key: secretName
                - name: SIGNING_SECRET_KEY
                  valueFrom:
                    configMapKeyRef:
                      name: ml-pipeline-ui-signing-key-init
                      key: secretKey
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
  secretKey: signing-secret
  secretName: ml-pipeline-ui-tensorboard-proxy
kind: ConfigMap
metadata:
  labels:
    application-crd-id: kubeflow-pipelines
  name: ml-pipeline-ui-signing-key-init-ck7h5945f2
  namespace: kubeflow
