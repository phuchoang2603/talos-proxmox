cilium:
  # Talos 1.13: https://www.talos.dev/v1.13/kubernetes-guides/network/deploying-cilium/
  ipam:
    mode: kubernetes
  kubeProxyReplacement: true
  resources:
    requests:
      cpu: 100m
      memory: 320Mi
    limits:
      memory: 768Mi
  k8sServiceHost: localhost
  k8sServicePort: "7445"
  securityContext:
    capabilities:
      ciliumAgent:
        - CHOWN
        - KILL
        - NET_ADMIN
        - NET_RAW
        - IPC_LOCK
        - SYS_ADMIN
        - SYS_RESOURCE
        - DAC_OVERRIDE
        - FOWNER
        - SETGID
        - SETUID
      cleanCiliumState:
        - NET_ADMIN
        - SYS_ADMIN
        - SYS_RESOURCE
  cgroup:
    autoMount:
      enabled: false
    hostRoot: /sys/fs/cgroup
  devices: eth0
  # KubeSpan MTU 1420 minus VXLAN overhead for cross-site pod traffic.
  MTU: 1370
  l2announcements:
    enabled: true
  k8sClientRateLimit:
    qps: 20
    burst: 40
  loadBalancer:
    acceleration: best-effort
  cni:
    exclusive: false
  socketLB:
    hostNamespaceOnly: true
  encryption:
    enabled: false
  authentication:
    enabled: false
    mutual:
      spire:
        enabled: false
  l7Proxy: false
  envoy:
    enabled: false
  cluster:
    name: talos
    id: 1
  gatewayAPI:
    enabled: false
  hubble:
    enabled: false
