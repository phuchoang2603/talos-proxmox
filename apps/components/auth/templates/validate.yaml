{{- if and .Values.dex.enabled .Values.dex.configSecret.create }}
{{- fail "Dex configuration must come from an external Secret" }}
{{- end }}
{{- if and .Values.dex.enabled (not .Values.dex.configSecret.name) }}
{{- fail "Dex requires an externally managed config Secret" }}
{{- end }}
{{- if and (index .Values "oauth2-proxy").enabled (not (index .Values "oauth2-proxy").config.existingSecret) }}
{{- fail "OAuth2 Proxy requires an externally managed credential Secret" }}
{{- end }}
{{- range $key := list "issuer" "redirectURI" "grafanaRedirectURI" }}
{{- if not (hasPrefix "https://" (index $.Values.identity $key)) }}
{{- fail (printf "identity.%s must use https:// because Dex is published on the internet" $key) }}
{{- end }}
{{- end }}
{{- if ne .Values.identity.issuer (printf "https://%s/dex" .Values.tunnel.hostname) }}
{{- fail "identity.issuer must be https://<tunnel.hostname>/dex" }}
{{- end }}
