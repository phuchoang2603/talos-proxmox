apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ml-issuer
  namespace: {{ .Values.namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: ml-issuer
  data:
    {{- range $key := list "ML_BUCKET" "ML_REGION" "ML_READER_ROLE_ARN" "ML_WRITER_ROLE_ARN" "ML_TRANSFER_ROLE_ARN" "ML_ISSUER_AWS_ACCESS_KEY_ID" "ML_ISSUER_AWS_SECRET_ACCESS_KEY" }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ $key }}
    {{- end }}
---
# Non-secret storage settings for consumers; storage existing does not mean a dataset is ready.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ml-storage
  namespace: {{ .Values.namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: ml-storage
    template:
      engineVersion: v2
      data:
        bucket: {{ `"{{ .bucket }}"` }}
        region: {{ `"{{ .region }}"` }}
        datasets-prefix: datasets/<export-id>/
        run-prefix: runs/<run-id>/{checkpoints,outputs}/
        endpoint: {{ `"s3.{{ .region }}.amazonaws.com"` }}
  data:
    - secretKey: bucket
      remoteRef:
        key: ML_BUCKET
    - secretKey: region
      remoteRef:
        key: ML_REGION
