# Gateway address for the Longhorn UI, from the environment's Cilium pool.
ingress:
  address: ""

backupCredentials:
  refreshInterval: 1h

longhorn:
  csi:
    attacherReplicaCount: 1
    provisionerReplicaCount: 1
    resizerReplicaCount: 1
    snapshotterReplicaCount: 1
  longhornUI:
    replicas: 1
  # Argo CD runs Helm pre-upgrade hooks before the chart's ServiceAccount exists.
  preUpgradeChecker:
    jobEnabled: false
  defaultSettings:
    createDefaultDiskLabeledNodes: "true"
    autoCleanupSystemGeneratedSnapshot: true
    replicaAutoBalance: best-effort
    snapshotDataIntegrity: fast-check
    storageOverProvisioningPercentage: 200
    storageMinimalAvailablePercentage: 25
  defaultBackupStore:
    backupTarget: "s3://longhorn@us-east-1/"
    backupTargetCredentialSecret: "longhorn-minio-credentials"
  persistence:
    defaultClass: true
    defaultClassReplicaCount: 2
    defaultDataLocality: best-effort
    reclaimPolicy: Delete
    migratable: false
    recurringJobSelector:
      enable: false
