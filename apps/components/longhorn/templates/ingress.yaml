{{- if .Values.ingress.address }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: longhorn
  namespace: {{ .Release.Namespace }}
spec:
  gatewayClassName: cilium
  addresses:
    - type: IPAddress
      value: {{ .Values.ingress.address }}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: longhorn
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: longhorn
      sectionName: http
  rules:
    - backendRefs:
        - name: longhorn-frontend
          port: 80
{{- end }}
