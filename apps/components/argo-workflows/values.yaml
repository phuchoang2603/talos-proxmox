dataNamespace: fraud-data-prod
argo-workflows:
  crds:
    full: false
  controller:
    workflowNamespaces:
      - kubeflow
      - fraud-ml-prod
      - fraud-data-prod
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
  server:
    enabled: true
    replicas: 1
    authModes: [sso]
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        memory: 512Mi
    sso:
      enabled: true
      issuer: https://auth.phuchoang.sbs/dex
      clientId:
        name: argo-workflows-sso
        key: client-id
      clientSecret:
        name: argo-workflows-sso
        key: client-secret
      redirectUrl: https://workflows.phuchoang.sbs/oauth2/callback
      scopes: [profile, email]
      rbac:
        enabled: true
        secretWhitelist:
          - argo-workflows-sso
          - workflows-operator.service-account-token

identity:
  email: xuanphuc.a1gv@gmail.com

tunnel:
  clusterTunnel: talos-proxmox
  hostname: workflows.phuchoang.sbs
