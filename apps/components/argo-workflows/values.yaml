dataNamespace: data
argo-workflows:
  crds:
    full: true
  controller:
    workflowDefaults:
      spec:
        nodeSelector:
          karpenter.sh/nodepool: aws-cpu-burst
    workflowNamespaces:
      - ml
      - data
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
  executor:
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
      runAsNonRoot: true
      runAsUser: 8737
      runAsGroup: 8737
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests: {cpu: 10m, memory: 64Mi}
      limits: {memory: 256Mi}
  server:
    enabled: true
    replicas: 1
    authModes: [sso]
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        memory: 512Mi
    sso:
      enabled: true
      issuer: http://dex.auth.svc.cluster.local:5556/dex
      issuerAlias: https://auth.phuchoang.sbs/dex
      clientId:
        name: argo-workflows-sso
        key: client-id
      clientSecret:
        name: argo-workflows-sso
        key: client-secret
      redirectUrl: https://workflows.phuchoang.sbs/oauth2/callback
      scopes: [profile, email]
      rbac:
        enabled: true
        secretWhitelist:
          - argo-workflows-sso
          - workflows-operator.service-account-token

identity:
  email: xuanphuc.a1gv@gmail.com

tunnel:
  clusterTunnel: talos-proxmox
  hostname: workflows.phuchoang.sbs
