dataNamespace: gateway-data
argo-workflows:
  crds:
    full: true
  controller:
    workflowNamespaces:
      - gateway-ml
      - gateway-data
    resources:
      requests:
        cpu: 25m
      limits:
        memory: 192Mi
  executor:
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
      runAsNonRoot: true
      runAsUser: 8737
      runAsGroup: 8737
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests: {cpu: 10m}
      limits: {memory: 128Mi}
  server:
    enabled: true
    replicas: 1
    authModes: [sso]
    resources:
      requests:
        cpu: 10m
      limits:
        memory: 128Mi
    sso:
      enabled: true
      issuer: http://dex.auth.svc.cluster.local:5556/dex
      issuerAlias: https://auth.phuchoang.sbs/dex
      clientId:
        name: argo-workflows-sso
        key: client-id
      clientSecret:
        name: argo-workflows-sso
        key: client-secret
      redirectUrl: https://workflows.phuchoang.sbs/oauth2/callback
      scopes: [profile, email]
      rbac:
        enabled: true
        secretWhitelist:
          - argo-workflows-sso
          - workflows-operator.service-account-token

identity:
  email: xuanphuc.a1gv@gmail.com

tunnel:
  clusterTunnel: talos-proxmox
  hostname: workflows.phuchoang.sbs
