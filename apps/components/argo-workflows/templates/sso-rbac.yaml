apiVersion: v1
kind: ServiceAccount
metadata:
  name: workflows-operator
  namespace: {{ .Release.Namespace }}
  annotations:
    workflows.argoproj.io/rbac-rule: {{ printf "email == '%s'" .Values.identity.email | quote }}
    workflows.argoproj.io/rbac-rule-precedence: "1"
---
apiVersion: v1
kind: Secret
metadata:
  name: workflows-operator.service-account-token
  namespace: {{ .Release.Namespace }}
  annotations:
    kubernetes.io/service-account.name: workflows-operator
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: workflows-operator
rules:
  - apiGroups: [argoproj.io]
    resources: [workflows, workflowtemplates, clusterworkflowtemplates, cronworkflows, workfloweventbindings, eventsources, sensors]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [argoproj.io]
    resources: [workflowtaskresults]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [namespaces, pods, events, configmaps]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: workflows-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: workflows-operator
subjects:
  - kind: ServiceAccount
    name: workflows-operator
    namespace: {{ .Release.Namespace }}
