apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: argo-workflows-controller
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: argo-workflows-workflow-controller
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      honorLabels: true
      interval: 30s
