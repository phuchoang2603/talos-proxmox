argo-rollouts:
  installCRDs: true
  keepCRDs: true
  clusterInstall: true
  crdAnnotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false

  serviceAccount:
    name: argo-rollouts

  providerRBAC:
    enabled: false

  podSecurityContext:
    runAsNonRoot: true
    fsGroup: 999

  controller:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi
    metrics:
      enabled: true
    initContainers:
      - name: copy-gateway-api-plugin
        image: ghcr.io/argoproj-labs/rollouts-plugin-trafficrouter-gatewayapi:v0.17.0@sha256:bc40d5edf13307e455f6c18cbf9cc79715165cbee8b05a674fd88119f119d4a2
        imagePullPolicy: IfNotPresent
        command:
          - /bin/sh
          - -c
        args:
          - cp /bin/rollouts-plugin-trafficrouter-gatewayapi /plugins/rollouts-plugin-trafficrouter-gatewayapi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 999
        volumeMounts:
          - name: gateway-api-plugin
            mountPath: /plugins
    trafficRouterPlugins:
      - name: argoproj-labs/gatewayAPI
        location: file:///plugins/rollouts-plugin-trafficrouter-gatewayapi
        args:
          - -logformat=json
    volumes:
      - name: gateway-api-plugin
        emptyDir: {}
    volumeMounts:
      - name: gateway-api-plugin
        mountPath: /plugins
        readOnly: true

  dashboard:
    enabled: false

gatewayPlugin:
  serviceAccountName: argo-rollouts
