storageClass: local-path
agentregistry:
  fullnameOverride: agentregistry
  image: {tag: "v0.4.0"}
  rbac:
    watchedNamespaces: [ml]
  service:
    type: ClusterIP
    ports: {http: 12121, mcp: 31313}
  resources:
    requests: {cpu: 50m, memory: 256Mi}
    limits: {memory: 1Gi}
  database:
    postgres:
      type: external
      external:
        secretRef: {name: agentregistry-database, key: url}

identity:
  clientID: agentregistry-ui

tunnel:
  clusterTunnel: talos-proxmox
  hostname: agentregistry.phuchoang.sbs

oauth2-proxy:
  enabled: true
  fullnameOverride: agentregistry-ui-auth
  image: {tag: v7.15.5}
  config:
    existingSecret: agentregistry-ui-oidc
    cookieName: __Host-agentregistry
    emailDomains: []
    upstreams: [http://agentregistry.agentregistry.svc.cluster.local:12121]
  authenticatedEmailsFile:
    enabled: true
    restricted_access: |-
      xuanphuc.a1gv@gmail.com
  extraArgs:
    provider: oidc
    oidc-issuer-url: https://auth.phuchoang.sbs/dex
    skip-oidc-discovery: "true"
    login-url: https://auth.phuchoang.sbs/dex/auth
    redeem-url: http://dex.auth.svc.cluster.local:5556/dex/token
    oidc-jwks-url: http://dex.auth.svc.cluster.local:5556/dex/keys
    redirect-url: https://agentregistry.phuchoang.sbs/oauth2/callback
    skip-provider-button: "true"
    approval-prompt: auto
    reverse-proxy: "true"
    cookie-secure: "true"
    cookie-samesite: lax
    pass-basic-auth: "false"
  service: {type: ClusterIP}
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 128Mi}
