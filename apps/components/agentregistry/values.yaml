storageClass: local-path
agentregistry:
  fullnameOverride: agentregistry
  image: {tag: "v0.4.0"}
  rbac:
    watchedNamespaces: [gateway-llm]
  service:
    type: ClusterIP
    ports: {http: 12121, mcp: 31313}
  resources:
    requests: {cpu: 10m, memory: 64Mi}
    limits: {memory: 64Mi}
  database:
    postgres:
      type: external
      external:
        secretRef: {name: agentregistry-database, key: url}

tunnel:
  clusterTunnel: talos-proxmox
  hostname: agentregistry.phuchoang.sbs
