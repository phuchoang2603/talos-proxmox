apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: agentregistry-database
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  length: 32
  allowRepeat: true
  noUpper: false
  encoding: hex
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentregistry-database
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: "0"
  target:
    template:
      type: kubernetes.io/basic-auth
      data:
        username: agentregistry
        password: '{{ "{{ .password }}" }}'
        url: 'postgresql://agentregistry:{{ "{{ .password }}" }}@agentregistry-postgres-rw:5432/agentregistry?sslmode=require'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: agentregistry-database
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: agentregistry-postgres
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  instances: 1
  {{- with .Values.databaseNodeSelector }}
  affinity:
    nodeSelector:
      {{- toYaml . | nindent 6 }}
  {{- end }}
  imageName: ghcr.io/cloudnative-pg/postgresql:18.3-system-trixie
  bootstrap:
    initdb:
      database: agentregistry
      owner: agentregistry
      secret: {name: agentregistry-database}
  storage:
    storageClass: {{ .Values.storageClass | quote }}
    size: 2Gi
  resources:
    requests: {cpu: 25m}
    limits: {memory: 256Mi}
