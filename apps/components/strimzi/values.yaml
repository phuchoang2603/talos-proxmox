strimzi-kafka-operator:
  watchAnyNamespace: true
  # Ambient lets the operator reach Kafka and Connect admin ports in namespaces with STRICT mTLS.
  labels:
    istio.io/dataplane-mode: ambient
  # Becomes STRIMZI_IMAGE_PULL_POLICY for every operand, so custom images on a
  # moving tag (KafkaConnect `connect-debezium:main`) are re-pulled on each roll.
  image:
    imagePullPolicy: Always
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      cpu: "1"
      memory: 512Mi
