doppler:
  namespace: kube-system
  name: doppler-token
  key: dopplerToken

external-secrets:
  resources:
    requests:
      cpu: 10m
    limits:
      memory: 128Mi
  webhook:
    resources:
      requests:
        cpu: 10m
      limits:
        memory: 96Mi
  certController:
    resources:
      requests:
        cpu: 10m
      limits:
        memory: 128Mi
