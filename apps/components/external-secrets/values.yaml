stores:
  - name: doppler
    dopplerToken:
      namespace: kube-system
      name: doppler-token
      key: dopplerToken
  - name: marketplace-doppler
    namespaces:
      - ecommerce
    dopplerToken:
      namespace: kube-system
      name: marketplace-doppler-token
      key: dopplerToken
  - name: gateway-doppler
    namespaces:
      - payment-gateway
      - data
      - ml
      - llm
      - llm-agents
    dopplerToken:
      namespace: kube-system
      name: gateway-doppler-token
      key: dopplerToken

external-secrets:
  resources:
    requests:
      cpu: 10m
      memory: 128Mi
    limits:
      memory: 128Mi
  webhook:
    resources:
      requests:
        cpu: 10m
        memory: 96Mi
      limits:
        memory: 96Mi
  certController:
    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        memory: 128Mi
