apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: doppler
  annotations:
    # ESO's webhook validates this resource, so apply it after the operator is healthy.
    argocd.argoproj.io/sync-wave: "1"
spec:
  provider:
    doppler:
      auth:
        secretRef:
          dopplerToken:
            namespace: {{ .Values.dopplerToken.namespace }}
            name: {{ .Values.dopplerToken.name }}
            key: {{ .Values.dopplerToken.key }}
