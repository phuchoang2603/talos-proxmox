{{- range .Values.stores }}
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .name }}
  annotations:
    # ESO's webhook validates this resource, so apply it after the operator is healthy.
    argocd.argoproj.io/sync-wave: "1"
spec:
  {{- with .namespaces }}
  conditions:
    - namespaces:
        {{- toYaml . | nindent 8 }}
  {{- end }}
  provider:
    doppler:
      auth:
        secretRef:
          dopplerToken:
            namespace: {{ .dopplerToken.namespace }}
            name: {{ .dopplerToken.name }}
            key: {{ .dopplerToken.key }}
{{- end }}
