apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: doppler
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  conditions:
    - namespaceSelector:
        matchExpressions:
          - key: platform.phuchoang.sbs/tenant
            operator: DoesNotExist
          - key: app.kubernetes.io/part-of
            operator: NotIn
            values: [kubeflow-profile]
  provider:
    doppler:
      auth:
        secretRef:
          dopplerToken:
            namespace: {{ .Values.doppler.namespace }}
            name: {{ .Values.doppler.name }}
            key: {{ .Values.doppler.key }}
