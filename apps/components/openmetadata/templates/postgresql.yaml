apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  name: openmetadata-postgres
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:16.13
  bootstrap:
    initdb:
      database: openmetadata
      owner: openmetadata
      secret:
        name: openmetadata-postgres-credentials
  storage:
    storageClass: {{ .Values.storageClass | quote }}
    size: 10Gi
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}
