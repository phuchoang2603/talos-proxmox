apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  name: openmetadata-oidc-client
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: openmetadata-oidc-client
    template:
      data:
        client-id: openmetadata
        client-secret: {{ `"{{ .clientSecret }}"` }}
  data:
    - secretKey: clientSecret
      remoteRef:
        key: OPENMETADATA_OIDC_CLIENT_SECRET
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: openmetadata-fernet
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  length: 32
  allowRepeat: true
  noUpper: false
  encoding: base64url
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  name: openmetadata-fernet
spec:
  refreshInterval: "0"
  target:
    name: openmetadata-fernet
    template:
      data:
        key: {{ `"{{ .password }}"` }}
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: openmetadata-fernet
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  name: openmetadata-signing-keys
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: openmetadata-signing-keys
  data:
    - secretKey: private_key.der
      remoteRef:
        key: OPENMETADATA_RSA_PRIVATE_KEY_DER
        decodingStrategy: Base64
    - secretKey: public_key.der
      remoteRef:
        key: OPENMETADATA_RSA_PUBLIC_KEY_DER
        decodingStrategy: Base64
