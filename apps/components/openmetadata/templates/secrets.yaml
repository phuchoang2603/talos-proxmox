{{- range $name, $keys := dict "openmetadata-postgres-credentials" (dict "password" "OPENMETADATA_POSTGRES_PASSWORD") "openmetadata-oidc-client" (dict "clientSecret" "OPENMETADATA_OIDC_CLIENT_SECRET") "openmetadata-fernet" (dict "key" "OPENMETADATA_FERNET_KEY") }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  name: {{ $name }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: {{ $name }}
    {{- if eq $name "openmetadata-postgres-credentials" }}
    template:
      type: kubernetes.io/basic-auth
      data:
        username: openmetadata
        password: {{ `"{{ .password }}"` }}
    {{- else if eq $name "openmetadata-oidc-client" }}
    template:
      data:
        client-id: openmetadata
        client-secret: {{ `"{{ .clientSecret }}"` }}
    {{- end }}
  data:
  {{- range $local, $remote := $keys }}
    - secretKey: {{ $local }}
      remoteRef:
        key: {{ $remote }}
  {{- end }}
---
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  name: openmetadata-signing-keys
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: openmetadata-signing-keys
  data:
    - secretKey: private_key.der
      remoteRef:
        key: OPENMETADATA_RSA_PRIVATE_KEY_DER
        decodingStrategy: Base64
    - secretKey: public_key.der
      remoteRef:
        key: OPENMETADATA_RSA_PUBLIC_KEY_DER
        decodingStrategy: Base64
