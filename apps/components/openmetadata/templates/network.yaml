apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openmetadata-private
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: operators
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.dataNamespace }}
      ports:
        - {port: 8585, protocol: TCP}
