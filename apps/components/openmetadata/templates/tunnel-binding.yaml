apiVersion: networking.cfargotunnel.com/v1alpha1
kind: TunnelBinding
metadata:
  name: openmetadata
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: Service
    name: openmetadata
    spec:
      fqdn: {{ .Values.tunnel.hostname }}
      target: http://openmetadata.{{ .Release.Namespace }}.svc.cluster.local:8585
tunnelRef:
  kind: ClusterTunnel
  name: {{ .Values.tunnel.clusterTunnel }}
