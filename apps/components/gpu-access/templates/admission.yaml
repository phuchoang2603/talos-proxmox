apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: platform-gpu-access
spec:
  failurePolicy: Fail
  reinvocationPolicy: IfNeeded
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
  matchConditions:
    - name: platform-gpu-claim
      expression: >-
        has(object.spec.resourceClaims) &&
        object.spec.resourceClaims.exists(c, has(c.resourceClaimName) && (
        {{- $first := true }}
        {{- range .Values.claims }}
          {{ if not $first }}|| {{ end }}(request.namespace == {{ .namespace | quote }} && c.resourceClaimName == {{ .name | quote }})
          {{- $first = false }}
        {{- end }}
        ))
  variables:
    - name: missingTaintKeys
      expression: >-
        [
          'talos.dev/gpu',
          'burst.talos.dev/gpu-training'
        ].filter(key,
          !has(object.spec.tolerations) || !object.spec.tolerations.exists(t,
            (!has(t.effect) || t.effect == '' || t.effect == 'NoSchedule') && (
              (has(t.operator) && t.operator == 'Exists' && (!has(t.key) || t.key == '' || t.key == key)) ||
              (has(t.key) && t.key == key && (!has(t.operator) || t.operator == 'Equal') && has(t.value) && t.value == 'true')
            )
          )
        )
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          !has(object.spec.tolerations)
          ? [JSONPatch{op: 'add', path: '/spec/tolerations', value: variables.missingTaintKeys.map(key, Object.spec.tolerations{key: key, operator: 'Equal', value: 'true', effect: 'NoSchedule'})}]
          : variables.missingTaintKeys.map(key,
              JSONPatch{op: 'add', path: '/spec/tolerations/-', value: Object.spec.tolerations{key: key, operator: 'Equal', value: 'true', effect: 'NoSchedule'}}
            )
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: platform-gpu-access
spec:
  policyName: platform-gpu-access
