{{- range $id, $t := .Values.tenants }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: {{ $id }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io/foreground
spec:
  project: {{ $id }}
  source:
    repoURL: {{ $t.repo | quote }}
    targetRevision: {{ printf "deploy/%s" $.Values.cluster | quote }}
    path: infra/argocd/app-of-apps
    helm:
      valueFiles:
        - {{ printf "values-%s.yaml" $.Values.cluster }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ $id }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
{{- end }}
