{{- range $id, $t := .Values.tenants }}
{{- with $t.doppler }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $id }}-doppler-token
  namespace: operators
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: {{ $id }}-doppler-token
    creationPolicy: Owner
  data:
    - secretKey: dopplerToken
      remoteRef:
        key: {{ printf "ESO_%s_DOPPLER_TOKEN" (upper $id) }}
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ printf "doppler-%s" $id }}
spec:
  conditions:
    - namespaceSelector:
        matchLabels:
          platform.phuchoang.sbs/tenant: {{ $id }}
      namespaces:
{{- toYaml .namespaces | nindent 8 }}
  provider:
    doppler:
      auth:
        secretRef:
          dopplerToken:
            namespace: operators
            name: {{ $id }}-doppler-token
            key: dopplerToken
{{- end }}
{{- end }}
