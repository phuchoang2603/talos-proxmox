{{- if .Values.platformServices.langfuse }}
{{- range $id, $t := .Values.tenants }}
{{- with $t.langfuse }}
---
{{ include "tenants.secretReader" (dict "name" (printf "%s-langfuse-reader" $id) "namespace" "langfuse" "secret" (printf "langfuse-%s" $id)) }}
---
{{ include "tenants.kubernetesStore" (dict "name" "langfuse" "namespace" .namespace "remoteNamespace" "langfuse" "serviceAccount" (printf "%s-langfuse-reader" $id)) }}
{{- end }}
{{- end }}
{{- end }}
