{{- if .Values.manageClaims }}
{{- range .Values.claims }}
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaim
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  devices:
    requests:
      - name: gpu
        exactly:
          deviceClassName: gpu.nvidia.com
          allocationMode: ExactCount
          count: 1
          {{- with .selectors }}
          selectors:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
{{- end }}
