gpu-operator:
  operator:
    resources:
      requests: {cpu: 10m, memory: 384Mi}
      limits: {memory: 384Mi}
  driver:
    enabled: false
  toolkit:
    enabled: false
  devicePlugin:
    enabled: false
  daemonsets:
    tolerations:
      - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
      - {key: burst.talos.dev/gpu-training, operator: Equal, value: "true", effect: NoSchedule}
  hostPaths:
    driverInstallDir: /usr/local
  cdi:
    enabled: true
  clusterPolicy:
    deployCR: true
  gpuCluster:
    deployCR: false
  dcgmExporter:
    enabled: true
    enablePodUID: true
    env:
      - name: KUBERNETES_ENABLE_DRA
        value: "true"
      - name: DCGM_EXPORTER_INTERVAL
        value: "60000"
    resources:
      requests: {cpu: 50m, memory: 192Mi}
      limits: {memory: 192Mi}
    serviceMonitor:
      enabled: true
      interval: 60s
      scrapeTimeout: 10s
      honorLabels: true
  gfd:
    enabled: false
  migManager:
    enabled: false
  node-feature-discovery:
    master:
      resources:
        requests: {cpu: 10m, memory: 64Mi}
        limits: {memory: 64Mi}
    worker:
      tolerations:
        - {key: node-role.kubernetes.io/control-plane, operator: Equal, value: "", effect: NoSchedule}
        - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
        - {key: burst.talos.dev/gpu-training, operator: Equal, value: "true", effect: NoSchedule}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: extensions.talos.dev/nvidia-open-gpu-kernel-modules-production
                    operator: Exists
      resources:
        requests: {cpu: 10m, memory: 64Mi}
        limits: {memory: 64Mi}
    gc:
      resources:
        requests: {cpu: 5m, memory: 32Mi}
        limits: {memory: 32Mi}

nvidia-dra-driver-gpu:
  nvidiaDriverRoot: /usr/local
  nvidiaCDIHookPath: /usr/local/bin/nvidia-cdi-hook
  gpuResourcesEnabledOverride: true
  kubeletPlugin:
    tolerations:
      - {key: burst.talos.dev/gpu-training, operator: Equal, value: "true", effect: NoSchedule}
  resources:
    gpus:
      enabled: true
    computeDomains:
      enabled: false

manageClaims: false
claims:
  ml:
    namespace: gateway-ml
    name: gpu
    selectors: []
  llm:
    namespace: gateway-llm
    name: gpu
    selectors: []
