gpu-operator:
  # DRA stack (GPUCluster) instead of the device-plugin stack (ClusterPolicy).
  clusterPolicy:
    deployCR: false
  gpuCluster:
    deployCR: true
  # Driver and container toolkit come from Talos system extensions.
  driver:
    enabled: false
  toolkit:
    enabled: false
  devicePlugin:
    enabled: false
  hostPaths:
    driverInstallDir: /usr/local
  cdi:
    enabled: true
  draDriver:
    gpus:
      kubeletPlugin:
        env:
          - name: NVIDIA_CDI_HOOK_PATH
            value: /usr/local/bin/nvidia-cdi-hook
    # Multi-Node NVLink only; not available on Proxmox passthrough GPUs.
    computeDomains:
      enabled: false
  dcgmExporter:
    enabled: true
    # No Prometheus Operator CRDs in the cluster.
    serviceMonitor:
      enabled: false
  gfd:
    enabled: false
  migManager:
    enabled: false
  node-feature-discovery:
    master:
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {memory: 128Mi}
    worker:
      # Only GPU nodes need PCI labelling; Terraform sets this label.
      nodeSelector:
        nvidia.com/gpu.present: "true"
      resources:
        requests: {cpu: 5m, memory: 24Mi}
        limits: {memory: 64Mi}
    gc:
      resources:
        requests: {cpu: 5m, memory: 24Mi}
        limits: {memory: 64Mi}
