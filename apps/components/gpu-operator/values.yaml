gpu-operator:
  driver:
    enabled: false
  toolkit:
    enabled: false
  devicePlugin:
    enabled: false
  hostPaths:
    driverInstallDir: /usr/local
  cdi:
    enabled: true
  clusterPolicy:
    deployCR: true
  gpuCluster:
    deployCR: false
  # Trim optional operands; the DRA driver handles allocation.
  dcgmExporter:
    enabled: true
    resources:
      requests: {cpu: 10m, memory: 64Mi}
      limits: {memory: 256Mi}
  gfd:
    enabled: false
  migManager:
    enabled: false
  node-feature-discovery:
    master:
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {memory: 128Mi}
    worker:
      resources:
        requests: {cpu: 5m, memory: 24Mi}
        limits: {memory: 64Mi}
    gc:
      resources:
        requests: {cpu: 5m, memory: 24Mi}
        limits: {memory: 64Mi}
