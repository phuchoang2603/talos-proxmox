gpu-operator:
  driver:
    enabled: false
  toolkit:
    enabled: false
  devicePlugin:
    enabled: false
  hostPaths:
    driverInstallDir: /usr/local
  cdi:
    enabled: true
  clusterPolicy:
    deployCR: true
  # GPUCluster's driver validation picks driver root "/" on Talos (via the
  # /usr/bin/nvidia-smi symlink) and its DRA plugin then can't find
  # /usr/local/lib/libnvidia-ml.so.1; the nvidia-dra-driver-gpu dependency is used instead.
  gpuCluster:
    deployCR: false
  # Trim optional operands; the DRA driver handles allocation.
  dcgmExporter:
    enabled: false
  gfd:
    enabled: false
  migManager:
    enabled: false
  node-feature-discovery:
    master:
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {memory: 128Mi}
    worker:
      tolerations:
        - {key: node-role.kubernetes.io/control-plane, operator: Equal, value: "", effect: NoSchedule}
        - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
        - {key: burst.talos.dev/stateless, operator: Equal, value: "true", effect: NoSchedule}
        - {key: burst.talos.dev/gpu-training, operator: Equal, value: "true", effect: NoSchedule}
      # Only GPU nodes need PCI labelling. Talos sets this label from the
      # extension; nvidia.com/gpu.present is owned by the operator and is only
      # true after NFD has labelled the node.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: extensions.talos.dev/nvidia-open-gpu-kernel-modules-production
                    operator: Exists
      resources:
        requests: {cpu: 5m, memory: 24Mi}
        limits: {memory: 64Mi}
    gc:
      resources:
        requests: {cpu: 5m, memory: 24Mi}
        limits: {memory: 64Mi}

nvidia-dra-driver-gpu:
  nvidiaDriverRoot: /usr/local
  nvidiaCDIHookPath: /usr/local/bin/nvidia-cdi-hook
  gpuResourcesEnabledOverride: true
  kubeletPlugin:
    tolerations:
      - {key: burst.talos.dev/stateless, operator: Equal, value: "true", effect: NoSchedule}
      - {key: burst.talos.dev/gpu-training, operator: Equal, value: "true", effect: NoSchedule}
  resources:
    gpus:
      enabled: true
    computeDomains:
      enabled: false
