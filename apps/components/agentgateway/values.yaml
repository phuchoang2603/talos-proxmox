agentgateway:
  gatewayClassName: agentgateway
  resources:
    requests:
      cpu: 10m
      memory: 192Mi
    limits:
      memory: 192Mi
  inferenceExtension:
    enabled: true
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile: {type: RuntimeDefault}
  securityContext:
    allowPrivilegeEscalation: false
    capabilities: {drop: [ALL]}
