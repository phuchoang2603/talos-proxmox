flink-kubernetes-operator:
  image:
    tag: 1.16.1
  watchNamespaces: [gateway-data]
  jobServiceAccount:
    create: false
  rbac:
    jobRole:
      create: false
    jobRoleBinding:
      create: false
  operatorPod:
    labels:
      istio.io/dataplane-mode: ambient
    resources:
      requests:
        cpu: 25m
      limits:
        memory: 768Mi
    webhook:
      resources:
        requests:
          cpu: 10m
        limits:
          memory: 512Mi
  jvmArgs:
    operator: -Xmx512m
    webhook: -Xmx256m
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  operatorSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
  webhookSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
