apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flink-checkpoint-storage
  namespace: payment-gateway
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: flink-checkpoint-storage
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: FLINK_RUSTFS_ACCESS_KEY
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: FLINK_RUSTFS_SECRET_KEY
