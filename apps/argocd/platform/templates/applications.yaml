{{- $cluster := .Values.cluster }}
{{- range $name, $app := $.Values.components }}
{{- if has $cluster $app.clusters }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io/foreground
  annotations:
    argocd.argoproj.io/sync-wave: {{ $app.syncWave | quote }}
spec:
  project: talos-proxmox
  source:
    repoURL: {{ $.Values.repoURL | quote }}
    targetRevision: {{ $.Values.targetRevision | quote }}
    path: {{ $app.path }}
{{- if eq ($app.sourceType | default "helm") "kustomize" }}
    kustomize: {}
{{- else }}
    helm:
      releaseName: {{ required (printf "releaseName is required for Helm component %s" $name) $app.releaseName }}
{{- with index ($app.valueFilesByCluster | default dict) $cluster }}
      valueFiles:
{{- toYaml . | nindent 8 }}
{{- end }}
{{- end }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ $app.namespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
{{- toYaml $.Values.syncRetry | nindent 6 }}
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
{{- if $app.ignoreDifferences }}
      - RespectIgnoreDifferences=true
{{- end }}
{{- with $app.managedNamespaceMetadata }}
    managedNamespaceMetadata:
{{- toYaml . | nindent 6 }}
{{- end }}
{{- with $app.ignoreDifferences }}
  ignoreDifferences:
{{- toYaml . | nindent 4 }}
{{- end }}
{{- end }}
{{- end }}
