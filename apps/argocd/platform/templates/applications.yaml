{{- $cluster := .Values.cluster }}
{{- range $name, $app := $.Values.components }}
{{- if has $cluster $app.clusters }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io/foreground
  annotations:
    argocd.argoproj.io/sync-wave: {{ $app.syncWave | quote }}
spec:
  project: talos-proxmox
  source:
    repoURL: {{ $.Values.repoURL | quote }}
    targetRevision: {{ $.Values.targetRevision | quote }}
    path: {{ $app.path }}
    helm:
      releaseName: {{ $app.releaseName }}
{{- with index ($app.valueFilesByCluster | default dict) $cluster }}
      valueFiles:
{{- toYaml . | nindent 8 }}
{{- end }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ $app.namespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
{{- toYaml $.Values.syncRetry | nindent 6 }}
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
{{- if $app.ignoreDifferences }}
      - RespectIgnoreDifferences=true
{{- end }}
{{- with $app.managedNamespaceMetadata }}
    managedNamespaceMetadata:
{{- toYaml . | nindent 6 }}
{{- end }}
{{- if $app.ignoreDifferences }}
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: observability-grafana
      namespace: monitoring
      jsonPointers:
        - /data/admin-password
    - group: ""
      kind: Secret
      name: observability-victoria-metrics-operator-validation
      namespace: monitoring
      jsonPointers:
        - /data
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      name: observability-victoria-metrics-operator-admission
      jqPathExpressions:
        - ".webhooks[]?.clientConfig.caBundle"
    - group: apps
      kind: Deployment
      name: observability-grafana
      namespace: monitoring
      jsonPointers:
        - /spec/template/metadata/annotations/checksum~1secret
{{- end }}
{{- end }}
{{- end }}
