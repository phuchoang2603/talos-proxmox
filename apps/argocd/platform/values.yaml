repoURL: https://github.com/phuchoang2603/talos-proxmox.git
targetRevision: main
# Set by the root Application to the environment this Argo CD runs in.
cluster: ""

# Waves only order Application submission; retries absorb CRDs and
# dependencies that another Application has not finished installing yet.
syncRetry:
  limit: -1
  backoff:
    duration: 10s
    factor: 2
    maxDuration: 5m

privilegedNamespace: &privileged
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged

# Components use Helm by default; set sourceType: kustomize for a Git-owned Kustomization path.
components:
  external-secrets:
    path: apps/components/external-secrets
    namespace: operators
    syncWave: "-3"
    releaseName: external-secrets
    clusters: [dev, prod]
  cilium-network:
    path: apps/components/cilium-network
    namespace: kube-system
    syncWave: "-1"
    releaseName: cilium-network
    clusters: [dev, prod]
    valueFilesByCluster:
      dev:
        - environments/dev/values.yaml
      prod:
        - environments/prod/values.yaml
  istio:
    path: apps/components/istio
    namespace: istio-system
    syncWave: "-2"
    releaseName: istio
    clusters: [dev, prod]
    managedNamespaceMetadata: *privileged
    valueFilesByCluster:
      prod:
        - environments/prod/values.yaml
    ignoreDifferences:
      - group: admissionregistration.k8s.io
        kind: ValidatingWebhookConfiguration
        name: istio-validator-istio-system
        jsonPointers:
          - /webhooks/0/clientConfig/caBundle
          - /webhooks/0/failurePolicy
      - group: admissionregistration.k8s.io
        kind: ValidatingWebhookConfiguration
        name: istiod-default-validator
        jsonPointers:
          - /webhooks/0/clientConfig/caBundle
          - /webhooks/0/failurePolicy
  argo-workflows:
    path: apps/components/argo-workflows
    namespace: argo-workflows
    syncWave: "-1"
    releaseName: argo-workflows
    clusters: [prod]
  auth:
    path: apps/components/auth
    namespace: auth
    syncWave: "0"
    releaseName: auth
    clusters: [prod]
  knative:
    path: apps/components/knative
    namespace: knative-serving
    syncWave: "1"
    releaseName: knative
    clusters: [prod]
    # The Serving webhook rewrites its own rules, client path, CA bundle and selectors.
    ignoreDifferences:
      - group: admissionregistration.k8s.io
        kind: MutatingWebhookConfiguration
        name: webhook.serving.knative.dev
        jsonPointers:
          - /webhooks
      - group: admissionregistration.k8s.io
        kind: ValidatingWebhookConfiguration
        name: validation.webhook.serving.knative.dev
        jsonPointers:
          - /webhooks
  kubeflow:
    path: apps/components/kubeflow
    namespace: kubeflow
    syncWave: "2"
    releaseName: kubeflow
    clusters: [prod]
  metrics-server:
    path: apps/components/metrics-server
    namespace: kube-system
    syncWave: "-1"
    releaseName: metrics-server
    clusters: [dev, prod]
  local-path-provisioner:
    path: apps/components/local-path-provisioner
    namespace: local-path-storage
    syncWave: "0"
    releaseName: local-path-provisioner
    clusters: [dev, prod]
    managedNamespaceMetadata: *privileged
  talos-ccm:
    path: apps/components/talos-ccm
    namespace: kube-system
    syncWave: "-1"
    releaseName: talos-cloud-controller-manager
    clusters: [dev, prod]
  cnpg:
    path: apps/components/cnpg
    namespace: operators
    syncWave: "0"
    releaseName: cnpg
    clusters: [dev, prod]
  cert-manager:
    path: apps/components/cert-manager
    namespace: operators
    syncWave: "0"
    releaseName: cert-manager
    clusters: [dev, prod]
  strimzi:
    path: apps/components/strimzi
    namespace: operators
    syncWave: "0"
    releaseName: strimzi-cluster-operator
    clusters: [dev, prod]
  mongodb-operator:
    path: apps/components/mongodb
    namespace: operators
    syncWave: "0"
    releaseName: mongodb-operator
    clusters: [dev, prod]
  clickhouse-operator:
    path: apps/components/clickhouse-operator
    namespace: operators
    syncWave: "0"
    releaseName: clickhouse-operator
    clusters: [prod]
  gpu-operator:
    path: apps/components/gpu-operator
    namespace: operators
    syncWave: "1"
    releaseName: gpu-operator
    clusters: [dev, prod]
    # Its operands need hostPath and privileged pods, so this relaxes Pod Security for all of `operators`.
    managedNamespaceMetadata: *privileged
  observability:
    path: apps/components/observability
    namespace: observability
    syncWave: "1"
    releaseName: observability
    clusters: [prod]
    managedNamespaceMetadata: *privileged
  cloudflare-tunnel:
    path: apps/components/cloudflare-tunnel
    releaseName: cloudflare-tunnel
    namespace: cloudflare-operator-system
    syncWave: "2"
    clusters: [dev, prod]
    valueFilesByCluster:
      dev:
        - environments/dev/values.yaml
      prod:
        - environments/prod/values.yaml
