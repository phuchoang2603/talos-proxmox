repoURL: https://github.com/phuchoang2603/talos-proxmox.git
targetRevision: main
# Set by the root Application to the environment this Argo CD runs in.
cluster: ""

# Waves only order Application submission; retries absorb CRDs and
# dependencies that another Application has not finished installing yet.
syncRetry:
  limit: -1
  backoff:
    duration: 10s
    factor: 2
    maxDuration: 5m

privilegedNamespace: &privileged
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged

# Components use Helm by default; set sourceType: kustomize for a Git-owned Kustomization path.
components:
  argocd-post:
    path: apps/components/argocd-post
    namespace: argo-cd
    syncWave: "-4"
    releaseName: argocd-post
    clusters: [dev, prod]
    valueFilesByCluster:
      dev:
        - environments/dev/values.yaml
  external-secrets:
    path: apps/components/external-secrets
    namespace: operators
    syncWave: "-3"
    releaseName: external-secrets
    clusters: [dev, prod]
  istio:
    path: apps/components/istio
    namespace: istio-system
    syncWave: "-2"
    releaseName: istio
    clusters: [dev, prod]
    managedNamespaceMetadata: *privileged
    ignoreDifferences:
      - group: admissionregistration.k8s.io
        kind: ValidatingWebhookConfiguration
        name: istio-validator-istio-system
        jsonPointers:
          - /webhooks/0/clientConfig/caBundle
          - /webhooks/0/failurePolicy
      - group: admissionregistration.k8s.io
        kind: ValidatingWebhookConfiguration
        name: istiod-default-validator
        jsonPointers:
          - /webhooks/0/clientConfig/caBundle
          - /webhooks/0/failurePolicy
  argo-workflows:
    path: apps/components/argo-workflows
    namespace: operators
    syncWave: "-1"
    releaseName: argo-workflows
    clusters: [dev, prod]
    valueFilesByCluster:
      dev:
        - environments/dev/values.yaml
  spark-operator:
    path: apps/components/spark-operator
    namespace: operators
    syncWave: "0"
    releaseName: spark-operator
    clusters: [dev, prod]
  flink-operator:
    path: apps/components/flink-operator
    namespace: operators
    syncWave: "1"
    releaseName: flink-kubernetes-operator
    clusters: [dev, prod]
  iceberg-catalog:
    path: apps/components/iceberg-catalog
    namespace: data
    syncWave: "1"
    releaseName: iceberg-catalog
    clusters: [dev, prod]
    valueFilesByCluster:
      prod:
        - environments/prod/values.yaml
  starrocks:
    path: apps/components/starrocks
    namespace: data
    syncWave: "1"
    releaseName: starrocks
    clusters: [dev, prod]
    valueFilesByCluster:
      prod:
        - environments/prod/values.yaml
  auth:
    path: apps/components/auth
    namespace: auth
    syncWave: "0"
    releaseName: auth
    clusters: [dev, prod]
    valueFilesByCluster:
      dev:
        - environments/dev/values.yaml
  knative:
    enabled: true
    path: apps/components/knative
    namespace: knative-serving
    syncWave: "1"
    releaseName: knative
    clusters: [dev, prod]
    # The Serving webhook rewrites its own rules, client path, CA bundle and selectors.
    ignoreDifferences:
      - group: admissionregistration.k8s.io
        kind: MutatingWebhookConfiguration
        name: webhook.serving.knative.dev
        jsonPointers:
          - /webhooks
      - group: admissionregistration.k8s.io
        kind: ValidatingWebhookConfiguration
        name: validation.webhook.serving.knative.dev
        jsonPointers:
          - /webhooks
  kubeflow:
    pruneLast: true
    path: apps/components/kubeflow
    namespace: ml
    syncWave: "2"
    releaseName: kubeflow
    clusters: [dev, prod]
    valueFilesByCluster:
      dev:
        - environments/dev/values.yaml
      prod:
        - environments/prod/values.yaml
  openmetadata:
    path: apps/components/openmetadata
    namespace: data
    syncWave: "3"
    releaseName: openmetadata
    clusters: [dev, prod]
    valueFilesByCluster:
      dev:
        - environments/dev/values.yaml
      prod:
        - environments/prod/values.yaml
  metrics-server:
    path: apps/components/metrics-server
    namespace: kube-system
    syncWave: "-1"
    releaseName: metrics-server
    clusters: [dev, prod]
  ebs-csi:
    path: apps/components/ebs-csi
    namespace: operators
    syncWave: "0"
    releaseName: ebs-csi
    clusters: [prod]
    managedNamespaceMetadata: *privileged
  local-path-provisioner:
    path: apps/components/local-path-provisioner
    namespace: operators
    syncWave: "0"
    releaseName: local-path-provisioner
    clusters: [dev]
    managedNamespaceMetadata: *privileged
  cnpg:
    path: apps/components/cnpg
    namespace: operators
    syncWave: "0"
    releaseName: cnpg
    clusters: [dev, prod]
  cert-manager:
    path: apps/components/cert-manager
    namespace: operators
    syncWave: "0"
    releaseName: cert-manager
    clusters: [dev, prod]
  strimzi:
    path: apps/components/strimzi
    namespace: operators
    syncWave: "0"
    releaseName: strimzi-cluster-operator
    clusters: [dev, prod]
  redis-operator:
    path: apps/components/redis-operator
    namespace: operators
    syncWave: "0"
    releaseName: redis-operator
    clusters: [dev, prod]
  gpu-operator:
    path: apps/components/gpu-operator
    namespace: operators
    syncWave: "1"
    releaseName: gpu-operator
    clusters: [dev, prod]
    # Its operands need hostPath and privileged pods, so this relaxes Pod Security for all of `operators`.
    managedNamespaceMetadata: *privileged
  observability:
    path: apps/components/observability
    namespace: observability
    syncWave: "1"
    releaseName: observability
    clusters: [dev, prod]
    managedNamespaceMetadata: *privileged
    valueFilesByCluster:
      dev:
        - environments/dev/values.yaml
      prod:
        - environments/prod/values.yaml
  cloudflare-tunnel:
    path: apps/components/cloudflare-tunnel
    releaseName: cloudflare-tunnel
    namespace: operators
    syncWave: "2"
    clusters: [dev, prod]
    valueFilesByCluster:
      dev:
        - environments/dev/values.yaml
      prod:
        - environments/prod/values.yaml
  agentgateway:
    path: apps/components/agentgateway
    namespace: operators
    syncWave: "3"
    releaseName: agentgateway
    clusters: [dev, prod]
  substrate:
    path: apps/components/substrate
    namespace: ate-system
    syncWave: "3"
    releaseName: substrate
    clusters: [dev, prod]
    managedNamespaceMetadata: *privileged
    valueFilesByCluster:
      prod:
        - environments/prod/values.yaml
  kagent:
    path: apps/components/kagent
    namespace: kagent
    syncWave: "4"
    releaseName: kagent
    clusters: [dev, prod]
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/audit: privileged
        pod-security.kubernetes.io/warn: privileged
        istio.io/dataplane-mode: ambient
    valueFilesByCluster:
      prod:
        - environments/prod/values.yaml
  agentregistry:
    path: apps/components/agentregistry
    namespace: agentregistry
    syncWave: "4"
    releaseName: agentregistry
    clusters: [dev, prod]
    valueFilesByCluster:
      prod:
        - environments/prod/values.yaml
