repoURL: https://github.com/phuchoang2603/talos-proxmox.git
targetRevision: main
# Set by the root Application to the environment this Argo CD runs in.
cluster: ""

# Waves only order Application submission; retries absorb CRDs and
# dependencies that another Application has not finished installing yet.
syncRetry:
  limit: -1
  backoff:
    duration: 10s
    factor: 2
    maxDuration: 5m

privilegedNamespace: &privileged
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged

components:
  external-secrets:
    path: apps/components/external-secrets
    namespace: operators
    syncWave: "-3"
    releaseName: external-secrets
    clusters: [dev, prod]
  cilium-network:
    path: apps/components/cilium-network
    namespace: kube-system
    syncWave: "-1"
    releaseName: cilium-network
    clusters: [dev, prod]
    valueFilesByCluster:
      dev:
        - environments/dev/values.yaml
      prod:
        - environments/prod/values.yaml
  metrics-server:
    path: apps/components/metrics-server
    namespace: kube-system
    syncWave: "-1"
    releaseName: metrics-server
    clusters: [dev, prod]
  local-path-provisioner:
    path: apps/components/local-path-provisioner
    namespace: local-path-storage
    syncWave: "0"
    releaseName: local-path-provisioner
    clusters: [dev, prod]
    managedNamespaceMetadata: *privileged
  talos-ccm:
    path: apps/components/talos-ccm
    namespace: kube-system
    syncWave: "-1"
    releaseName: talos-cloud-controller-manager
    clusters: [dev, prod]
  cnpg:
    path: apps/components/cnpg
    namespace: operators
    syncWave: "0"
    releaseName: cnpg
    clusters: [dev, prod]
  strimzi:
    path: apps/components/strimzi
    namespace: operators
    syncWave: "0"
    releaseName: strimzi-cluster-operator
    clusters: [dev, prod]
  mongodb-operator:
    path: apps/components/mongodb
    namespace: operators
    syncWave: "0"
    releaseName: mongodb-operator
    clusters: [dev, prod]
  gpu-operator:
    path: apps/components/gpu-operator
    namespace: operators
    syncWave: "1"
    releaseName: gpu-operator
    clusters: [dev, prod]
    # Its operands need hostPath and privileged pods, so this relaxes Pod Security for all of `operators`.
    managedNamespaceMetadata: *privileged
  cloudflare-tunnel:
    path: apps/components/cloudflare-tunnel
    releaseName: cloudflare-tunnel
    namespace: cloudflare-tunnel
    syncWave: "2"
    clusters: [dev, prod]
    valueFilesByCluster:
      prod:
        - environments/prod/values.yaml
