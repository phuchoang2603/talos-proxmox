apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform
  namespace: {{ .Release.Namespace }}
spec:
  project: talos-proxmox
  source:
    repoURL: {{ .Values.repoURL | quote }}
    targetRevision: {{ .Values.targetRevision | quote }}
    path: apps/argocd/platform
    helm:
      parameters:
        - name: cluster
          value: {{ .Values.cluster | quote }}
        - name: cloudProvider
          value: {{ .Values.cloudProvider | quote }}
        - name: cloudRegion
          value: {{ .Values.cloudRegion | quote }}
        - name: repoURL
          value: {{ .Values.repoURL | quote }}
        - name: targetRevision
          value: {{ .Values.targetRevision | quote }}
        {{- range $name, $value := .Values.cloudStorage }}
        - name: cloudStorage.{{ $name }}
          value: {{ $value | quote }}
        {{- end }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Release.Namespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
