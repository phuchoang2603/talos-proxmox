{{- with .Values.gateway }}
{{- if .address }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: argocd
  namespace: {{ $.Release.Namespace }}
spec:
  gatewayClassName: cilium
  addresses:
    - type: IPAddress
      value: {{ .address }}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: {{ $.Release.Namespace }}
spec:
  parentRefs:
    - name: argocd
      sectionName: http
  rules:
    - backendRefs:
        - name: {{ .backendService }}
          port: {{ .backendPort }}
{{- end }}
{{- end }}
