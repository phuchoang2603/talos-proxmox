apiVersion: v1
kind: Service
metadata:
  name: argocd-ui
  namespace: {{ .Release.Namespace }}
  annotations:
    lbipam.cilium.io/ips: {{ required "Argo CD UI address is required" (index .Values.ui.addresses .Values.cluster) | quote }}
spec:
  type: LoadBalancer
  ports:
    - name: http
      port: 80
      targetPort: 8080
  selector:
    app.kubernetes.io/name: argocd-server
    app.kubernetes.io/instance: argo-cd
